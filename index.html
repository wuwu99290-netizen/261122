<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>文明時代 II：網頁霸業版 (Age of History II)</title>
<style>
  :root {
    --bg-deep: #0b131e;
    --bg-panel: rgba(16, 23, 34, 0.94);
    --bg-panel-solid: #101722;
    --bg-card: rgba(26, 36, 52, 0.9);
    --bg-hover: rgba(42, 56, 78, 0.95);
    --border-gold: rgba(212, 168, 83, 0.45);
    --border-subtle: rgba(148, 163, 184, 0.18);
    --gold: #e5b95c;
    --gold-dim: #b58d3d;
    --text-main: #edf2f7;
    --text-muted: #94a3b8;
    --green: #4ade80;
    --red: #f87171;
    --blue: #60a5fa;
    --amber: #fbbf24;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: "Inter", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
    font-size: 13px;
  }

  #game-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  #map-canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  #map-canvas:active {
    cursor: grabbing;
  }
  #map-canvas.crosshair {
    cursor: crosshair;
  }

  /* ===== Title / Scenario Overlay ===== */
  #title-screen {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: radial-gradient(circle at 50% 25%, rgba(28, 43, 66, 0.96), rgba(9, 14, 22, 0.99));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
  }
  #title-screen.hidden {
    display: none;
  }

  .title-box {
    width: 100%;
    max-width: 820px;
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 14px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
    padding: 24px;
    max-height: 92vh;
    overflow-y: auto;
  }

  .title-header {
    text-align: center;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 16px;
  }
  .title-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
    background: rgba(229, 185, 92, 0.12);
    border: 1px solid var(--border-gold);
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .title-header h1 {
    margin: 0;
    font-size: clamp(22px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #fff4d2 0%, #e5b95c 65%, #a87b28 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title-header p {
    margin: 6px 0 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  .scenario-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  .scenario-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
  }
  .scenario-card:hover {
    border-color: var(--gold-dim);
    background: var(--bg-hover);
  }
  .scenario-card.active {
    border-color: var(--gold);
    background: rgba(229, 185, 92, 0.14);
    box-shadow: 0 0 0 1px var(--gold) inset;
  }
  .scenario-card .sc-year {
    font-size: 11px;
    color: var(--gold);
    font-weight: 700;
  }
  .scenario-card .sc-name {
    font-size: 15px;
    font-weight: 700;
    margin: 2px 0 4px;
    color: var(--text-main);
  }
  .scenario-card .sc-desc {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
    margin: 0 0 8px;
  }

  .civ-picker {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
    max-height: 210px;
    overflow-y: auto;
    padding-right: 4px;
    margin-bottom: 18px;
  }
  .civ-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .civ-opt:hover {
    background: var(--bg-hover);
  }
  .civ-opt.active {
    border-color: var(--gold);
    background: rgba(229, 185, 92, 0.16);
  }
  .flag-mini {
    width: 26px;
    height: 18px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.28);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .civ-opt-info {
    min-width: 0;
  }
  .civ-opt-name {
    font-weight: 700;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .civ-opt-meta {
    font-size: 11px;
    color: var(--text-muted);
  }

  .title-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-main);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.14s ease;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) {
    background: var(--bg-hover);
    border-color: rgba(255,255,255,0.28);
  }
  .btn:disabled {
    opacity: 0.42;
    cursor: not-allowed;
  }
  .btn-gold {
    background: linear-gradient(180deg, #d9a74a 0%, #a57724 100%);
    border-color: #f3d285;
    color: #0e141f;
    font-weight: 800;
  }
  .btn-gold:hover:not(:disabled) {
    filter: brightness(1.08);
    background: linear-gradient(180deg, #e5b75c 0%, #b5842b 100%);
  }
  .btn-danger {
    background: rgba(185, 28, 28, 0.35);
    border-color: rgba(248, 113, 113, 0.5);
    color: #fecaca;
  }
  .btn-danger:hover:not(:disabled) {
    background: rgba(220, 38, 38, 0.52);
  }
  .btn-success {
    background: rgba(21, 128, 61, 0.38);
    border-color: rgba(74, 222, 128, 0.5);
    color: #dcfce7;
  }
  .btn-success:hover:not(:disabled) {
    background: rgba(22, 163, 74, 0.55);
  }
  .btn-lg {
    padding: 11px 26px;
    font-size: 14px;
    border-radius: 9px;
  }
  .btn-sm {
    padding: 5px 9px;
    font-size: 11px;
  }

  /* ===== Top HUD ===== */
  #hud-top {
    position: fixed;
    top: 10px;
    left: 10px;
    right: 10px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
  }

  .hud-left {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: min(560px, calc(100vw - 140px));
  }

  .civ-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 7px 12px;
    box-shadow: var(--shadow);
    flex-wrap: wrap;
  }
  .flag-lg {
    width: 44px;
    height: 30px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.35);
    cursor: pointer;
    flex-shrink: 0;
    overflow: hidden;
  }
  .civ-title-block {
    min-width: 90px;
  }
  .civ-name-row {
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .civ-sub-row {
    font-size: 11px;
    color: var(--text-muted);
  }

  .stat-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    border-left: 1px solid var(--border-subtle);
    padding-left: 10px;
  }
  .stat-pill {
    display: flex;
    flex-direction: column;
    min-width: 62px;
  }
  .stat-pill .lbl {
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.1;
  }
  .stat-pill .val {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.25;
  }
  .stat-pill .sub {
    font-size: 10px;
    font-weight: 600;
  }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .gold-txt { color: var(--gold); }

  .hud-quick-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .hud-right {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }

  .date-box {
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 10px;
    padding: 7px 12px;
    text-align: right;
    box-shadow: var(--shadow);
  }
  .date-box .date-main {
    font-size: 14px;
    font-weight: 800;
    color: var(--gold);
  }
  .date-box .date-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .top-tools {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  /* ===== Mode Banner (Move / Editor / Timelapse) ===== */
  #mode-banner {
    position: fixed;
    top: 88px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 25;
    background: rgba(18, 28, 44, 0.96);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #mode-banner.hidden {
    display: none;
  }

  /* ===== Battle / Event Ticker (Top-Right Below Date) ===== */
  #news-feed {
    position: fixed;
    top: 108px;
    right: 10px;
    z-index: 18;
    width: min(290px, 44vw);
    display: flex;
    flex-direction: column;
    gap: 5px;
    pointer-events: none;
  }
  .news-item {
    pointer-events: auto;
    background: rgba(15, 22, 34, 0.9);
    border-left: 3px solid var(--gold);
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 11px;
    line-height: 1.35;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    animation: fadeInRight 0.2s ease;
  }
  .news-item.war { border-left-color: var(--red); }
  .news-item.peace { border-left-color: var(--green); }
  @keyframes fadeInRight {
    from { opacity: 0; transform: translateX(12px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ===== Bottom Bar: Province Panel + Next Turn ===== */
  #hud-bottom {
    position: fixed;
    bottom: 10px;
    left: 10px;
    right: 10px;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 10px;
    pointer-events: none;
  }

  #province-panel {
    pointer-events: auto;
    background: var(--bg-panel);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 10px 14px;
    width: min(560px, calc(100vw - 170px));
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  #province-panel.hidden {
    display: none;
  }

  .prov-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 6px;
  }
  .prov-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .prov-name {
    font-size: 15px;
    font-weight: 800;
    color: #fff;
  }
  .prov-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text-muted);
  }
  .prov-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: 6px;
    margin-bottom: 9px;
  }
  .p-stat {
    background: rgba(255,255,255,0.04);
    border-radius: 6px;
    padding: 5px 8px;
  }
  .p-stat .k {
    font-size: 10px;
    color: var(--text-muted);
  }
  .p-stat .v {
    font-size: 13px;
    font-weight: 700;
  }
  .prov-buildings {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .b-chip {
    background: rgba(229, 185, 92, 0.12);
    border: 1px solid rgba(229, 185, 92, 0.3);
    color: var(--gold);
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
  }
  .prov-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .bottom-right {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
    margin-left: auto;
  }

  .map-modes {
    display: flex;
    gap: 4px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    padding: 4px;
    border-radius: 9px;
    box-shadow: var(--shadow);
  }
  .mode-btn {
    padding: 5px 8px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  .mode-btn:hover {
    color: #fff;
    background: rgba(255,255,255,0.06);
  }
  .mode-btn.active {
    background: rgba(229, 185, 92, 0.22);
    color: var(--gold);
  }

  .turn-controls {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  #btn-next-turn {
    padding: 11px 20px;
    font-size: 14px;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(217, 167, 74, 0.28);
  }

  /* ===== Editor Palette ===== */
  #editor-panel {
    position: fixed;
    left: 10px;
    top: 90px;
    z-index: 25;
    width: 240px;
    max-height: calc(100vh - 180px);
    overflow-y: auto;
    background: var(--bg-panel);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  #editor-panel.hidden {
    display: none;
  }

  /* ===== Modal Dialogs ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(4, 8, 15, 0.72);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .modal-backdrop.hidden {
    display: none;
  }
  .modal-box {
    width: 100%;
    max-width: 540px;
    max-height: 88vh;
    overflow-y: auto;
    background: var(--bg-panel-solid);
    border: 1px solid var(--border-gold);
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 10px;
    margin-bottom: 14px;
  }
  .modal-head h2 {
    margin: 0;
    font-size: 16px;
    color: var(--gold);
  }

  .slider-group {
    margin-bottom: 12px;
    background: rgba(255,255,255,0.03);
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
  }
  .slider-row {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--gold);
    cursor: pointer;
  }

  .list-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  .list-table th, .list-table td {
    padding: 7px 6px;
    border-bottom: 1px solid var(--border-subtle);
    text-align: left;
  }
  .list-table th {
    color: var(--gold);
    font-size: 11px;
  }

  .toast {
    position: fixed;
    bottom: 92px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 70;
    background: rgba(15, 23, 36, 0.96);
    border: 1px solid var(--gold);
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: var(--shadow);
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .toast.hidden {
    opacity: 0;
    display: none;
  }

  .build-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .build-card {
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .build-card .b-name { font-weight: 700; color: #fff; }
  .build-card .b-desc { font-size: 11px; color: var(--text-muted); flex: 1; }

  .peace-prov-list {
    max-height: 200px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin: 10px 0;
  }
  .peace-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .peace-item.selected {
    border-color: var(--gold);
    background: rgba(229, 185, 92, 0.18);
  }

  /* Responsive adjustments for narrow panels / mobile */
  @media (max-width: 720px) {
    .hud-left { max-width: calc(100vw - 110px); }
    .stat-strip { border-left: none; padding-left: 0; gap: 6px; }
    .stat-pill { min-width: 52px; }
    #province-panel { width: calc(100vw - 20px); }
    #hud-bottom { flex-direction: column; align-items: stretch; }
    .bottom-right { flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
    .map-modes { overflow-x: auto; max-width: 58vw; }
    #news-feed { display: none; }
    .build-grid, .peace-prov-list { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="map-canvas"></canvas>

  <!-- Title / Scenario Picker -->
  <div id="title-screen">
    <div class="title-box">
      <div class="title-header">
        <div class="title-badge">Grand Strategy Wargame · Web Edition</div>
        <h1>文明時代 II</h1>
        <p>回合制大戰略地圖沙盤 — 徵兵、外交、和平條約、科技發展、歷史延時回放與劇本編輯器</p>
      </div>

      <p class="section-label">1. 選擇歷史劇本</p>
      <div class="scenario-grid" id="scenario-list"></div>

      <p class="section-label">2. 選擇你要領導的文明</p>
      <div class="civ-picker" id="civ-picker"></div>

      <div class="title-actions">
        <button class="btn btn-gold btn-lg" id="btn-start-game">開始征服之旅</button>
        <button class="btn btn-lg" id="btn-open-editor">進入劇本編輯器</button>
      </div>
    </div>
  </div>

  <!-- Top HUD -->
  <div id="hud-top">
    <div class="hud-left">
      <div class="civ-banner">
        <div class="flag-lg" id="hud-flag" title="點擊檢視國家概覽"></div>
        <div class="civ-title-block">
          <div class="civ-name-row">
            <span id="hud-civ-name">—</span>
          </div>
          <div class="civ-sub-row" id="hud-civ-gov">—</div>
        </div>
        <div class="stat-strip">
          <div class="stat-pill">
            <span class="lbl">國庫</span>
            <span class="val gold-txt" id="hud-gold">0</span>
            <span class="sub pos" id="hud-income">+0</span>
          </div>

    let ctx = null;

      if (muted) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    function tone(freq, dur, type = 'triangle', vol = 0.08, delay = 0) {
      const c = ensure();
      if (!c) return;
      const now = c.currentTime + delay;
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    }

    return {
      isMuted: () => muted,
      toggle: () => { muted = !muted; return muted; },
      click: () => tone(520, 0.06, 'sine', 0.05),

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  // ======================== MAP GENERATOR (Deterministic Voronoi Provinces) ========================
  const MAP_W = 1800;
  const MAP_H = 1050;

  function generateWorldMap(seed = 14402026) {
    const rng = mulberry32(seed);
    const cols = 14;
    const rows = 9;
    const cellW = MAP_W / cols;
    const cellH = MAP_H / rows;
    const rawSites = [];

    // Generate organic Eurasian-like landmass mask (continent + western island + southern peninsula)
    function isLandMask(nx, ny) {
      // Main continent body
      const main = Math.hypot((nx - 0.56) * 1.15, (ny - 0.48) * 1.45) < 0.44;
      // Western Europe peninsula
      const west = Math.hypot((nx - 0.27) * 1.6, (ny - 0.48) * 1.8) < 0.25;
      // Iberia
      const iberia = Math.hypot((nx - 0.17) * 2.3, (ny - 0.62) * 2.5) < 0.17;
      // British Isles
      const britain = Math.hypot((nx - 0.22) * 3.1, (ny - 0.24) * 2.8) < 0.14;
      // Scandinavia
      const nordic = Math.hypot((nx - 0.46) * 2.1, (ny - 0.17) * 2.5) < 0.16;
      // Far East extension
      const east = Math.hypot((nx - 0.83) * 1.7, (ny - 0.56) * 1.8) < 0.23;
      // Middle East / North Africa
      const mena = Math.hypot((nx - 0.63) * 1.7, (ny - 0.78) * 2.5) < 0.20;
      // Mediterranean Sea carve-out
      const medSea = Math.hypot((nx - 0.42) * 2.1, (ny - 0.72) * 4.2) < 0.21;
      // Baltic / North Sea carve-out
      const northSea = Math.hypot((nx - 0.34) * 3.2, (ny - 0.22) * 3.8) < 0.12;
      return (main || west || iberia || britain || nordic || east || mena) && !medSea && !northSea;
    }

    let idCounter = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const x = (c + 0.2 + rng() * 0.6) * cellW;
        const y = (r + 0.2 + rng() * 0.6) * cellH;
        const nx = x / MAP_W;
        const ny = y / MAP_H;
        if (nx < 0.06 || nx > 0.94 || ny < 0.07 || ny > 0.92) continue;
        const land = isLandMask(nx, ny);
        rawSites.push({ id: idCounter++, x, y, land });
      }
    }

    // Build discrete Voronoi grid for exact polygons & neighbor adjacency
    const GW = 180;
    const GH = 105;
    const scaleX = MAP_W / GW;
    const scaleY = MAP_H / GH;
    const grid = new Int16Array(GW * GH);

    for (let gy = 0; gy < GH; gy++) {
      const py = (gy + 0.5) * scaleY;
      for (let gx = 0; gx < GW; gx++) {
        const px = (gx + 0.5) * scaleX;
        let best = -1;
        let bestD = Infinity;
        for (let i = 0; i < rawSites.length; i++) {
          const dx = px - rawSites[i].x;
          const dy = py - rawSites[i].y;
          const d = dx * dx + dy * dy;
          if (d < bestD) { bestD = d; best = i; }
        }
        grid[gy * GW + gx] = best;
      }
    }

    // Build exact convex-ish polygon for each land site via half-plane clipping (Voronoi cell)
    function clipPolygon(poly, px, py, nx, ny) {
      // Keep points where (pt - p) . n <= 0
      const out = [];
      for (let i = 0; i < poly.length; i++) {
        const a = poly[i];
        const b = poly[(i + 1) % poly.length];
        const da = (a[0] - px) * nx + (a[1] - py) * ny;
        const db = (b[0] - px) * nx + (b[1] - py) * ny;
        if (da <= 0) out.push(a);
        if ((da <= 0 && db > 0) || (da > 0 && db <= 0)) {
          const t = da / (da - db);
          out.push([a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])]);
        }
      }
      return out;
    }

    const landSites = rawSites.filter(s => s.land);
    const oldToNew = new Map();
    landSites.forEach((s, idx) => oldToNew.set(s.id, idx));

    const provinces = landSites.map((s, idx) => {
      let poly = [
        [20, 20], [MAP_W - 20, 20], [MAP_W - 20, MAP_H - 20], [20, MAP_H - 20]
      ];
      for (let j = 0; j < rawSites.length; j++) {
        const o = rawSites[j];
        if (o.id === s.id) continue;
        const mx = (s.x + o.x) * 0.5;
        const my = (s.y + o.y) * 0.5;
        const nx = o.x - s.x;
        const ny = o.y - s.y;
        poly = clipPolygon(poly, mx, my, nx, ny);
        if (poly.length < 3) break;
      }
      // Compute polygon centroid for crisp label/army placement
      let cx = 0, cy = 0;
      for (const p of poly) { cx += p[0]; cy += p[1]; }
      cx = poly.length ? cx / poly.length : s.x;
      cy = poly.length ? cy / poly.length : s.y;

      // Determine terrain from geography + rng
      const r = rng();
      let terrain = 'plains';
      if (cy > MAP_H * 0.72 && cx > MAP_W * 0.5) terrain = r < 0.65 ? 'desert' : 'hills';
      else if (cy < MAP_H * 0.30) terrain = r < 0.55 ? 'forest' : 'hills';
      else if (r < 0.18) terrain = 'mountain';
      else if (r < 0.38) terrain = 'hills';
      else if (r < 0.58) terrain = 'forest';

      const basePop = Math.round((14000 + rng() * 34000) * TERRAIN_INFO[terrain].growth);
      const baseEcon = Math.round((450 + rng() * 1150) * (terrain === 'plains' ? 1.2 : 0.95));

      return {
        id: idx,
        rawId: s.id,
        name: PROVINCE_NAMES[idx % PROVINCE_NAMES.length] + (idx >= PROVINCE_NAMES.length ? '州' : ''),
        cx, cy,
        poly,
        neighbors: new Set(),
        seaLinks: new Set(),
        coastal: false,
        terrain,
        owner: 0,
        coreOwner: 0,
        isCapital: false,
        army: 0,
        pop: basePop,
        econ: baseEcon,
        stability: 100,
        buildings: { farm: 0, workshop: 0, fort: 0, supply: 0 }
      };
    });

    // Detect land adjacency & coastal status from grid
    for (let gy = 0; gy < GH; gy++) {
      for (let gx = 0; gx < GW; gx++) {
        const aRaw = grid[gy * GW + gx];
        const aIdx = oldToNew.get(aRaw);
        if (aIdx === undefined) continue;
        const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
        for (const [dx, dy] of dirs) {
          const nx = gx + dx, ny = gy + dy;
          if (nx < 0 || nx >= GW || ny < 0 || ny >= GH) {
            provinces[aIdx].coastal = true;
            continue;
          }
          const bRaw = grid[ny * GW + nx];
          if (bRaw === aRaw) continue;
          const bIdx = oldToNew.get(bRaw);
          if (bIdx === undefined) {
            provinces[aIdx].coastal = true;
          } else {
            provinces[aIdx].neighbors.add(bIdx);
            provinces[bIdx].neighbors.add(aIdx);
          }
        }
      }
    }

    // Add maritime sea lanes between nearby coastal provinces that aren't land-adjacent (e.g. Britain <-> Europe, Mediterranean crossings)
    const coastalProvs = provinces.filter(p => p.coastal);
    for (let i = 0; i < coastalProvs.length; i++) {
      for (let j = i + 1; j < coastalProvs.length; j++) {
        const a = coastalProvs[i];
        const b = coastalProvs[j];
        if (a.neighbors.has(b.id)) continue;
        const dist = Math.hypot(a.cx - b.cx, a.cy - b.cy);
        if (dist < 260 && a.seaLinks.size < 2 && b.seaLinks.size < 2) {
          a.seaLinks.add(b.id);
          b.seaLinks.add(a.id);
          a.neighbors.add(b.id);
          b.neighbors.add(a.id);
        }
      }
    }

    // Ensure graph connectivity (connect any isolated island to closest coastal province)
    const visited = new Set([0]);
    const queue = [0];
    while (queue.length) {
      const cur = queue.shift();
      for (const nb of provinces[cur].neighbors) {
        if (!visited.has(nb)) { visited.add(nb); queue.push(nb); }
      }
    }
    for (const p of provinces) {
      if (!visited.has(p.id)) {
        let closest = -1, bestD = Infinity;
        for (const vId of visited) {
          const d = Math.hypot(p.cx - provinces[vId].cx, p.cy - provinces[vId].cy);
          if (d < bestD) { bestD = d; closest = vId; }
        }
        if (closest !== -1) {
          p.seaLinks.add(closest);
          provinces[closest].seaLinks.add(p.id);
          p.neighbors.add(closest);
          provinces[closest].neighbors.add(p.id);
          visited.add(p.id);
        }
      }
    }

    return provinces;
  }

  // ======================== GAME STATE ========================
  const state = {
    scenario: SCENARIOS[0],
    selectedScenarioIdx: 0,
    selectedStartCivId: 1,
    provinces: [],
    civs: new Map(),
    playerCivId: 1,
    turn: 1,
    year: 1440,
    month: 5,
    mapMode: 'political',
    selectedProvId: null,
    hoveredProvId: null,
    mode: 'normal', // 'normal' | 'move' | 'editor' | 'timelapse'
    moveSourceId: null,
    pendingOrders: [], // { from, to, amount, civId }
    relations: new Map(), // key "a-b" (a<b) -> { score, war, alliance, nap, trade, truceUntil, warScoreA }
    history: [], // array of { year, month, owners: number[] }
    editorPaintCivId: 1,
    timelapseTimer: null,
    timelapseIndex: 0,
    animations: [], // floating texts / battle flashes
    cam: { x: MAP_W * 0.5, y: MAP_H * 0.5, zoom: 0.72 },
    isRunning: false
  };

  // ======================== RELATIONS HELPERS ========================
  function relKey(a, b) {
    return a < b ? `${a}-${b}` : `${b}-${a}`;
  }

  function getRel(a, b) {
    if (a === b) return { score: 100, war: false, alliance: true, nap: false, trade: false, truceUntil: 0, warScoreA: 0 };
    const k = relKey(a, b);
    if (!state.relations.has(k)) {
      state.relations.set(k, { score: 0, war: false, alliance: false, nap: false, trade: false, truceUntil: 0, warScoreA: 0 });
    }
    return state.relations.get(k);
  }

  function getWarScore(civA, civB) {
    const rel = getRel(civA, civB);
    return civA < civB ? rel.warScoreA : -rel.warScoreA;
  }

  function addWarScore(winnerId, loserId, delta) {
    const rel = getRel(winnerId, loserId);
    if (winnerId < loserId) rel.warScoreA = Math.max(-100, Math.min(100, rel.warScoreA + delta));
    else rel.warScoreA = Math.max(-100, Math.min(100, rel.warScoreA - delta));
  }

  // ======================== FLAG SVG HELPER ========================
  function flagSVG(flagArr) {
    const [c1, c2, pat] = flagArr || ['#444', '#888', 'bi-h'];
    if (pat === 'cross') {
      return `<svg viewBox="0 0 36 24" width="100%" height="100%" preserveAspectRatio="none">
        <rect width="36" height="24" fill="${c1}"/>
        <rect x="14" width="8" height="24" fill="${c2}"/>
        <rect y="8" width="36" height="8" fill="${c2}"/>
      </svg>`;
    }
    if (pat === 'tri-v') {
      return `<svg viewBox="0 0 36 24" width="100%" height="100%" preserveAspectRatio="none">
        <rect width="12" height="24" fill="${c1}"/>
        <rect x="12" width="12" height="24" fill="#f5f5f5"/>
        <rect x="24" width="12" height="24" fill="${c2}"/>
      </svg>`;
    }
    if (pat === 'tri-h') {
      return `<svg viewBox="0 0 36 24" width="100%" height="100%" preserveAspectRatio="none">
        <rect width="36" height="8" fill="${c1}"/>
        <rect y="8" width="36" height="8" fill="${c2}"/>
        <rect y="16" width="36" height="8" fill="${c1}"/>
      </svg>`;
    }
    if (pat === 'bi-h') {
      return `<svg viewBox="0 0 36 24" width="100%" height="100%" preserveAspectRatio="none">
        <rect width="36" height="12" fill="${c1}"/>
        <rect y="12" width="36" height="12" fill="${c2}"/>
      </svg>`;
    }
    if (pat === 'stripe') {
      return `<svg viewBox="0 0 36 24" width="100%" height="100%" preserveAspectRatio="none">
        <rect width="36" height="24" fill="${c1}"/>
        <rect y="5" width="36" height="4" fill="${c2}"/>
        <rect y="15" width="36" height="4" fill="${c2}"/>
      </svg>`;
    }
    // star
    return `<svg viewBox="0 0 36 24" width="100%" height="100%" preserveAspectRatio="none">
      <rect width="36" height="24" fill="${c1}"/>
      <polygon points="18,4 20.4,10.2 27,10.2 21.7,14.1 23.6,20.3 18,16.5 12.4,20.3 14.3,14.1 9,10.2 15.6,10.2" fill="${c2}"/>
    </svg>`;
  }

  // ======================== SCENARIO INITIALIZATION ========================
  function initScenario(scenarioObj, playerCivId, keepCurrentMap = false) {
    state.scenario = scenarioObj;
    state.year = scenarioObj.year;
    state.month = scenarioObj.month;
    state.turn = 1;
    state.playerCivId = playerCivId;
    state.selectedProvId = null;
    state.pendingOrders = [];
    state.relations.clear();
    state.history = [];
    state.animations = [];
    state.mode = 'normal';
    state.moveSourceId = null;

    if (!keepCurrentMap) {
      state.provinces = generateWorldMap(14402026);
    }

    state.civs.clear();
    for (const c of scenarioObj.civs) {
      state.civs.set(c.id, {
        id: c.id,
        name: c.name,
        gov: c.gov,
        color: c.color,
        flag: c.flag,
        gold: c.gold,
        tech: c.tech,
        mp: 4.5,
        maxMp: 4.5,
        dp: 3.0,
        taxRate: 12,      // % (5 - 28)
        goodsRate: 8,     // % (0 - 25)
        researchRate: 10, // % (0 - 30)
        vassalOf: null,
        alive: true
      });
    }

    if (!keepCurrentMap) {
      // Assign provinces to nearest civ seed region
      const civList = scenarioObj.civs;
      for (const p of state.provinces) {
        let bestId = civList[0].id;
        let bestD = Infinity;
        for (const c of civList) {
          const sx = c.region[0] * MAP_W;
          const sy = c.region[1] * MAP_H;
          const d = Math.hypot(p.cx - sx, p.cy - sy);
          if (d < bestD) { bestD = d; bestId = c.id; }
        }
        p.owner = bestId;
        p.coreOwner = bestId;
        p.isCapital = false;
        p.stability = 100;
        p.buildings = { farm: 0, workshop: 0, fort: 0, supply: 0 };
        p.army = Math.round(280 + (scenarioObj.id === '1936' ? 420 : 120) + (p.econ * 0.25));
      }
      assignCapitals();
    } else {
      // Refresh armies & capitals on custom-edited map
      for (const p of state.provinces) {
        p.coreOwner = p.owner;
        p.isCapital = false;
        p.stability = 100;
        p.army = Math.round(350 + p.econ * 0.25);
      }
      assignCapitals();
    }

    // Seed initial diplomatic relations
    const ids = Array.from(state.civs.keys());
    const rng = mulberry32(scenarioObj.year * 997);
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const rel = getRel(ids[i], ids[j]);
        rel.score = Math.round(-25 + rng() * 55);
      }
    }

    recordHistorySnapshot();
    centerCameraOnCiv(playerCivId);
    clearNews();
    pushNews(`你在 ${state.year} 年接掌了 ${state.civs.get(playerCivId).name}，運籌帷幄，開創霸業！`);
    updateAllUI();
  }

  function assignCapitals() {
    for (const c of state.civs.values()) {
      const owned = state.provinces.filter(p => p.owner === c.id);
      if (owned.length === 0) { c.alive = false; continue; }
      c.alive = true;
      // Pick highest-economy province as capital
      owned.sort((a, b) => b.econ - a.econ);
      owned[0].isCapital = true;
      owned[0].army = Math.round(owned[0].army * 1.45);
      owned[0].buildings.fort = 1;
    }
  }

  function centerCameraOnCiv(civId) {
    const owned = state.provinces.filter(p => p.owner === civId);
    if (!owned.length) return;
    let sx = 0, sy = 0;
    for (const p of owned) { sx += p.cx; sy += p.cy; }
    state.cam.x = sx / owned.length;
    state.cam.y = sy / owned.length;
    state.cam.zoom = Math.min(1.05, Math.max(0.65, canvas.clientWidth / 1350));
  }

  function recordHistorySnapshot() {
    state.history.push({
      year: state.year,
      month: state.month,
      owners: state.provinces.map(p => p.owner)
    });
  }

  // ======================== ECONOMY & STATS CALCULATIONS ========================
  function getCivStats(civId) {
    const civ = state.civs.get(civId);
    if (!civ) return { provCount: 0, pop: 0, econ: 0, army: 0, gross: 0, upkeep: 0, goodsCost: 0, researchCost: 0, net: 0, vassalTax: 0 };
    const owned = state.provinces.filter(p => p.owner === civId);
    let pop = 0, econ = 0, army = 0, gross = 0, upkeep = 0;

    for (const p of owned) {
      pop += p.pop;
      econ += p.econ;
      army += p.army;
      const stabMult = 0.35 + 0.65 * (p.stability / 100);
      const wsMult = 1 + p.buildings.workshop * 0.22;
      const taxIncome = (p.econ * (civ.taxRate / 100) * 1.15 + p.pop * 0.0045) * stabMult * wsMult;
      gross += taxIncome;
      const supMult = Math.max(0.4, 1 - p.buildings.supply * 0.30);
      upkeep += p.army * 0.095 * supMult;
    }

    // Add pending marching troops owned by this civ
    for (const o of state.pendingOrders) {
      if (o.civId === civId) army += o.amount;
    }

    // Trade bonuses
    let tradeBonus = 0;
    for (const other of state.civs.values()) {
      if (other.id !== civId && other.alive && getRel(civId, other.id).trade) {
        tradeBonus += 45;
      }
    }
    gross += tradeBonus;

    // Vassal tribute
    let vassalTax = 0;
    if (civ.vassalOf && state.civs.get(civ.vassalOf)?.alive) {
      vassalTax = -gross * 0.15;
    } else {
      for (const other of state.civs.values()) {
        if (other.alive && other.vassalOf === civId) {
          vassalTax += 90;
        }
      }
    }

    const goodsCost = gross * (civ.goodsRate / 100);
    const researchCost = gross * (civ.researchRate / 100);
    const net = Math.round(gross - upkeep - goodsCost - researchCost + vassalTax);

    return {
      provCount: owned.length,
      pop: Math.round(pop),
      econ: Math.round(econ),
      army: Math.round(army),
      gross: Math.round(gross),
      upkeep: Math.round(upkeep),
      goodsCost: Math.round(goodsCost),
      researchCost: Math.round(researchCost),
      vassalTax: Math.round(vassalTax),
      net
    };
  }

  function getRankings() {
    const arr = [];
    for (const c of state.civs.values()) {
      const st = getCivStats(c.id);
      if (st.provCount === 0) continue;
      const score = Math.round(st.provCount * 120 + st.econ * 0.15 + st.pop * 0.004 + st.army * 0.08 + c.tech * 400);
      arr.push({ civ: c, stats: st, score });
    }
    arr.sort((a, b) => b.score - a.score);
    return arr;
  }

  // ======================== TURN RESOLUTION & AI ========================
  function nextTurn() {
    if (state.mode === 'timelapse' || state.mode === 'editor') return;
    Sound.turn();
    exitSpecialMode();

    // 1. AI plans its moves and diplomacy
    runAITurns();

    // 2. Execute all pending orders (Player + AI)
    resolveAllOrders();

    // 3. Economy, population growth, research, assimilation & rebellions
    for (const c of state.civs.values()) {
      const st = getCivStats(c.id);
      if (st.provCount === 0) {
        c.alive = false;
        continue;
      }
      c.alive = true;
      c.gold = Math.max(-500, Math.round(c.gold + st.net));
      c.maxMp = Math.min(8.0, +(3.5 + st.provCount * 0.18).toFixed(1));
      c.mp = c.maxMp;
      c.dp = Math.min(8.0, +(c.dp + 0.8).toFixed(1));

      // Tech progression
      const techGain = (st.researchCost / Math.max(400, st.econ * 0.8)) * 0.018;
      c.tech = +(Math.min(2.5, c.tech + techGain)).toFixed(3);

      // Update each owned province
      const owned = state.provinces.filter(p => p.owner === c.id);
      // Ensure capital exists
      if (!owned.some(p => p.isCapital)) {
        owned.sort((a, b) => b.econ - a.econ);
        owned[0].isCapital = true;
      }

      for (const p of owned) {
        const farmMult = 1 + p.buildings.farm * 0.25;
        const goodsBoost = 1 + c.goodsRate * 0.025;
        const taxPenalty = c.taxRate > 16 ? (c.taxRate - 16) * 0.04 : 0;
        const growthRate = Math.max(-0.01, (0.009 * TERRAIN_INFO[p.terrain].growth * farmMult * goodsBoost) - taxPenalty * 0.02);
        p.pop = Math.max(1500, Math.round(p.pop * (1 + growthRate)));
        p.econ = Math.max(150, Math.round(p.econ * (1 + 0.004 * goodsBoost)));

        // Stability drift & rebellion risk
        if (c.taxRate > 18) {
          p.stability = Math.max(15, p.stability - (c.taxRate - 17) * 1.4);
        } else if (p.stability < 100 && p.coreOwner === c.id) {
          p.stability = Math.min(100, p.stability + 2);
        }

        // Unassimilated rebellion chance
        if (p.stability < 45 && Math.random() < (45 - p.stability) * 0.006) {
          const rebels = Math.round(p.pop * 0.035);
          if (rebels > p.army) {
            p.army = Math.max(120, rebels - p.army);
            p.stability = 65;
            if (p.coreOwner && p.coreOwner !== c.id && state.civs.has(p.coreOwner)) {
              p.owner = p.coreOwner;
              state.civs.get(p.coreOwner).alive = true;
              pushNews(`🔥 ${p.name} 爆發起義，脫離 ${c.name} 重歸 ${state.civs.get(p.coreOwner).name}！`, 'war');
            } else {
              pushNews(`🔥 ${p.name} 爆發農民起義，守軍損失慘重！`, 'war');
            }
          } else {
            p.army = Math.max(0, p.army - Math.round(rebels * 0.6));
            p.stability = Math.min(100, p.stability + 15);
            if (c.id === state.playerCivId) {
              pushNews(`⚔️ ${p.name} 發生小規模叛亂，已被駐軍鎮壓。`);
            }
          }
        }
      }
    }

    // 4. Advance Date
    state.turn++;
    state.month += state.scenario.stepMonths;
    while (state.month > 12) {
      state.month -= 12;
      state.year++;
    }

    recordHistorySnapshot();
    checkVictoryOrDefeat();
    updateAllUI();
  }

  function resolveAllOrders() {
    const orders = state.pendingOrders.slice();
    state.pendingOrders = [];

    for (const o of orders) {
      const target = state.provinces[o.to];
      const attackerCiv = state.civs.get(o.civId);
      if (!target || !attackerCiv) continue;

      if (target.owner === o.civId) {
        // Friendly reinforcement
        target.army += o.amount;
      } else {
        const defenderCiv = state.civs.get(target.owner);
        const rel = getRel(o.civId, target.owner);
        // Auto-declare war if marching into hostile territory
        if (!rel.war) {
          declareWar(o.civId, target.owner, true);
        }

        // Combat Formula: tech, terrain defense, fort defense
        const atkTech = 1 + attackerCiv.tech * 0.45;
        const defTech = 1 + (defenderCiv ? defenderCiv.tech * 0.45 : 0.2);
        const terrainDef = TERRAIN_INFO[target.terrain].def;
        const fortDef = target.buildings.fort * 0.35;
        const defMult = defTech * (1 + terrainDef + fortDef);

        const atkPower = o.amount * atkTech * (0.94 + Math.random() * 0.12);
        const defPower = target.army * defMult * (0.94 + Math.random() * 0.12);

        Sound.battle();
        if (atkPower > defPower) {
          const ratio = defPower / Math.max(1, atkPower);
          const survivors = Math.max(1, Math.round(o.amount * (1 - ratio * 0.82)));
          const prevOwner = target.owner;
          const wasCapital = target.isCapital;
          target.owner = o.civId;
          target.army = survivors;
          target.isCapital = false;
          target.stability = Math.max(30, Math.round(target.stability * 0.55));
          addWarScore(o.civId, prevOwner, wasCapital ? 28 : 14);
          spawnFloatText(target.cx, target.cy, `占領! 餘 ${survivors}`, '#4ade80');
          if (o.civId === state.playerCivId || prevOwner === state.playerCivId) {
            pushNews(`⚔️ ${attackerCiv.name} 攻克了 ${defenderCiv.name} 的 ${target.name}！`, 'war');
          }
        } else {
          const ratio = atkPower / Math.max(1, defPower);
          const survivors = Math.max(1, Math.round(target.army * (1 - ratio * 0.80)));
          target.army = survivors;
          addWarScore(target.owner, o.civId, 8);
          spawnFloatText(target.cx, target.cy, `擊退! 守軍 ${survivors}`, '#f87171');
          if (o.civId === state.playerCivId || target.owner === state.playerCivId) {
            pushNews(`🛡️ ${defenderCiv.name} 在 ${target.name} 成功擊退了 ${attackerCiv.name} 的進攻。`);
          }
        }
      }
    }
  }

  function runAITurns() {
    for (const c of state.civs.values()) {
      if (c.id === state.playerCivId || !c.alive) continue;
      const owned = state.provinces.filter(p => p.owner === c.id);
      if (!owned.length) continue;

      const atWarWith = [];
      for (const other of state.civs.values()) {
        if (other.id !== c.id && other.alive && getRel(c.id, other.id).war) {
          atWarWith.push(other.id);
        }
      }

      // Check if AI wants to declare war on a weaker neighbor
      if (atWarWith.length === 0 && c.gold > 700 && Math.random() < 0.08) {
        const neighborCivs = new Set();
        for (const p of owned) {
          for (const nbId of p.neighbors) {
            const nbOwner = state.provinces[nbId].owner;
            if (nbOwner !== c.id) neighborCivs.add(nbOwner);
          }
        }
        const myStats = getCivStats(c.id);
        for (const nbCivId of neighborCivs) {
          const rel = getRel(c.id, nbCivId);
          if (rel.alliance || rel.nap || rel.truceUntil > state.turn) continue;
          const nbStats = getCivStats(nbCivId);
          if (myStats.army > nbStats.army * 1.18 && rel.score < 25) {
            declareWar(c.id, nbCivId, false);
            atWarWith.push(nbCivId);
            break;
          }
        }
      }

      // AI Recruiting on border provinces
      const borderProvs = owned.filter(p =>
        Array.from(p.neighbors).some(n => state.provinces[n].owner !== c.id)
      );
      const recruitPool = borderProvs.length ? borderProvs : owned;
      if (c.gold > 450) {
        const targetP = recruitPool[Math.floor(Math.random() * recruitPool.length)];
        const spend = Math.min(c.gold * 0.45, 700);
        const troops = Math.min(Math.floor(targetP.pop * 0.12), Math.floor(spend / 0.85));
        if (troops >= 60) {
          targetP.army += troops;
          targetP.pop -= troops;
          c.gold -= Math.round(troops * 0.85);
        }
      }

      // AI Building when peaceful and rich
      if (atWarWith.length === 0 && c.gold > 950) {
        const richP = owned[Math.floor(Math.random() * owned.length)];
        if (richP.buildings.workshop < 2) {
          richP.buildings.workshop++;
          c.gold -= BUILDINGS.workshop.cost;
        } else if (richP.buildings.farm < 2) {
          richP.buildings.farm++;
          c.gold -= BUILDINGS.farm.cost;
        }
      }

      // AI Movement & Attacks
      if (atWarWith.length > 0) {
        for (const p of owned) {
          if (p.army < 220) continue;
          const enemyNbs = Array.from(p.neighbors)
            .map(id => state.provinces[id])
            .filter(nb => atWarWith.includes(nb.owner));

          if (enemyNbs.length > 0) {
            // Attack weakest adjacent enemy if favorable
            enemyNbs.sort((a, b) => a.army - b.army);
            const target = enemyNbs[0];
            if (p.army > target.army * 0.92) {
              const sendAmt = Math.floor(p.army * 0.82);
              p.army -= sendAmt;
              state.pendingOrders.push({ from: p.id, to: target.id, amount: sendAmt, civId: c.id });
            }
          } else if (p.army > 350) {
            // Move interior troops toward border
            const friendNbs = Array.from(p.neighbors)
              .map(id => state.provinces[id])
              .filter(nb => nb.owner === c.id);
            const frontNb = friendNbs.find(nb =>
              Array.from(nb.neighbors).some(nid => atWarWith.includes(state.provinces[nid].owner))
            );
            if (frontNb) {
              const sendAmt = Math.floor(p.army * 0.7);
              p.army -= sendAmt;
              state.pendingOrders.push({ from: p.id, to: frontNb.id, amount: sendAmt, civId: c.id });
            }
          }
        }

        // AI-to-AI automatic peace after prolonged war
        for (const enemyId of atWarWith) {
          if (enemyId === state.playerCivId) continue;
          const ws = getWarScore(c.id, enemyId);
          if (Math.abs(ws) > 45 && Math.random() < 0.25) {
            const rel = getRel(c.id, enemyId);
            rel.war = false;
            rel.truceUntil = state.turn + 12;
            rel.warScoreA = 0;
            pushNews(`🕊️ ${c.name} 與 ${state.civs.get(enemyId).name} 簽署了和平條約。`, 'peace');
          }
        }
      }
    }
  }

  function declareWar(attackerId, defenderId, silent = false) {
    const rel = getRel(attackerId, defenderId);
    if (rel.war) return;
    rel.war = true;
    rel.alliance = false;
    rel.nap = false;
    rel.trade = false;
    rel.score = Math.max(-100, rel.score - 55);
    rel.warScoreA = 0;
    Sound.war();
    if (!silent) {
      pushNews(`⚔️ ${state.civs.get(attackerId).name} 正式向 ${state.civs.get(defenderId).name} 宣戰！`, 'war');
    }
  }

  function checkVictoryOrDefeat() {
    const playerProvs = state.provinces.filter(p => p.owner === state.playerCivId).length;
    const total = state.provinces.length;
    if (playerProvs === 0) {
      openModal('帝國覆滅', `
        <p style="line-height:1.6;color:var(--text-muted);">你的所有領土均已淪陷。歷史翻過了這一頁，但你可以隨時觀看延時回放或開啟新局。</p>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-gold" id="m-end-replay">觀看歷史回放</button>
          <button class="btn" id="m-end-menu">返回主選單</button>
        </div>
      `);
      document.getElementById('m-end-replay').onclick = () => { closeModal(); startTimelapse(); };
      document.getElementById('m-end-menu').onclick = () => { closeModal(); showTitleScreen(); };
    } else if (playerProvs >= Math.ceil(total * 0.65)) {
      Sound.peace();
      openModal('🏆 世界霸主誕生！', `
        <p style="line-height:1.6;">在 <strong>${state.year} 年 ${state.month} 月</strong>（第 ${state.turn} 回合），<strong>${state.civs.get(state.playerCivId).name}</strong> 控制了超過 65% 的世界省份，成就無可撼動的霸業！</p>
        <div style="display:flex;gap:8px;margin-top:14px;">
          <button class="btn btn-gold" id="m-win-replay">觀看疆域擴張回放</button>
          <button class="btn" id="m-win-continue">繼續征服全圖</button>
        </div>
      `);
      document.getElementById('m-win-replay').onclick = () => { closeModal(); startTimelapse(); };
      document.getElementById('m-win-continue').onclick = () => closeModal();
    }
  }

  // ======================== CANVAS RENDERER ========================
  const canvas = document.getElementById('map-canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(canvas.clientWidth * dpr);
    canvas.height = Math.floor(canvas.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function screenToWorld(sx, sy) {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;
    return {
      x: (sx - cw * 0.5) / state.cam.zoom + state.cam.x,
      y: (sy - ch * 0.5) / state.cam.zoom + state.cam.y
    };
  }

  function pointInPoly(x, y, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], yi = poly[i][1];
      const xj = poly[j][0], yj = poly[j][1];
      const intersect = ((yi > y) !== (yj > y)) && (x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-9) + xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }

  function findProvinceAt(wx, wy) {
    for (let i = 0; i < state.provinces.length; i++) {
      if (pointInPoly(wx, wy, state.provinces[i].poly)) return i;
    }
    return null;
  }

  function getProvinceFill(p) {
    if (state.mode === 'timelapse' && state.history[state.timelapseIndex]) {
      const histOwner = state.history[state.timelapseIndex].owners[p.id];
      return state.civs.get(histOwner)?.color || '#555';
    }
    if (state.mapMode === 'political') {
      return state.civs.get(p.owner)?.color || '#555';
    }
    if (state.mapMode === 'terrain') {
      return TERRAIN_INFO[p.terrain].color;
    }
    if (state.mapMode === 'diplomacy') {
      const refCiv = state.selectedProvId !== null ? state.provinces[state.selectedProvId].owner : state.playerCivId;
      if (p.owner === refCiv) return '#2fa85f';
      const rel = getRel(refCiv, p.owner);
      if (rel.war) return '#d63031';
      if (rel.alliance) return '#3b82f6';
      if (rel.nap || rel.trade) return '#38bdf8';
      if (rel.score > 20) return '#65a30d';
      if (rel.score < -20) return '#d97706';
      return '#4b5563';
    }
    if (state.mapMode === 'economy') {
      const t = Math.min(1, p.econ / 2400);
      return `hsl(${42 + t * 88}, 62%, ${24 + t * 32}%)`;
    }
    if (state.mapMode === 'population') {
      const t = Math.min(1, p.pop / 70000);
      return `hsl(${215 - t * 170}, 65%, ${26 + t * 32}%)`;
    }
    return '#555';
  }

  function spawnFloatText(x, y, text, color) {
    state.animations.push({ x, y, text, color, born: performance.now(), dur: 1800 });
  }

  function drawMap(now) {
    const cw = canvas.clientWidth;
    const ch = canvas.clientHeight;

    // Ocean background
    const oceanGrad = ctx.createRadialGradient(cw * 0.5, ch * 0.5, 60, cw * 0.5, ch * 0.5, Math.max(cw, ch) * 0.8);
    oceanGrad.addColorStop(0, '#13263d');
    oceanGrad.addColorStop(1, '#09131f');
    ctx.fillStyle = oceanGrad;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.translate(cw * 0.5, ch * 0.5);
    ctx.scale(state.cam.zoom, state.cam.zoom);
    ctx.translate(-state.cam.x, -state.cam.y);

    // Subtle ocean lat/lon grid
    ctx.strokeStyle = 'rgba(148, 185, 224, 0.06)';
    ctx.lineWidth = 1 / state.cam.zoom;
    for (let x = 0; x <= MAP_W; x += 150) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke();
    }
    for (let y = 0; y <= MAP_H; y += 150) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke();
    }

    // Sea lane dashed connections
    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.strokeStyle = 'rgba(130, 185, 240, 0.32)';
    ctx.lineWidth = 1.6;
    const drawnSea = new Set();
    for (const p of state.provinces) {
      for (const nbId of p.seaLinks) {
        const key = p.id < nbId ? `${p.id}-${nbId}` : `${nbId}-${p.id}`;
        if (drawnSea.has(key)) continue;
        drawnSea.add(key);
        const nb = state.provinces[nbId];
        ctx.beginPath();
        ctx.moveTo(p.cx, p.cy);
        ctx.lineTo(nb.cx, nb.cy);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Soft continental coastal glow
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
    ctx.shadowBlur = 18;
    for (const p of state.provinces) {
      if (p.poly.length < 3) continue;
      ctx.beginPath();
      ctx.moveTo(p.poly[0][0], p.poly[0][1]);
      for (let i = 1; i < p.poly.length; i++) ctx.lineTo(p.poly[i][0], p.poly[i][1]);
      ctx.closePath();
      ctx.fillStyle = getProvinceFill(p);
      ctx.fill();
    }
    ctx.restore();

    // Province fills & borders
    const moveTargets = (state.mode === 'move' && state.moveSourceId !== null)
      ? state.provinces[state.moveSourceId].neighbors
      : null;

    for (const p of state.provinces) {
      if (p.poly.length < 3) continue;
      ctx.beginPath();
      ctx.moveTo(p.poly[0][0], p.poly[0][1]);
      for (let i = 1; i < p.poly.length; i++) ctx.lineTo(p.poly[i][0], p.poly[i][1]);
      ctx.closePath();

      ctx.fillStyle = getProvinceFill(p);
      ctx.fill();

      // Highlight valid move target
      if (moveTargets && moveTargets.has(p.id)) {
        const pulse = 0.22 + 0.14 * Math.sin(now * 0.006);
        const isEnemy = p.owner !== state.playerCivId;
        ctx.fillStyle = isEnemy ? `rgba(248, 113, 113, ${pulse})` : `rgba(74, 222, 128, ${pulse})`;
        ctx.fill();
      }

      // Hover highlight
      if (p.id === state.hoveredProvId) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.fill();
      }

      // Province inner border
      ctx.strokeStyle = 'rgba(10, 16, 24, 0.55)';
      ctx.lineWidth = 1.25;
      ctx.stroke();

      // Selected province golden outline
      if (p.id === state.selectedProvId) {
        ctx.strokeStyle = '#ffe082';
        ctx.lineWidth = 3.2;
        ctx.stroke();
      }
    }

    // Draw pending marching arrows (classic AoH2 dotted arrows)
    if (state.mode !== 'timelapse') {
      for (const o of state.pendingOrders) {
        if (o.civId !== state.playerCivId) continue;
        const a = state.provinces[o.from];
        const b = state.provinces[o.to];
        const isAtk = b.owner !== state.playerCivId;
        const ang = Math.atan2(b.cy - a.cy, b.cx - a.cx);
        const dist = Math.hypot(b.cx - a.cx, b.cy - a.cy);
        const endX = a.cx + Math.cos(ang) * (dist - 18);
        const endY = a.cy + Math.sin(ang) * (dist - 18);

        ctx.save();
        ctx.strokeStyle = isAtk ? '#ff6b6b' : '#4ade80';
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 6]);
        ctx.lineDashOffset = -(now * 0.03);
        ctx.beginPath();
        ctx.moveTo(a.cx, a.cy);
        ctx.lineTo(endX, endY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Arrowhead
        ctx.fillStyle = isAtk ? '#ff6b6b' : '#4ade80';
        ctx.beginPath();
        ctx.moveTo(endX + Math.cos(ang) * 10, endY + Math.sin(ang) * 10);
        ctx.lineTo(endX + Math.cos(ang + 2.4) * 10, endY + Math.sin(ang + 2.4) * 10);
        ctx.lineTo(endX + Math.cos(ang - 2.4) * 10, endY + Math.sin(ang - 2.4) * 10);
        ctx.closePath();
        ctx.fill();

        // Marching troop count pill at midpoint
        const mx = (a.cx + b.cx) * 0.5;
        const my = (a.cy + b.cy) * 0.5;
        const label = `${o.amount}`;
        ctx.font = 'bold 11px Inter, sans-serif';
        const tw = ctx.measureText(label).width + 10;
        ctx.fillStyle = 'rgba(12, 18, 28, 0.9)';
        ctx.fillRect(mx - tw * 0.5, my - 9, tw, 18);
        ctx.strokeStyle = isAtk ? '#ff6b6b' : '#4ade80';
        ctx.lineWidth = 1.2;
        ctx.strokeRect(mx - tw * 0.5, my - 9, tw, 18);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, mx, my);
        ctx.restore();
      }
    }

    // Province labels, capitals, forts & army badges
    if (state.mode !== 'timelapse') {
      for (const p of state.provinces) {
        const civ = state.civs.get(p.owner);
        const showDetail = state.cam.zoom >= 0.52;

        // Capital star or city dot
        if (p.isCapital) {
          ctx.fillStyle = '#fde047';
          ctx.strokeStyle = '#111';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(p.cx, p.cy - 14, 5.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Province name when zoomed in
        if (showDetail) {
          ctx.font = p.isCapital ? '700 12px "PingFang TC", sans-serif' : '600 10.5px "PingFang TC", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(0,0,0,0.72)';
          ctx.fillText(p.name, p.cx + 1, p.cy - 2 + 1);
          ctx.fillStyle = p.isCapital ? '#fef08a' : 'rgba(255,255,255,0.92)';
          ctx.fillText(p.name, p.cx, p.cy - 2);
        }

        // Army badge (signature AoH2 pill)
        if (p.army > 0 && state.cam.zoom >= 0.44) {
          const txt = p.army >= 10000 ? (p.army / 1000).toFixed(1) + 'k' : `${p.army}`;
          const fortIcon = p.buildings.fort > 0 ? '🛡 ' : '';
          const fullTxt = fortIcon + txt;
          ctx.font = 'bold 10.5px Inter, sans-serif';
          const bw = ctx.measureText(fullTxt).width + 12;
          const bh = 16;
          const bx = p.cx - bw * 0.5;
          const by = p.cy + 7;

          ctx.fillStyle = 'rgba(12, 18, 28, 0.86)';
          ctx.beginPath();
          ctx.roundRect(bx, by, bw, bh, 4);
          ctx.fill();

          ctx.strokeStyle = p.owner === state.playerCivId ? '#e5b95c' : (civ ? civ.color : '#888');
          ctx.lineWidth = p.owner === state.playerCivId ? 1.5 : 1.1;
          ctx.stroke();

          ctx.fillStyle = '#fff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(fullTxt, p.cx, by + bh * 0.5 + 0.5);
        }
      }
    }

    // Civilization large nameplates on political map
    if (state.mapMode === 'political' || state.mode === 'timelapse') {
      const ownersMap = new Map();
      const snap = state.mode === 'timelapse' ? state.history[state.timelapseIndex] : null;
      for (const p of state.provinces) {
        const oid = snap ? snap.owners[p.id] : p.owner;
        if (!ownersMap.has(oid)) ownersMap.set(oid, []);
        ownersMap.get(oid).push(p);
      }
      for (const [oid, list] of ownersMap.entries()) {
        if (list.length < 2) continue;
        const civ = state.civs.get(oid);
        if (!civ) continue;
        let sx = 0, sy = 0;
        for (const p of list) { sx += p.cx; sy += p.cy; }
        const cx = sx / list.length;
        const cy = sy / list.length;
        const fSize = Math.min(34, 15 + list.length * 1.4);
        ctx.font = `800 ${fSize}px "PingFang TC", serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,0.42)';
        ctx.fillText(civ.name, cx + 2, cy - 22);
        ctx.fillStyle = 'rgba(255, 250, 235, 0.34)';
        ctx.fillText(civ.name, cx, cy - 24);
      }
    }

    // Floating battle animations
    for (let i = state.animations.length - 1; i >= 0; i--) {
      const a = state.animations[i];
      const t = (now - a.born) / a.dur;
      if (t >= 1) { state.animations.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = 1 - t;
      ctx.font = 'bold 14px "PingFang TC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#000';
      ctx.fillText(a.text, a.x + 1, a.y - t * 38 + 1);
      ctx.fillStyle = a.color;
      ctx.fillText(a.text, a.x, a.y - t * 38);
      ctx.restore();
    }

    ctx.restore();
    requestAnimationFrame(drawMap);
  }

  // ======================== UI UPDATES ========================
  function updateAllUI() {
    const civ = state.civs.get(state.playerCivId);
    if (!civ) return;
    const st = getCivStats(civ.id);
    const ranks = getRankings();
    const myRankIdx = ranks.findIndex(r => r.civ.id === civ.id);

    document.getElementById('hud-flag').innerHTML = flagSVG(civ.flag);
    document.getElementById('hud-civ-name').textContent = civ.name;
    document.getElementById('hud-civ-gov').textContent = `${civ.gov}${civ.vassalOf ? ' · 附庸國' : ''}`;
    document.getElementById('hud-gold').textContent = civ.gold.toLocaleString();
    const incEl = document.getElementById('hud-income');
    incEl.textContent = (st.net >= 0 ? '+' : '') + st.net.toLocaleString();
    incEl.className = 'sub ' + (st.net >= 0 ? 'pos' : 'neg');

    document.getElementById('hud-mp').textContent = `${civ.mp.toFixed(1)} / ${civ.maxMp.toFixed(1)}`;
    document.getElementById('hud-dp').textContent = `外交 ${civ.dp.toFixed(1)}`;
    document.getElementById('hud-army').textContent = st.army.toLocaleString();
    document.getElementById('hud-provs').textContent = `${st.provCount} / ${state.provinces.length} 省`;
    document.getElementById('hud-tech').textContent = civ.tech.toFixed(2);
    document.getElementById('hud-rank').textContent = `排名 #${myRankIdx >= 0 ? myRankIdx + 1 : '-'}`;

    document.getElementById('hud-date').textContent = `${state.year}年 ${state.month}月`;
    document.getElementById('hud-turn').textContent = `第 ${state.turn} 回合 · ${state.scenario.name}`;
    document.getElementById('order-count').textContent = state.pendingOrders.filter(o => o.civId === state.playerCivId).length;

    updateProvincePanel();
  }

  function updateProvincePanel() {
    const panel = document.getElementById('province-panel');
    if (state.selectedProvId === null || state.mode === 'editor' || state.mode === 'timelapse') {
      panel.classList.add('hidden');
      return;
    }
    const p = state.provinces[state.selectedProvId];
    const owner = state.civs.get(p.owner);
    panel.classList.remove('hidden');

    document.getElementById('prov-flag').innerHTML = flagSVG(owner?.flag);
    document.getElementById('prov-name').textContent = p.name;
    document.getElementById('prov-terrain').textContent = `${TERRAIN_INFO[p.terrain].name} (防+${Math.round(TERRAIN_INFO[p.terrain].def * 100)}%)`;
    document.getElementById('prov-capital-tag').style.display = p.isCapital ? 'inline-block' : 'none';
    document.getElementById('prov-owner').textContent = owner ? owner.name : '無主地';
    document.getElementById('prov-army').textContent = p.army.toLocaleString();
    document.getElementById('prov-pop').textContent = p.pop.toLocaleString();
    document.getElementById('prov-econ').textContent = p.econ.toLocaleString();
    const stabEl = document.getElementById('prov-stab');
    stabEl.textContent = `${Math.round(p.stability)}%`;
    stabEl.style.color = p.stability >= 75 ? 'var(--green)' : (p.stability >= 45 ? 'var(--amber)' : 'var(--red)');

    const bWrap = document.getElementById('prov-buildings');
    bWrap.innerHTML = '';
    let hasB = false;
    for (const [k, info] of Object.entries(BUILDINGS)) {
      if (p.buildings[k] > 0) {
        hasB = true;
        bWrap.innerHTML += `<span class="b-chip">${info.icon} ${info.name} Lv.${p.buildings[k]}</span>`;
      }
    }
    if (!hasB) bWrap.innerHTML = `<span style="font-size:11px;color:var(--text-muted);">尚未建造任何設施</span>`;

    const actWrap = document.getElementById('prov-actions');
    actWrap.innerHTML = '';

    if (p.owner === state.playerCivId) {
      const addBtn = (label, cls, fn, disabled = false) => {
        const b = document.createElement('button');
        b.className = `btn btn-sm ${cls}`;
        b.textContent = label;
        b.disabled = disabled;
        b.onclick = fn;
        actWrap.appendChild(b);
      };
      addBtn('⚔ 徵兵', 'btn-gold', () => openRecruitModal(p));
      addBtn('➔ 行軍', 'btn-success', () => startMoveMode(p), p.army <= 0);
      addBtn('🏗 建設', '', () => openBuildModal(p));
      addBtn('📈 投資經濟 ($260)', '', () => investProvince(p));
      if (p.stability < 98 || p.coreOwner !== state.playerCivId) {
        addBtn('🕊 同化 ($200)', '', () => assimilateProvince(p));
      }
      if (p.army > 0) {
        addBtn('解散駐軍', 'btn-danger', () => disbandArmy(p));
      }
    } else {
      const rel = getRel(state.playerCivId, p.owner);
      const bDiplo = document.createElement('button');
      bDiplo.className = 'btn btn-sm btn-gold';
      bDiplo.textContent = `外交：${owner.name} (${rel.war ? '交戰中' : `關係 ${rel.score}`})`;
      bDiplo.onclick = () => openDiplomacyModal(p.owner);
      actWrap.appendChild(bDiplo);

      if (rel.war) {
        const bPeace = document.createElement('button');
        bPeace.className = 'btn btn-sm btn-success';
        bPeace.textContent = '🕊 和平談判';
        bPeace.onclick = () => openPeaceModal(p.owner);
        actWrap.appendChild(bPeace);
      } else {
        const bWar = document.createElement('button');
        bWar.className = 'btn btn-sm btn-danger';
        bWar.textContent = '⚔ 宣戰';
        bWar.onclick = () => {
          if (rel.truceUntil > state.turn) {
            showToast(`停戰協議生效中（剩餘 ${rel.truceUntil - state.turn} 回合）`);
            return;
          }
          declareWar(state.playerCivId, p.owner, false);
          updateAllUI();
        };
        actWrap.appendChild(bWar);
      }
    }
  }

  // ======================== PLAYER ACTIONS ========================
  function openRecruitModal(p) {
    const civ = state.civs.get(state.playerCivId);
    if (civ.mp < 0.6) { showToast('行動點不足（需 0.6 行動點）'); return; }
    const maxByPop = Math.floor(p.pop * 0.25);
    const maxByGold = Math.floor(Math.max(0, civ.gold) / 0.85);
    const maxRecruit = Math.min(maxByPop, maxByGold);
    if (maxRecruit < 20) { showToast('金幣或人口不足以徵召軍隊'); return; }

    const defVal = Math.max(20, Math.floor(maxRecruit * 0.5));
    openModal(`在 ${p.name} 徵兵`, `
      <div class="slider-group">
        <div class="slider-row"><span>徵召兵力</span><strong id="rec-val">${defVal.toLocaleString()}</strong></div>
        <input type="range" id="rec-slider" min="20" max="${maxRecruit}" step="10" value="${defVal}">
        <div class="slider-row" style="margin-top:8px;color:var(--text-muted);">
          <span>花費金幣：<strong class="gold-txt" id="rec-cost">${Math.round(defVal * 0.85)}</strong></span>
          <span>消耗行動點：0.6</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn" id="rec-cancel">取消</button>
        <button class="btn btn-gold" id="rec-confirm">確認徵兵</button>
      </div>
    `);
    const sl = document.getElementById('rec-slider');
    sl.oninput = () => {
      const v = Number(sl.value);
      document.getElementById('rec-val').textContent = v.toLocaleString();
      document.getElementById('rec-cost').textContent = Math.round(v * 0.85).toLocaleString();
    };
    document.getElementById('rec-cancel').onclick = closeModal;
    document.getElementById('rec-confirm').onclick = () => {
      const v = Number(sl.value);
      const cost = Math.round(v * 0.85);
      civ.gold -= cost;
      civ.mp = Math.max(0, +(civ.mp - 0.6).toFixed(1));
      p.army += v;
      p.pop -= v;
      Sound.coin();
      spawnFloatText(p.cx, p.cy, `+${v} 兵力`, '#fde047');
      closeModal();
      updateAllUI();
    };
  }

  function startMoveMode(p) {
    const civ = state.civs.get(state.playerCivId);
    if (civ.mp < 0.6) { showToast('行動點不足（需 0.6 行動點）'); return; }
    state.mode = 'move';
    state.moveSourceId = p.id;
    canvas.classList.add('crosshair');
    document.getElementById('mode-banner-text').textContent = `行軍起點：${p.name}（兵力 ${p.army.toLocaleString()}）— 請點擊發光的相鄰省份`;
    document.getElementById('mode-banner').classList.remove('hidden');
  }

  function openMoveConfirmModal(fromP, toP) {
    const isEnemy = toP.owner !== state.playerCivId;
    const defVal = fromP.army;
    openModal(isEnemy ? `進攻 ${toP.name}` : `調遣至 ${toP.name}`, `
      <p style="margin:0 0 10px;color:var(--text-muted);font-size:12px;">
        ${isEnemy ? `目標守軍約 <strong>${toP.army.toLocaleString()}</strong>，地形防禦 +${Math.round(TERRAIN_INFO[toP.terrain].def * 100)}%，堡壘 Lv.${toP.buildings.fort}。` : `增援友方省份（現有駐軍 ${toP.army.toLocaleString()}）。`}
      </p>
      <div class="slider-group">
        <div class="slider-row"><span>出動兵力</span><strong id="mv-val">${defVal.toLocaleString()}</strong></div>
        <input type="range" id="mv-slider" min="1" max="${fromP.army}" value="${defVal}">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn" id="mv-cancel">取消</button>
        <button class="btn ${isEnemy ? 'btn-danger' : 'btn-success'}" id="mv-confirm">${isEnemy ? '⚔ 下達進攻令' : '➔ 下達行軍令'}</button>
      </div>
    `);
    const sl = document.getElementById('mv-slider');
    sl.oninput = () => { document.getElementById('mv-val').textContent = Number(sl.value).toLocaleString(); };
    document.getElementById('mv-cancel').onclick = () => { closeModal(); exitSpecialMode(); };
    document.getElementById('mv-confirm').onclick = () => {
      const amt = Number(sl.value);
      const civ = state.civs.get(state.playerCivId);
      fromP.army -= amt;
      civ.mp = Math.max(0, +(civ.mp - 0.6).toFixed(1));
      state.pendingOrders.push({ from: fromP.id, to: toP.id, amount: amt, civId: state.playerCivId });
      Sound.march();
      closeModal();
      exitSpecialMode();
      updateAllUI();
      showToast(`已下達行軍命令：${fromP.name} ➔ ${toP.name} (${amt.toLocaleString()} 兵)`);
    };
  }

  function openBuildModal(p) {
    const civ = state.civs.get(state.playerCivId);
    let html = `<div class="build-grid">`;
    for (const [key, info] of Object.entries(BUILDINGS)) {
      const lv = p.buildings[key];
      const cost = Math.round(info.cost * (1 + lv * 0.45));
      const maxed = lv >= 3;
      html += `
        <div class="build-card">
          <div class="b-name">${info.icon} ${info.name} <span style="color:var(--gold);font-size:11px;">Lv.${lv}/3</span></div>
          <div class="b-desc">${info.desc}</div>
          <button class="btn btn-sm btn-gold b-do" data-b="${key}" data-cost="${cost}" ${(maxed || civ.gold < cost) ? 'disabled' : ''}>
            ${maxed ? '已達最高等級' : `建造 ($${cost})`}
          </button>
        </div>
      `;
    }
    html += `</div>`;
    openModal(`${p.name} · 基礎建設`, html);
    document.querySelectorAll('.b-do').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.b;
        const cost = Number(btn.dataset.cost);
        if (civ.gold < cost) return;
        civ.gold -= cost;
        p.buildings[k]++;
        Sound.coin();
        spawnFloatText(p.cx, p.cy, `建成 ${BUILDINGS[k].name}`, '#60a5fa');
        updateAllUI();
        openBuildModal(p);
      };
    });
  }

  function investProvince(p) {
    const civ = state.civs.get(state.playerCivId);
    if (civ.gold < 260 || civ.mp < 0.5) { showToast('需要 260 金幣與 0.5 行動點'); return; }
    civ.gold -= 260;
    civ.mp = Math.max(0, +(civ.mp - 0.5).toFixed(1));
    const gain = Math.round(110 + p.econ * 0.08);
    p.econ += gain;
    Sound.coin();
    spawnFloatText(p.cx, p.cy, `經濟 +${gain}`, '#fbbf24');
    updateAllUI();
  }

  function assimilateProvince(p) {
    const civ = state.civs.get(state.playerCivId);
    if (civ.gold < 200 || civ.dp < 0.5) { showToast('需要 200 金幣與 0.5 外交點'); return; }
    civ.gold -= 200;
    civ.dp = Math.max(0, +(civ.dp - 0.5).toFixed(1));
    p.stability = Math.min(100, p.stability + 28);
    if (p.stability >= 90) p.coreOwner = state.playerCivId;
    Sound.peace();
    spawnFloatText(p.cx, p.cy, `穩定度 ${Math.round(p.stability)}%`, '#4ade80');
    updateAllUI();
  }

  function disbandArmy(p) {
    const amt = Math.ceil(p.army * 0.5);
    p.army -= amt;
    p.pop += Math.round(amt * 0.6);
    Sound.click();
    showToast(`已在 ${p.name} 解散 ${amt.toLocaleString()} 名士兵以節省軍費`);
    updateAllUI();
  }

  // ======================== BUDGET / POLICY MODAL ========================

          <div class="slider-row"><span>稅收稅率（過高會降低穩定度）</span><strong class="gold-txt">${civ.taxRate}%</strong></div>
          <input type="range" id="pol-tax" min="5" max="28" value="${civ.taxRate}">

          <tr><td>商品投資支出</td><td class="neg" style="text-align:right;">-${st.goodsCost.toLocaleString()}</td></tr>

          <tr><th>每回合預估淨收支</th><th class="${st.net >= 0 ? 'pos' : 'neg'}" style="text-align:right;">${st.net >= 0 ? '+' : ''}${st.net.toLocaleString()}</th></tr>

      document.getElementById('pol-goods').oninput = e => { civ.goodsRate = Number(e.target.value); updateAllUI(); renderBody(); };
      document.getElementById('pol-res').oninput = e => { civ.researchRate = Number(e.target.value); updateAllUI(); renderBody(); };
    };
    openModal(`${civ.name} · 財政與政策`, '');
