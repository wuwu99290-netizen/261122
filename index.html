<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一拳超人：最強之男｜Z 市防衛戰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17181c;color:#17181c;font:16px system-ui,"PingFang TC",sans-serif}
main{width:min(820px,100%);margin:auto;min-height:100vh;background:#f6f1df;padding:clamp(14px,3vw,28px);border-inline:3px solid #101114}
header,.row,.stats{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand,.num,small{font: bold 12px ui-monospace,monospace;letter-spacing:.08em}
.brand{border-left:8px solid #e23c27;padding-left:8px}
.num{background:#17181c;color:white;padding:5px 9px}
h1{font-size:clamp(30px,6.8vw,58px);letter-spacing:-.065em;line-height:1.05;margin:16px 0 6px;font-weight:1000}
.sub{font-weight:800;color:#744134;margin-bottom:14px}
.scene{position:relative;border:3px solid;background:#efbf60;overflow:hidden}
canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
#shout{position:absolute;top:30%;left:50%;transform:translate(-50%,-50%) rotate(-7deg);color:#fff;font-size:clamp(21px,5vw,44px);font-weight:1000;white-space:nowrap;text-shadow:3px 3px #16171a,-2px -2px #16171a;pointer-events:none}
.stats{align-items:stretch;margin-top:12px}
.stat{width:50%;min-width:0}
.stat .row{font-weight:900;font-size:clamp(14px,3vw,20px)}
.stat span{font:700 13px monospace}
.bar{margin-top:5px;border:2px solid;height:13px;background:#cec9b8}
.fill{display:block;height:100%;background:#278779;transition:width .2s}
.enemy{background:#d34832}
#message{border-block:2px solid;padding:10px 0;margin:13px 0 10px;line-height:1.5;min-height:46px;font-weight:650}
#energy{font-size:14px;font-weight:bold;color:#75341c}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:9px 0}
button{font:800 clamp(15px,3vw,20px) system-ui;color:#181819;background:#fff9e8;border:2px solid #19191b;box-shadow:2px 3px #19191b;min-height:57px;padding:7px 4px;cursor:pointer;touch-action:manipulation}
button small{display:block;font:500 12px system-ui;margin-top:3px}
button:active:enabled{transform:translate(2px,2px);box-shadow:none}
button:disabled{opacity:.48;cursor:default}
#blast{background:#ffd449}
#punch,#next{width:100%;margin:4px 0;background:#bd3022;color:white}
#punch:disabled{background:#e4d9c6;color:#4b3b2e;opacity:1;box-shadow:none;border-style:dashed}
footer{margin-top:14px;font-size:12px;color:#655e50}
[hidden]{display:none!important}
</style>
</head>
<body><main>
<header><div class="brand">HERO ASSOCIATION</div><div class="num" id="stage"></div></header>
<h1>一拳超人：最強之男</h1>
<div class="sub" id="district"></div>
<div class="scene"><canvas width="320" height="112" aria-label="像素戰場：傑諾斯迎戰怪人"></canvas><div id="shout" aria-hidden="true"></div></div>
<div class="stats">
<div class="stat"><div class="row"><b>傑諾斯</b><span id="heroHp"></span></div><div class="bar"><i class="fill" id="heroBar"></i></div></div>
<div class="stat"><div class="row"><b id="enemyName"></b><span id="enemyHp"></span></div><div class="bar"><i class="fill enemy" id="enemyBar"></i></div></div>
</div>
<div id="message" role="status"></div>
<div class="row"><b id="intent"></b><span id="energy"></span></div>
<div class="actions" id="moves">
<button id="hit">機關拳<small>攻擊 · 回 1 能量</small></button>
<button id="guard">架盾蓄能<small>減傷 · 回 2 能量</small></button>
<button id="blast">焚燒炮<small>重擊 · 耗 3 能量</small></button>
</div>
<button id="punch"></button><button id="next" hidden></button>
<footer>同人小遊戲 · Z 市防衛戰</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const foes=[
 {name:'螃蟹怪人',place:'第七商店街',hp:88,color:'#bf4638',moves:[['揮鉗',11],['雙鉗重砸',27],['側身衝撞',12]]},
 {name:'深海王',place:'暴雨避難所',hp:126,color:'#348765',moves:[['酸液噴吐',15],['暴雨連擊',32],['魚尾橫掃',18]]},
 {name:'波羅斯',place:'外星母艦',hp:182,color:'#7154ad',moves:[['流星突擊',21],['崩星咆哮炮',43],['能量脈衝',19]]}
];
let level,hp,foeHp,charge,gauge,turn,status,flashTimer;
const c=document.querySelector('canvas'),g=c.getContext('2d');
const ink='#222432';
function box(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function draw(effect=''){
 const sky=['#efbb79','#6899a8','#716696'][level];
 box(0,0,320,112,sky);box(24,11,27,27,'#ffe19c');
 for(let i=0;i<23;i++){
  let x=i*15-5,h=12+(i*31%45);
  box(x,83-h,13,h,['#ae8175','#537887','#56546e'][level]);
  for(let y=85-h;y<80;y+=7)box(x+3,y,3,3,sky);
 }
 if(level===1)for(let i=0;i<56;i++)box(i*37%320,i*23%87,1,4,'#a5c1c6');
 box(0,83,320,29,'#55525b');box(0,83,320,3,'#272839');
 for(let i=0;i<10;i++)box(i*35,101,17,2,'#b6a493');
 const attacking=effect==='hit'||effect==='blast';
 g.save();g.translate(attacking?80:59,40);
 box(-10,48,34,3,'#373540');
 box(0,32,7,16,ink);box(13,31,7,17,ink);box(-4,45,12,4,ink);box(12,45,13,4,ink);
 poly([[-3,13],[17,12],[22,20],[16,34],[0,34],[-5,24]],ink);
 box(0,16,16,5,'#404755');box(2,2,14,13,'#edb991');box(13,7,5,2,ink);box(14,7,2,1,'#ffe171');
 poly([[-2,10],[-4,1],[0,2],[-2,-5],[5,-2],[6,-8],[10,-3],[16,-6],[15,-2],[21,-3],[16,4],[9,4],[5,9],[4,5]],'#ffda69');
 box(-8,16,8,12,'#aeb4ba');box(-9,24,8,8,ink);box(-8,25,6,3,'#ffbb4c');
 box(16,15,9,9,'#c8cbca');box(20,20,attacking?19:10,7,ink);box(22,21,attacking?16:7,3,'#ffb638');
 if(effect==='guard'){box(30,6,2,32,'#bafaea');box(33,13,2,17,'#bafaea')}
 g.restore();
 const f=foes[level],x=239,y=40;
 g.save();g.translate(x,y);
 box(-22,48,49,3,'#373540');
 box(-13,32,9,16,ink);box(7,31,10,17,ink);
 poly([[-16,6],[-5,1],[12,1],[22,13],[17,34],[0,38],[-18,32],[-23,17]],ink);
 poly([[-14,8],[10,4],[18,13],[13,30],[0,34],[-14,29],[-18,16]],f.color);
 if(level===0){
 for(const s of [-1,1]){box(s*8-1,-6,3,13,ink);box(s*8-3,-7,7,5,'#fff6d6');box(s*8,-6,2,3,ink);box(s*22-6,15,12,6,f.color);box(s*29-5,5,12,14,f.color);box(s*29-5,0,4,10,f.color);box(s*29+3,-1,4,9,f.color)}
 box(-9,14,17,3,ink);
 }else if(level===1){
 poly([[-17,3],[-17,-11],[-10,-6],[-4,-15],[2,-7],[10,-14],[12,2]],'#ffe16e');
 box(-13,2,24,12,f.color);box(-12,5,6,2,'#ffed95');box(-4,11,12,2,ink);
 poly([[-15,13],[-32,0],[-25,28],[-17,24]],'#6eba81');
 box(15,12,12,17,f.color);box(-27,21,13,12,f.color)
 }else{
 poly([[-13,7],[-24,-12],[-11,-8],[-17,-24],[-3,-14],[1,-29],[7,-13],[18,-23],[15,-8],[26,-12],[14,5]],'#f2a3c1');
 box(-10,-5,19,17,f.color);box(-10,0,15,5,'#fbf0ca');box(-5,0,4,5,'#c83154');
 box(-26,11,11,19,f.color);box(17,10,10,20,f.color);
 poly([[-11,16],[2,22],[14,14],[4,25],[1,30]],'#91e5df')
 }
 g.restore();
 if(effect==='blast')poly([[110,61],[224,45],[210,54],[246,55],[215,65],[228,70]],'#fff4a0');
 if(effect==='hit')poly([[118,61],[202,54],[189,59],[215,58],[197,65]],'#fff5cd');
 if(effect==='punch'){
 poly([[0,46],[183,52],[171,44],[257,55],[226,61],[250,69],[0,65]],'#fff3ba');
 box(173,54,33,8,'#edbd3d');box(201,49,23,15,'#b92e27');box(205,46,17,5,'#f45442');
 }
}
function move(){return foes[level].moves[turn%3]}
function render(effect){
 const f=foes[level];draw(effect);
 $('stage').textContent='FILE 0'+(level+1)+' / 03';
 $('district').textContent='Z 市防衛戰　／　'+f.place;
 $('enemyName').textContent=f.name;
 for(const [id,n,max] of [['hero',hp,100],['enemy',foeHp,f.hp]]){
 $(id+'Hp').textContent=n+'/'+max;$(id+'Bar').style.width=(100*n/max)+'%';
 }
 const active=status==='fight';
 $('moves').hidden=!active;$('punch').hidden=!active;$('next').hidden=active;
 $('intent').textContent=active?'敵方預告 · '+move()[0]+'（'+move()[1]+'）':status==='lost'?'防線失守':level===2?'Z 市防衛成功':'街區已清空';
 $('energy').textContent='能量 '+charge+' / 5';
 $('blast').disabled=charge<3;
 $('punch').disabled=gauge<4;
 $('punch').textContent=gauge===4?'呼叫埼玉　✦　普通一拳':'埼玉趕路中　'+gauge+' / 4';
 $('next').textContent=status==='lost'?'重新挑戰本關':level===2?'再次出動':'前往'+foes[Math.min(2,level+1)].place;
}
function start(i){
 clearTimeout(flashTimer);$('shout').textContent='';
 level=i;hp=100;foeHp=foes[i].hp;charge=2;gauge=0;turn=0;status='fight';
 $('message').textContent=['便利店的鐵閘被剪成兩半。傑諾斯放下特賣傳單，抬起右臂。','最後一班避難巴士還沒開走。雨幕裡，一頂王冠緩緩升起。','母艦的外殼裂開。波羅斯從王座上站起來，示意傑諾斯先出手。'][i];
 render();
}
function act(id){
 if(status!=='fight'||(id==='blast'&&charge<3)||(id==='punch'&&gauge<4))return;
 const [name,power]=move();
 const damage={hit:16,guard:0,blast:38,punch:foeHp}[id];
 charge=Math.min(5,charge+({hit:1,guard:2,blast:-3,punch:0}[id]));
 gauge=Math.min(4,gauge+1);foeHp=Math.max(0,foeHp-damage);
 let report='';
 if(!foeHp){
 status='won';
 report=id==='punch'?'埼玉提著一袋特價雞蛋趕到。一拳落下，紙袋裡的蛋一顆也沒破。':'傑諾斯擊破了'+foes[level].name+'。機械核心開始冷卻。';
 }else{
 const taken=id==='guard'?Math.ceil(power/4):power;
 hp=Math.max(0,hp-taken);turn++;
 report=(id==='guard'?'展開護盾，回充兩格能量。':'命中！造成 '+damage+' 傷害。')+foes[level].name+'使出'+name+'，你受到 '+taken+' 傷害。';
 if(!hp){status='lost';report+=' 核心過熱，緊急撤退。'}
 }
 $('message').textContent=report;
 clearTimeout(flashTimer);
 $('shout').textContent={hit:'連打！',guard:'防禦！',blast:'焚燒！',punch:'普通一拳。'}[id];
 render(id);
 flashTimer=setTimeout(()=>{$('shout').textContent='';draw()},580);
}
for(const id of ['hit','guard','blast','punch'])$(id).onclick=()=>act(id);
$('next').onclick=()=>start(status==='lost'?level:(level+1)%3);
start(0);
</script></body></html>
