  // ======================== DIPLOMACY & PEACE CONFERENCE ========================
  function openDiplomacyModal(targetCivId) {
    const me = state.civs.get(state.playerCivId);
    const other = state.civs.get(targetCivId);
    if (!other || !other.alive) return;
    const rel = getRel(me.id, other.id);
    const mySt = getCivStats(me.id);
    const otSt = getCivStats(other.id);
    const statusText = rel.war ? '⚔ 交戰中' : (rel.alliance ? '🤝 軍事同盟' : (rel.nap ? '🕊 互不侵犯' : '中立'));

    openModal(`外交 · ${other.name}`, `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        <div class="flag-lg">${flagSVG(other.flag)}</div>
        <div>
          <div style="font-size:15px;font-weight:800;">${other.name} <span style="font-size:11px;color:var(--gold);">(${other.gov})</span></div>
          <div style="font-size:12px;color:var(--text-muted);">
            狀態：<strong>${statusText}</strong> · 雙邊關係：<strong class="${rel.score >= 0 ? 'pos' : 'neg'}">${rel.score}</strong>
          </div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">
            領土 ${otSt.provCount} 省 · 兵力 ${otSt.army.toLocaleString()} · 科技 ${other.tech.toFixed(2)}
          </div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button class="btn" id="dip-imp">🤝 改善關係 (0.5外交點)</button>
        <button class="btn" id="dip-ins">💢 外交侮辱 (0.4外交點)</button>
        <button class="btn btn-success" id="dip-trade" ${rel.war || rel.trade ? 'disabled' : ''}>💰 貿易協定 (需關係≥10)</button>
        <button class="btn btn-success" id="dip-nap" ${rel.war || rel.nap ? 'disabled' : ''}>🕊 互不侵犯條約 (需關係≥15)</button>
        <button class="btn btn-gold" id="dip-ally" ${rel.war || rel.alliance ? 'disabled' : ''}>⭐ 締結同盟 (需關係≥40)</button>
        <button class="btn" id="dip-ult" ${rel.war ? 'disabled' : ''}>📜 最後通牒：要求附庸</button>
        ${rel.war
          ? `<button class="btn btn-gold" style="grid-column:span 2;" id="dip-peace">🕊 開啟和平條約談判（戰分 ${getWarScore(me.id, other.id)}）</button>`
          : `<button class="btn btn-danger" style="grid-column:span 2;" id="dip-war">⚔ 正式宣戰</button>`
        }
      </div>
    `);

    document.getElementById('dip-imp').onclick = () => {
      if (me.dp < 0.5) return showToast('外交點不足');
      me.dp = +(me.dp - 0.5).toFixed(1);
      rel.score = Math.min(100, rel.score + 18);
      Sound.click(); updateAllUI(); openDiplomacyModal(targetCivId);
    };
    document.getElementById('dip-ins').onclick = () => {
      if (me.dp < 0.4) return showToast('外交點不足');
      me.dp = +(me.dp - 0.4).toFixed(1);
      rel.score = Math.max(-100, rel.score - 25);
      Sound.click(); updateAllUI(); openDiplomacyModal(targetCivId);
    };
    document.getElementById('dip-trade').onclick = () => {
      if (rel.score < 10) return showToast('關係需達到 10 以上');
      rel.trade = true; rel.score = Math.min(100, rel.score + 8);
      Sound.coin(); pushNews(`💰 與 ${other.name} 簽署了貿易協定（每回合 +45 金幣）。`, 'peace');
      updateAllUI(); openDiplomacyModal(targetCivId);
    };
    document.getElementById('dip-nap').onclick = () => {
      if (rel.score < 15) return showToast('關係需達到 15 以上');
      rel.nap = true; Sound.peace(); pushNews(`🕊️ 與 ${other.name} 簽署了互不侵犯條約。`, 'peace');
      updateAllUI(); openDiplomacyModal(targetCivId);
    };
    document.getElementById('dip-ally').onclick = () => {
      if (rel.score < 40) return showToast('關係需達到 40 以上才願結盟');
      rel.alliance = true; Sound.peace(); pushNews(`⭐ 你與 ${other.name} 締結了軍事同盟！`, 'peace');
      updateAllUI(); openDiplomacyModal(targetCivId);
    };
    document.getElementById('dip-ult').onclick = () => {
      if (mySt.army > otSt.army * 2.2) {
        other.vassalOf = me.id;
        rel.alliance = true;
        Sound.peace();
        pushNews(`📜 迫於強大軍威，${other.name} 接受最後通牒成為你的附庸國！`, 'peace');
        closeModal(); updateAllUI();
      } else {
        showToast(`${other.name} 拒絕了你的最後通牒（我方兵力需超過對方 2.2 倍）`);
        rel.score = Math.max(-100, rel.score - 20);
        openDiplomacyModal(targetCivId);
      }
    };
    const warBtn = document.getElementById('dip-war');
    if (warBtn) {
      warBtn.onclick = () => {
        if (rel.truceUntil > state.turn) return showToast(`停戰協議中，剩餘 ${rel.truceUntil - state.turn} 回合`);
        declareWar(me.id, other.id, false);
        closeModal(); updateAllUI();
      };
    }
    const peaceBtn = document.getElementById('dip-peace');
    if (peaceBtn) peaceBtn.onclick = () => openPeaceModal(targetCivId);
  }

  function openPeaceModal(enemyCivId) {
    const me = state.civs.get(state.playerCivId);
    const enemy = state.civs.get(enemyCivId);
    const ws = getWarScore(me.id, enemy.id);
    const stars = Math.max(0, Math.round(ws + 15));
    const enemyProvs = state.provinces.filter(p => p.owner === enemyCivId);
    const chosen = new Set();
    let demandReparations = false;

    function calcUsed() {
      let u = chosen.size * 14;
      if (demandReparations) u += 10;
      return u;
    }

    function renderPeace() {
      const used = calcUsed();
      const canSign = ws >= -15 && used <= stars;
      document.getElementById('modal-body').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span>可用戰爭分數星數：<strong class="gold-txt">★ ${stars}</strong></span>
          <span>已消耗：<strong class="${used > stars ? 'neg' : 'pos'}">★ ${used}</strong></span>
        </div>
        <p style="font-size:11px;color:var(--text-muted);margin:0 0 8px;">勾選要求 ${enemy.name} 割讓的省份（每省消耗 ★14），或直接簽訂無條件停戰。</p>
        <div class="peace-prov-list">
          ${enemyProvs.map(p => `
            <div class="peace-item ${chosen.has(p.id) ? 'selected' : ''}" data-pid="${p.id}">
              <span>${p.name}</span><span class="gold-txt">★14</span>
            </div>
          `).join('')}
        </div>
        <label style="display:flex;align-items:center;gap:8px;margin:10px 0;cursor:pointer;font-size:12px;">
          <input type="checkbox" id="peace-rep" ${demandReparations ? 'checked' : ''}>
          要求戰爭賠款 (+450 金幣，消耗 ★10)
        </label>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
          <button class="btn" id="peace-cancel">返回</button>
          <button class="btn btn-gold" id="peace-sign" ${canSign ? '' : 'disabled'}>簽署和平條約</button>
        </div>
      `;
      document.querySelectorAll('.peace-item').forEach(el => {
        el.onclick = () => {
          const pid = Number(el.dataset.pid);
          if (chosen.has(pid)) chosen.delete(pid); else chosen.add(pid);
          renderPeace();
        };
      });
      document.getElementById('peace-rep').onchange = e => { demandReparations = e.target.checked; renderPeace(); };
      document.getElementById('peace-cancel').onclick = closeModal;
      document.getElementById('peace-sign').onclick = () => {
        const rel = getRel(me.id, enemy.id);
        for (const pid of chosen) {
          const pr = state.provinces[pid];
          pr.owner = me.id;
          pr.isCapital = false;
          pr.army = Math.min(pr.army, 100);
          pr.stability = 55;
        }
        if (demandReparations) {
          me.gold += 450;
          enemy.gold = Math.max(0, enemy.gold - 450);
        }
        rel.war = false;
        rel.truceUntil = state.turn + 10;
        rel.warScoreA = 0;
        Sound.peace();
        pushNews(`🕊️ 與 ${enemy.name} 簽署和平條約！獲得 ${chosen.size} 個省份${demandReparations ? '與賠款' : ''}。`, 'peace');
        closeModal();
        updateAllUI();
      };
    }
    openModal(`和平談判 · ${enemy.name}`, '');
    renderPeace();
  }

  function openRankingModal() {
    const ranks = getRankings();
    openModal('世界列強排行榜', `
      <table class="list-table">
        <thead><tr><th>#</th><th>文明</th><th>省份</th><th>總人口</th><th>總兵力</th><th>綜合分數</th></tr></thead>
        <tbody>
          ${ranks.map((r, i) => `
            <tr style="${r.civ.id === state.playerCivId ? 'background:rgba(229,185,92,0.14);' : ''}">
              <td><strong>${i + 1}</strong></td>
              <td style="display:flex;align-items:center;gap:6px;"><span class="flag-mini" style="width:20px;height:14px;">${flagSVG(r.civ.flag)}</span>${r.civ.name}</td>
              <td>${r.stats.provCount}</td>
              <td>${(r.stats.pop / 1000).toFixed(1)}k</td>
              <td>${r.stats.army.toLocaleString()}</td>
              <td class="gold-txt"><strong>${r.score}</strong></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `);
  }

  // ======================== TIMELAPSE REPLAY ========================
  function startTimelapse() {
    if (state.history.length < 2) {
      showToast('至少進行 2 個回合後才能觀看歷史疆域回放');
      return;
    }
    exitSpecialMode();
    state.mode = 'timelapse';
    state.timelapseIndex = 0;
    document.getElementById('province-panel').classList.add('hidden');
    document.getElementById('mode-banner').classList.remove('hidden');

    const step = () => {
      const snap = state.history[state.timelapseIndex];
      document.getElementById('mode-banner-text').textContent = `📽 歷史延時回放：${snap.year}年 ${snap.month}月（第 ${state.timelapseIndex + 1} / ${state.history.length} 回合）`;
      state.timelapseIndex++;
      if (state.timelapseIndex >= state.history.length) {
        state.timelapseIndex = 0;
      }
    };
    step();
    state.timelapseTimer = setInterval(step, 450);
  }

  // ======================== SCENARIO EDITOR ========================
  function openEditorMode() {
    document.getElementById('title-screen').classList.add('hidden');
    initScenario(SCENARIOS[state.selectedScenarioIdx], state.selectedStartCivId, false);
    state.mode = 'editor';
    state.editorPaintCivId = state.selectedStartCivId;
    document.getElementById('province-panel').classList.add('hidden');
    document.getElementById('editor-panel').classList.remove('hidden');
    renderEditorCivList();
  }

  function renderEditorCivList() {
    const wrap = document.getElementById('editor-civ-list');
    wrap.innerHTML = '';
    for (const c of state.civs.values()) {
      const el = document.createElement('div');
      el.className = 'civ-opt' + (c.id === state.editorPaintCivId ? ' active' : '');
      el.innerHTML = `<div class="flag-mini">${flagSVG(c.flag)}</div><div class="civ-opt-name">${c.name}</div>`;
      el.onclick = () => { state.editorPaintCivId = c.id; renderEditorCivList(); };
      wrap.appendChild(el);
    }
  }

  // ======================== MODAL, NEWS & TOAST HELPERS ========================
  function openModal(title, html) {
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-backdrop').classList.remove('hidden');
  }
  function closeModal() {
    document.getElementById('modal-backdrop').classList.add('hidden');
  }

  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
  }

  function clearNews() {
    document.getElementById('news-feed').innerHTML = '';
  }
  function pushNews(msg, kind = '') {
    const feed = document.getElementById('news-feed');
    const div = document.createElement('div');
    div.className = `news-item ${kind}`;
    div.textContent = msg;
    feed.prepend(div);
    while (feed.children.length > 4) feed.lastChild.remove();
  }

  function exitSpecialMode() {
    if (state.timelapseTimer) {
      clearInterval(state.timelapseTimer);
      state.timelapseTimer = null;
    }
    state.mode = 'normal';
    state.moveSourceId = null;
    canvas.classList.remove('crosshair');
    document.getElementById('mode-banner').classList.add('hidden');
    document.getElementById('editor-panel').classList.add('hidden');
    updateProvincePanel();
  }

  // ======================== TITLE SCREEN ========================
  function renderTitleScreen() {
    const scList = document.getElementById('scenario-list');
    scList.innerHTML = '';
    SCENARIOS.forEach((sc, idx) => {
      const card = document.createElement('div');
      card.className = 'scenario-card' + (idx === state.selectedScenarioIdx ? ' active' : '');
      card.innerHTML = `
        <div class="sc-year">${sc.year} 年 · ${sc.civs.length} 個文明</div>
        <div class="sc-name">${sc.name}</div>
        <div class="sc-desc">${sc.desc}</div>
      `;
      card.onclick = () => {
        state.selectedScenarioIdx = idx;
        state.selectedStartCivId = sc.civs[0].id;
        Sound.click();
        renderTitleScreen();
      };
      scList.appendChild(card);
    });

    const picker = document.getElementById('civ-picker');
    picker.innerHTML = '';
    const sc = SCENARIOS[state.selectedScenarioIdx];
    sc.civs.forEach(c => {
      const opt = document.createElement('div');
      opt.className = 'civ-opt' + (c.id === state.selectedStartCivId ? ' active' : '');
      opt.innerHTML = `
        <div class="flag-mini">${flagSVG(c.flag)}</div>
        <div class="civ-opt-info">
          <div class="civ-opt-name">${c.name}</div>
          <div class="civ-opt-meta">${c.gov} · 科技 ${c.tech}</div>
        </div>
      `;
      opt.onclick = () => {
        state.selectedStartCivId = c.id;
        Sound.click();
        renderTitleScreen();
      };
      picker.appendChild(opt);
    });
  }

  function showTitleScreen() {
    exitSpecialMode();
    renderTitleScreen();
    document.getElementById('title-screen').classList.remove('hidden');
  }

  // ======================== POINTER & CAMERA INTERACTION ========================
  let dragging = false;
  let movedDist = 0;
  let lastX = 0, lastY = 0;

  canvas.addEventListener('pointerdown', e => {
    dragging = true;
    movedDist = 0;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    const rect = canvas.getBoundingClientRect();
    const sx = e.clientX - rect.left;
    const sy = e.clientY - rect.top;

    if (dragging) {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      movedDist += Math.hypot(dx, dy);
      state.cam.x -= dx / state.cam.zoom;
      state.cam.y -= dy / state.cam.zoom;
      state.cam.x = Math.max(0, Math.min(MAP_W, state.cam.x));
      state.cam.y = Math.max(0, Math.min(MAP_H, state.cam.y));
      lastX = e.clientX;
      lastY = e.clientY;
      return;
    }
    const w = screenToWorld(sx, sy);
    state.hoveredProvId = findProvinceAt(w.x, w.y);
  });

  canvas.addEventListener('pointerup', e => {
    if (!dragging) return;
    dragging = false;
    if (movedDist < 7) {
      const rect = canvas.getBoundingClientRect();
      const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
      const pid = findProvinceAt(w.x, w.y);
      handleProvinceClick(pid);
    }
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    state.cam.zoom = Math.max(0.38, Math.min(2.2, state.cam.zoom * factor));
  }, { passive: false });

  function handleProvinceClick(pid) {
    if (state.mode === 'timelapse') return;
    if (pid === null) {
      if (state.mode === 'move') exitSpecialMode();
      else { state.selectedProvId = null; updateProvincePanel(); }
      return;
    }

    if (state.mode === 'editor') {
      state.provinces[pid].owner = state.editorPaintCivId;
      Sound.click();
      return;
    }

    if (state.mode === 'move' && state.moveSourceId !== null) {
      const fromP = state.provinces[state.moveSourceId];
      if (fromP.neighbors.has(pid)) {
        openMoveConfirmModal(fromP, state.provinces[pid]);
      } else {
        showToast('只能行軍至相鄰或有海路相連的省份');
      }
      return;
    }

    Sound.click();
    state.selectedProvId = pid;
    updateProvincePanel();
  }

  // ======================== WIRE ALL CONTROLS ========================
  document.getElementById('btn-start-game').onclick = () => {
    Sound.turn();
    document.getElementById('title-screen').classList.add('hidden');
    initScenario(SCENARIOS[state.selectedScenarioIdx], state.selectedStartCivId, false);
  };
  document.getElementById('btn-open-editor').onclick = () => {
    Sound.click();
    openEditorMode();
  };
  document.getElementById('btn-editor-play').onclick = () => {
    Sound.turn();
    document.getElementById('editor-panel').classList.add('hidden');
    initScenario(SCENARIOS[state.selectedScenarioIdx], state.editorPaintCivId, true);
  };
  document.getElementById('btn-editor-exit').onclick = () => {
    Sound.click();
    showTitleScreen();
  };

  document.getElementById('btn-next-turn').onclick = nextTurn;
  document.getElementById('btn-undo-orders').onclick = () => {
    const civ = state.civs.get(state.playerCivId);
    let refunded = 0;
    state.pendingOrders = state.pendingOrders.filter(o => {
      if (o.civId === state.playerCivId) {
        state.provinces[o.from].army += o.amount;
        civ.mp = Math.min(civ.maxMp, +(civ.mp + 0.6).toFixed(1));
        refunded++;
        return false;
      }
      return true;
    });
    if (refunded > 0) {
      Sound.click();
      showToast(`已撤銷 ${refunded} 條行軍命令並返還兵力與行動點`);
      updateAllUI();
    }
  };

  document.getElementById('btn-budget').onclick = () => { Sound.click(); openBudgetModal(); };
  document.getElementById('hud-flag').onclick = () => { Sound.click(); openBudgetModal(); };
  document.getElementById('btn-diplo-list').onclick = () => { Sound.click(); openWorldDiploList(); };
  document.getElementById('btn-ranking').onclick = () => { Sound.click(); openRankingModal(); };
  document.getElementById('btn-timelapse').onclick = () => { Sound.click(); startTimelapse(); };
  document.getElementById('btn-cancel-mode').onclick = () => { Sound.click(); exitSpecialMode(); };
  document.getElementById('btn-close-prov').onclick = () => { state.selectedProvId = null; updateProvincePanel(); };
  document.getElementById('btn-close-modal').onclick = closeModal;
  document.getElementById('modal-backdrop').addEventListener('click', e => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });

  document.getElementById('btn-zoom-in').onclick = () => { state.cam.zoom = Math.min(2.2, state.cam.zoom * 1.2); };
  document.getElementById('btn-zoom-out').onclick = () => { state.cam.zoom = Math.max(0.38, state.cam.zoom * 0.82); };
  document.getElementById('btn-zoom-reset').onclick = () => centerCameraOnCiv(state.playerCivId);
  document.getElementById('btn-mute').onclick = e => {
    const m = Sound.toggle();
    e.target.textContent = m ? '🔇' : '🔊';
  };
  document.getElementById('btn-menu').onclick = () => { Sound.click(); showTitleScreen(); };

  document.querySelectorAll('#map-modes .mode-btn').forEach(btn => {
    btn.onclick = () => {
      Sound.click();
      state.mapMode = btn.dataset.mode;
      document.querySelectorAll('#map-modes .mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    };
  });

  window.addEventListener('keydown', e => {
    if (!document.getElementById('title-screen').classList.contains('hidden')) return;
    if (!document.getElementById('modal-backdrop').classList.contains('hidden')) {
      if (e.key === 'Escape') closeModal();
      return;
    }
    if (e.code === 'Space') { e.preventDefault(); nextTurn(); }
    else if (e.key === 'Escape') exitSpecialMode();
    else if (['1','2','3','4','5'].includes(e.key)) {
      const modes = ['political','diplomacy','economy','population','terrain'];
      state.mapMode = modes[Number(e.key) - 1];
      document.querySelectorAll('#map-modes .mode-btn').forEach((b, i) => b.classList.toggle('active', i === Number(e.key) - 1));
    }
  });

  window.addEventListener('resize', resizeCanvas);

  // ======================== BOOT ========================
  window.onload = () => {
    resizeCanvas();
    initScenario(SCENARIOS[0], 1, false);
    renderTitleScreen();
    requestAnimationFrame(drawMap);
  };
})();
</script>
</body>
</html>
