<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一拳超人 · 6v6 战斗模拟器</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101218;
    --panel: #1b1e27;
    --line: #383e4e;
    --text: #f4f5f7;
    --muted: #b0b5c3;
    --orange: #ff913b;
    --ally: #66beff;
    --enemy: #ff767e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--text);
    background: var(--bg);
    font: 16px/1.5 system-ui, "Microsoft YaHei", sans-serif;
  }
  main { width: min(1280px, 95%); margin: auto; padding-bottom: 40px; }
  header, .bar, .actions, .tabs, .card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header { justify-content: space-between; padding: 24px 0 18px; }
  h1, h2, h3, p { margin: 0; }
  h1 { font-size: clamp(26px, 4vw, 42px); }
  h2 { font-size: 20px; }
  h3 { font-size: 16px; }
  .muted, small { color: var(--muted); }
  button, select {
    font: inherit;
    color: var(--text);
    background: #272c38;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 12px;
  }
  button { cursor: pointer; }
  button:hover:enabled { border-color: #bec4cf; }
  button:focus-visible, select:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 2px;
  }
  button:disabled { opacity: .45; cursor: default; }
  .primary, .active {
    border-color: var(--orange);
    background: #49301f;
    color: #ffc690;
  }
  .primary { color: #1c1510; background: var(--orange); font-weight: 750; }
  .panel, .team {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 14px;
  }
  .bar { justify-content: space-between; }
  .field { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .team { --accent: var(--ally); border-top: 3px solid var(--accent); }
  .team.enemy { --accent: var(--enemy); }
  .team h2 { color: var(--accent); }
  .team-grid, .slots {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin-top: 10px;
  }
  .unit {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 118px;
    text-align: left;
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(135deg, var(--tint), #171a22 85%);
  }
  .portrait {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    z-index: -2;
    display: none;
  }
  .unit::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(0deg, #11141cf5, #11141c66 48%, transparent);
  }
  .badge { font-weight: 900; color: #ffffff38; font-size: 27px; }
  .card-title { justify-content: space-between; gap: 2px; }
  .tag {
    font-size: 11px;
    border-radius: 3px;
    background: #121620d9;
    padding: 1px 4px;
  }
  .hp {
    height: 5px;
    background: #4b4e57;
    border-radius: 4px;
    overflow: hidden;
    margin: 4px 0;
  }
  .hp span { display: block; height: 100%; background: #75dc99; }
  .hp-text, .state-text { font-size: 11px; }
  .state-text { color: #ffd192; }
  .actor { box-shadow: inset 0 0 0 2px var(--orange); }
  .target { border-color: #c4a362; }
  .selected { outline: 2px solid #ffe5a0; outline-offset: 1px; }
  .dead { filter: grayscale(1); opacity: .45; }
  .energy { color: #ffd470; }
  .turns { display: flex; gap: 6px; overflow: auto; padding-top: 9px; }
  .turn {
    white-space: nowrap;
    padding: 3px 7px;
    border-radius: 4px;
    border-bottom: 2px solid var(--ally);
    background: #292e3a;
    font-size: 13px;
  }
  .turn.red { border-color: var(--enemy); }
  .actions, .tabs { margin: 10px 0; }
  .log { max-height: 220px; overflow: auto; }
  .log div { border-bottom: 1px solid var(--line); padding: 5px 0; font-size: 14px; }
  dialog {
    width: min(850px, 94vw);
    max-height: 88vh;
    overflow: auto;
    padding: 18px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid #4a5366;
    border-radius: 10px;
  }
  dialog::backdrop { background: #070910c9; }
  .library {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(106px, 1fr));
    gap: 7px;
    margin: 10px 0;
  }
  .library button, .slots button { text-align: left; }
  .library small, .slots small { display: block; font-size: 12px; }
  .slots { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .details { line-height: 1.8; }
  [hidden] { display: none !important; }
  @media (max-width: 720px) {
    .field { grid-template-columns: 1fr; gap: 0; }
    .unit { min-height: 99px; }
    .team { padding: 10px; }
    .slots { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .panel { padding: 12px; }
    header { padding-top: 15px; }
    .actions button { flex: 1; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>一拳超人 · 战斗模拟器</h1>
      <p class="muted">6v6 回合制策略对战</p>
    </div>
    <div class="actions">
      <button id="guide">角色图鉴</button>
      <button id="rules">战斗规则</button>
      <button id="setup">阵容配置</button>
      <button id="start" class="primary">开始战斗</button>
    </div>
  </header>

  <section class="panel bar">
    <strong id="phase"></strong>
    <span id="modeText" class="muted"></span>
  </section>

  <div class="field">
    <section class="team" id="team0"></section>
    <section class="team enemy" id="team1"></section>
  </div>

  <section id="command" class="panel" hidden></section>

  <section class="panel">
    <h2>行动顺序</h2>
    <div id="order" class="turns"></div>
  </section>

  <section class="panel">
    <h2>战斗记录</h2>
    <div id="logs" class="log" aria-live="polite"></div>
  </section>
</main>

<dialog id="modal">
  <div class="bar">
    <h2 id="modalTitle"></h2>
    <button id="closeModal" aria-label="关闭弹窗">关闭</button>
  </div>
  <div id="modalBody"></div>
</dialog>

<script>
"use strict";

/* ────────── 一、角色表 ──────────
   行格式：
   名字、系别、生命、攻击、速度、绝技、范围、附加效果、被动。
   前六名为默认我方角色，后续角色也可自由分配到任意一边。
*/
const heroes = [
  ["杰诺斯",       "科技",1080,164,124,"焚烧炮",       "列",  "灼烧","增幅"],
  ["战栗的龙卷",   "超能", 970,180,132,"念动力风暴",   "全体","受伤","追击"],
  ["银色獠牙",     "格斗",1450,145,117,"流水岩碎拳",   "前排","崩坏","反伤"],
  ["原子武士",     "武器",1100,177,128,"原子斩",       "列",  "受伤","追击"],
  ["童帝",         "科技",1020,135,142,"勇气巨人",     "单体","崩坏","增幅"],
  ["KING",         "超能",1300,128,107,"帝王引擎",     "全体","崩坏","护盾"],
  ["饿狼",         "格斗",1300,170,129,"旋风铁斩拳",   "前排","受伤","不屈"],
  ["音速索尼克",   "武器", 960,168,150,"十影葬",       "后排","崩坏","追击"],
  ["深海王",       "格斗",1490,150,109,"深海酸液",     "列",  "酸蚀","再生"],
  ["阿修罗独角仙", "格斗",1690,155, 97,"阿修罗冲撞",   "列",  "受伤","反伤"],
  ["波罗斯",       "超能",1300,185,125,"崩星咆哮炮",   "全体","灼烧","再生"],
  ["蚊女",         "超能",1050,154,135,"血色风暴",     "后排","受伤","吸血"],
  ["僵尸男",       "武器",1200,142,110,"不死连射",     "单体","受伤","复活"],
  ["地狱的吹雪",   "超能",1120,145,119,"地狱岚",       "全体","坚韧","护盾"],
  ["背心尊者",     "格斗",1660,148,103,"背心擒抱",     "前排","坚韧","护盾"],
  ["甜心假面",     "格斗",1100,174,127,"华丽连击",     "后排","受伤","吸血"],
  ["金属球棒",     "武器",1380,165,114,"野蛮龙卷风",   "列",  "崩坏","不屈"],
  ["性感囚犯",     "格斗",1520,153,105,"天使连打",     "后排","崩坏","再生"],
  ["疫苗人",       "超能",1210,162,118,"疫苗爆破",     "全体","酸蚀","增幅"],
  ["基诺斯博士",   "科技",1050,130,121,"进化改造",     "前排","坚韧","再生"],
  ["黄金球",       "武器",1030,157,123,"黄金破甲弹",   "全体","崩坏","追击"],
  ["毒刺",         "武器",1100,165,126,"巨型螺旋刺",   "列",  "受伤","吸血"],
  ["闪电麦克斯",   "格斗",1130,155,134,"闪电飞踢",     "单体","灼烧","增幅"],
  ["无证骑士",     "格斗",1220,120,100,"正义冲撞",     "单体","坚韧","不屈"]
].map(([name,type,hp,atk,spd,skill,range,effect,passive], id) => ({
  id, name, type, hp, atk, spd, skill, range, effect, passive
}));

const cores = {
  4: {
    name: "天才战略",
    need: ["科技","格斗","超能"],
    text: "每回合开始，额外获得 2 点能量。"
  },
  8: {
    name: "深海之力",
    need: ["格斗","武器","超能"],
    text: "己方受到直接生命伤害时回复 1 火，每回合最多 2 火。"
  },
  12: {
    name: "不灭之躯",
    need: ["武器","格斗","科技"],
    text: "己方施加受伤或通过绝技获得坚韧时回复 1 火，每回合最多 2 火。"
  }
};

const passives = {
  增幅: "绝技伤害提高 15%。",
  追击: "攻击已有崩坏或受伤状态的敌人时，伤害提高 20%。",
  反伤: "向攻击者反弹自身受到的直接生命伤害的 20%。",
  不屈: "每场首次受到致命伤害，保留 1 点生命。",
  复活: "每场首次倒下，恢复 40% 最大生命。",
  护盾: "每回合开始，自身护盾至少达到 100 点。",
  再生: "行动前恢复 6% 最大生命。",
  吸血: "恢复本次直接生命伤害总量的 18%。"
};

const sideNames = ["我方", "敌方"];
const tints = {科技:"#375470",超能:"#5a4274",武器:"#40536a",格斗:"#744a35"};
const multipliers = {单体:2.25, 列:1.65, 全体:1.02, 前排:1.42, 后排:1.42};

function freshConfig() {
  return {
    teams: [[2,0,3,1,4,5], [9,8,6,10,11,7]],
    cores: [4,8],
    mode: "local"
  };
}

function loadConfig() {
  try {
    const c = JSON.parse(localStorage.getItem("opm-html-v1"));
    const goodTeam = t => Array.isArray(t) && t.length === 6 &&
      new Set(t).size === 6 && t.every(id => Number.isInteger(id) && heroes[id]);
    if (c?.teams?.length === 2 && c.teams.every(goodTeam)) {
      return {
        teams: c.teams,
        cores: c.teams.map((team, side) => {
          const id = c.cores?.[side];
          return team.includes(id) && cores[id] ? id : null;
        }),
        mode: c.mode === "cpu" ? "cpu" : "local"
      };
    }
  } catch {}
  return freshConfig();
}

function activeCore(config, side) {
  const id = config.cores[side];
  const team = config.teams[side];
  if (!team.includes(id) || !cores[id]) return null;
  const types = new Set(team.map(n => heroes[n].type));
  return cores[id].need.every(type => types.has(type)) ? id : null;
}

function makeUnits(config) {
  return config.teams.flatMap((team, side) => team.map((id, slot) => ({
    ...heroes[id],
    key: side * 6 + slot,
    side, slot,
    maxHP: heroes[id].hp,
    shield: 0,
    status: {},
    usedSurvival: false
  })));
}

function speedOrder(units) {
  return units.filter(u => u.hp > 0).sort((a,b) =>
    b.spd - a.spd || a.side - b.side || a.slot - b.slot
  );
}

/* ────────── 二、战斗引擎 ────────── */

class Battle {
  constructor(config) {
    this.mode = config.mode;
    this.units = makeUnits(config);
    this.core = [activeCore(config,0), activeCore(config,1)];
    this.energy = [3,3];
    this.coreUses = [0,0];
    this.round = 0;
    this.queue = [];
    this.actor = null;
    this.charge = 0;
    this.finished = false;
    this.winner = null;
    this.logs = [];
    this.nextActor();
  }

  log(text) {
    this.logs.push("第 " + this.round + " 回合 · " + text);
  }

  living(side) {
    return this.units.filter(u => u.side === side && u.hp > 0);
  }

  addEnergy(side, amount) {
    this.energy[side] = Math.min(10, this.energy[side] + amount);
  }

  coreEvent(side, id) {
    if (this.core[side] !== id || this.coreUses[side] >= 2) return;
    this.coreUses[side]++;
    this.addEnergy(side, 1);
    this.log(sideNames[side] + "触发「" + cores[id].name + "」，能量 +1");
  }

  beginRound() {
    this.round++;
    this.coreUses = [0,0];
    this.queue = speedOrder(this.units);
    for (const side of [0,1]) {
      if (this.round > 1) this.addEnergy(side, 3);
      if (this.core[side] === 4) this.addEnergy(side, 2);
      for (const u of this.living(side)) {
        if (u.passive === "护盾") u.shield = Math.max(u.shield, 100);
      }
    }
    this.log("回合开始");
  }

  checkResult() {
    const left = this.living(0).length;
    const right = this.living(1).length;
    if (left && right) return false;
    this.finished = true;
    this.actor = null;
    this.winner = left ? 0 : right ? 1 : null;
    this.log(this.winner === null ? "双方同时退场，平局" : sideNames[this.winner] + "胜利");
    return true;
  }

  // 返回扣除护盾后实际损失的生命，用于吸血和反伤。
  hurt(unit, amount) {
    const damage = Math.max(0, Math.round(amount));
    const blocked = Math.min(unit.shield, damage);
    unit.shield -= blocked;
    const lost = Math.min(unit.hp, damage - blocked);
    unit.hp -= lost;

    if (unit.hp === 0 && !unit.usedSurvival) {
      if (unit.passive === "复活" || unit.passive === "不屈") {
        unit.usedSurvival = true;
        unit.hp = unit.passive === "复活" ? Math.ceil(unit.maxHP * .4) : 1;
        this.log(unit.name + "触发" + unit.passive + "，生命恢复至 " + unit.hp);
      }
    }
    if (unit.hp === 0) {
      unit.status = {};
      this.log(sideNames[unit.side] + "的" + unit.name + "退场");
    }
    return lost;
  }

  afterAction(actor) {
    for (const u of this.units) {
      if (u.hp > 0 && u.status["酸蚀"]) {
        this.hurt(u, Math.ceil(u.maxHP * .012));
      }
    }
    for (const effect of Object.keys(actor.status)) {
      actor.status[effect]--;
      if (actor.status[effect] <= 0) delete actor.status[effect];
    }
  }

  nextActor() {
    while (!this.finished) {
      if (!this.queue.length) this.beginRound();
      const actor = this.queue.shift();
      if (!actor.hp) continue;
      this.actor = actor;

      if (actor.status["灼烧"]) {
        this.log(actor.name + "受到行动前灼烧");
        this.hurt(actor, Math.ceil(actor.maxHP * .06));
      }
      if (!actor.hp) {
        this.afterAction(actor);
        if (this.checkResult()) return;
        continue;
      }
      if (actor.passive === "再生") {
        actor.hp = Math.min(actor.maxHP, actor.hp + Math.ceil(actor.maxHP * .06));
      }
      return;
    }
  }

  targets(kind) {
    if (this.finished) return [];
    const actor = this.actor;
    const enemies = this.living(1 - actor.side);
    if (kind === "assist") {
      return this.mode === "cpu" && actor.side === 0 && this.charge >= 6 ? enemies : [];
    }
    const range = kind === "ult" ? actor.range : "单体";
    const front = enemies.filter(u => u.slot < 3);
    const back = enemies.filter(u => u.slot >= 3);
    if (range === "全体" || range === "列") return enemies;
    if (range === "后排") return back.length ? back : front;
    return front.length ? front : back;
  }

  act(kind, targetKey) {
    if (this.finished || !["basic","ult","assist"].includes(kind)) return false;
    const actor = this.actor;
    const options = this.targets(kind);
    const target = options.find(u => u.key === targetKey);
    if (!target) return false;

    if (kind === "assist") {
      target.hp = 0;
      target.shield = 0;
      target.status = {};
      this.charge = 0;
      this.log("埼玉援助！一拳击退" + target.name);
      this.checkResult();
      return true; // 援助不占用当前角色的行动。
    }

    const ult = kind === "ult";
    if (ult && this.energy[actor.side] < 2) return false;
    if (ult) this.energy[actor.side] -= 2;

    const range = ult ? actor.range : "单体";
    let victims = [target];
    if (range === "列") {
      victims = options.filter(u => u.slot % 3 === target.slot % 3);
    } else if (["全体","前排","后排"].includes(range)) {
      victims = options;
    }

    let total = 0;
    let reflected = 0;
    for (const victim of victims) {
      let damage = actor.atk * (ult ? multipliers[range] : 1);
      if (victim.status["崩坏"]) damage *= 1.3;
      if (victim.status["受伤"]) damage += actor.atk * .25;
      if (ult && actor.passive === "增幅") damage *= 1.15;
      if (actor.passive === "追击" && (victim.status["崩坏"] || victim.status["受伤"])) {
        damage *= 1.2;
      }

      const lost = this.hurt(victim, damage);
      total += lost;
      if (lost > 0) this.coreEvent(victim.side, 8);
      if (victim.passive === "反伤") reflected += Math.round(lost * .2);

      if (ult && victim.hp && actor.effect !== "坚韧") {
        victim.status[actor.effect] = 2;
        if (actor.effect === "受伤") this.coreEvent(actor.side, 12);
      }
    }

    if (ult && actor.effect === "坚韧") {
      for (const ally of this.living(actor.side)) {
        ally.shield = Math.min(400, ally.shield + 120);
      }
      this.coreEvent(actor.side, 12);
    }
    if (actor.passive === "吸血") {
      actor.hp = Math.min(actor.maxHP, actor.hp + Math.ceil(total * .18));
    }
    if (reflected) this.hurt(actor, reflected);

    this.log(
      actor.name + "使用「" + (ult ? actor.skill : "普攻") + "」，命中" +
      victims.map(v => v.name).join("、") + "，造成 " + total + " 点生命伤害"
    );
    if (this.mode === "cpu" && actor.side === 0) {
      this.charge = Math.min(6, this.charge + 1);
    }
    this.afterAction(actor);
    if (!this.checkResult()) this.nextActor();
    return true;
  }
}

/* ────────── 三、界面与操作 ────────── */

const $ = id => document.getElementById(id);
let config = loadConfig();
let battle = null;
let action = "basic";
let targetKey = null;
let aiTimer = null;
let draft = null;
let editSide = 0;
let editSlot = 0;
let editFilter = "全部";

function aiTurn() {
  return battle && !battle.finished && battle.mode === "cpu" && battle.actor.side === 1;
}

function showDialog(title, body) {
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = body;
  if (!$("modal").open) $("modal").showModal();
}

$("closeModal").onclick = () => $("modal").close();

// assets 为可选目录。加载结果会缓存，重绘战场时无需重复探测。
const portraits = new Map();
function loadPortrait(id) {
  if (!portraits.has(id)) {
    const url = "assets/hero-" + String(id).padStart(2, "0") + ".webp";
    portraits.set(id, new Promise(resolve => {
      const image = new Image();
      image.onload = () => resolve(url);
      image.onerror = () => resolve(null);
      image.src = url;
    }));
  }
  return portraits.get(id);
}

function paintPortraits() {
  document.querySelectorAll("img[data-hero]").forEach(async img => {
    const url = await loadPortrait(Number(img.dataset.hero));
    if (url && img.isConnected) {
      img.src = url;
      img.style.display = "block";
      const badge = img.parentElement.querySelector(".badge");
      if (badge) badge.style.visibility = "hidden";
    }
  });
}

function unitCard(u, legal) {
  const classes = ["unit"];
  if (!u.hp) classes.push("dead");
  if (battle && !battle.finished && battle.actor.key === u.key) classes.push("actor");
  if (legal.some(v => v.key === u.key)) classes.push("target");
  if (legal.length && u.key === targetKey) classes.push("selected");

  const states = Object.keys(u.status).map(k => k + "×" + u.status[k]);
  if (u.shield) states.push("盾 " + u.shield);
  const position = (u.slot < 3 ? "前排 " : "后排 ") + (u.slot % 3 + 1);
  const coreTag = config.cores[u.side] === u.id ? " · 核心" : "";

  return '<button class="' + classes.join(" ") + '" data-key="' + u.key +
    '" style="--tint:' + tints[u.type] + '">' +
    '<img class="portrait" data-hero="' + u.id + '" alt="">' +
    '<div class="card-title"><span class="tag">' + position + coreTag +
    '</span><span class="tag">' + u.type + '</span></div>' +
    '<span class="badge" aria-hidden="true">' + u.type + '</span>' +
    '<div><strong>' + u.name + '</strong>' +
    '<div class="hp"><span style="width:' + (100 * u.hp / u.maxHP) + '%"></span></div>' +
    '<div class="hp-text">' + u.hp + ' / ' + u.maxHP + '</div>' +
    '<div class="state-text">' + states.join(" · ") + '</div></div></button>';
}

function render() {
  const units = battle ? battle.units : makeUnits(config);
  const playing = battle && !battle.finished;
  const legal = playing && !aiTurn() ? battle.targets(action) : [];
  if (!legal.some(u => u.key === targetKey)) targetKey = legal[0]?.key ?? null;

  $("phase").textContent = !battle ? "准备阶段" :
    battle.finished ? "战斗结束" : "第 " + battle.round + " 回合";
  $("modeText").textContent = config.mode === "cpu" ? "人机对战" : "同机双人对战";
  $("start").textContent = battle ? "重新开战" : "开始战斗";

  for (const side of [0,1]) {
    const core = activeCore(config, side);
    const coreText = core === null ? "核心未激活" : "核心 · " + cores[core].name;
    const energy = battle ? battle.energy[side] : 3 + (core === 4 ? 2 : 0);
    $("team" + side).innerHTML =
      '<div class="bar"><h2>' + sideNames[side] + '阵容</h2>' +
      '<strong class="energy">⚡ ' + energy + ' / 10</strong></div>' +
      '<small>' + coreText + '</small><div class="team-grid">' +
      units.filter(u => u.side === side).map(u => unitCard(u, legal)).join("") +
      '</div>';
  }

  document.querySelectorAll("[data-key]").forEach(button => {
    button.onclick = () => {
      const key = Number(button.dataset.key);
      const u = units[key];
      if (!battle) return openSetup(u.side, u.slot);
      if (legal.some(v => v.key === key)) {
        targetKey = key;
        render();
      } else {
        showHero(u.id);
      }
    };
  });

  const order = playing
    ? [battle.actor, ...battle.queue.filter(u => u.hp > 0)]
    : speedOrder(units);

  $("order").innerHTML = order.map((u,i) =>
    '<span class="turn ' + (u.side ? "red" : "") + '">' +
    (i + 1) + '. ' + u.name + ' · ' + u.spd + '</span>'
  ).join("");

  renderCommand(units);
  $("logs").innerHTML = battle
    ? battle.logs.slice(-100).reverse().map(text => "<div>" + text + "</div>").join("")
    : "<div>双方阵容已就绪。可直接开始，也可以先配置阵容。</div>";

  paintPortraits();
}

function renderCommand(units) {
  const el = $("command");
  el.hidden = !battle;
  if (!battle) return;

  if (battle.finished) {
    const result = battle.winner === null ? "平局" : sideNames[battle.winner] + "胜利";
    el.innerHTML = "<h2>" + result + "</h2><p>共进行 " + battle.round + " 回合。</p>";
    return;
  }

  const u = battle.actor;
  const computer = aiTurn();
  el.innerHTML = "<h2>" + sideNames[u.side] + "行动 · " + u.name + "</h2>" +
    '<p class="muted">' + (computer ? "电脑正在行动…" :
      "当前目标：" + (units[targetKey]?.name ?? "无") + "。点击战场角色卡可以更换目标。") +
    "</p>";

  if (computer) return;
  const choices = [
    ["basic","普攻 · 0 火",false],
    ["ult",u.skill + " · 2 火",battle.energy[u.side] < 2]
  ];
  if (battle.mode === "cpu") {
    choices.push(["assist","埼玉援助 " + battle.charge + "/6",battle.charge < 6]);
  }

  el.innerHTML += '<div class="actions">' + choices.map(([id,label,disabled]) =>
    '<button data-action="' + id + '" class="' + (id === action ? "active" : "") + '"' +
    (disabled ? " disabled" : "") + ">" + label + "</button>"
  ).join("") + '<button id="execute" class="primary">执行</button></div>';

  el.querySelectorAll("[data-action]").forEach(button => {
    button.onclick = () => {
      action = button.dataset.action;
      render();
    };
  });
  $("execute").onclick = () => {
    if (battle.act(action, targetKey)) afterMove();
  };
}

function afterMove() {
  clearTimeout(aiTimer);
  action = "basic";
  targetKey = null;
  render();
  if (aiTurn()) {
    aiTimer = setTimeout(() => {
      if (!aiTurn()) return;
      const kind = battle.energy[1] >= 2 ? "ult" : "basic";
      const candidates = battle.targets(kind).sort((a,b) => a.hp - b.hp);
      battle.act(kind, candidates[0].key);
      afterMove();
    }, 650);
  }
}

$("start").onclick = () => {
  if (battle && !battle.finished && !confirm("重新开战会结束当前对局，继续吗？")) return;
  clearTimeout(aiTimer);
  battle = new Battle(config);
  afterMove();
};

/* ────────── 四、双方阵容配置 ────────── */

function openSetup(side = 0, slot = 0) {
  if (battle && !battle.finished) {
    if (!confirm("结束当前对局并进入阵容配置？")) return;
  }
  clearTimeout(aiTimer);
  battle = null;
  render();
  draft = JSON.parse(JSON.stringify(config));
  editSide = side;
  editSlot = slot;
  editFilter = "全部";
  renderSetup();
}

function renderSetup() {
  const team = draft.teams[editSide];
  const chosenCore = draft.cores[editSide];
  const core = cores[chosenCore];
  const eligible = team.filter(id => cores[id]);
  const types = ["全部","格斗","武器","科技","超能"];

  const tabs = sideNames.map((s,i) =>
    '<button data-side="' + i + '" class="' + (i === editSide ? "active" : "") +
    '">' + s + "阵容</button>"
  ).join("");

  const slots = team.map((id,i) =>
    '<button data-slot="' + i + '" class="' + (i === editSlot ? "active" : "") + '">' +
    "<small>" + (i < 3 ? "前排 " : "后排 ") + (i % 3 + 1) + "</small>" +
    heroes[id].name + "</button>"
  ).join("");

  const filters = types.map(type =>
    '<button data-type="' + type + '" class="' + (type === editFilter ? "active" : "") +
    '">' + type + "</button>"
  ).join("");

  const library = heroes.filter(h => editFilter === "全部" || h.type === editFilter)
    .map(h => '<button data-pick="' + h.id + '">' + h.name + "<small>" +
      h.type + " · " + (team.includes(h.id) ? "已上阵" : "SPD " + h.spd) +
      "</small></button>").join("");

  const coreOptions = eligible.map(id =>
    '<option value="' + id + '"' + (id === chosenCore ? " selected" : "") +
    ">" + heroes[id].name + "</option>"
  ).join("");

  const coreInfo = core
    ? core.name + " · " + (activeCore(draft, editSide) !== null ? "已激活" : "未激活") +
      "。需要" + core.need.join("、") + "系。" + core.text
    : "可指定拥有核心的角色：童帝、深海王、僵尸男。";

  showDialog("阵容配置",
    '<div class="tabs">' + tabs + '</div>' +
    '<p>先点一个站位，再点角色。选择同队已上阵的角色会交换两人的位置。</p>' +
    '<div class="slots">' + slots + '</div>' +
    '<div class="tabs">' + filters + '</div><div class="library">' + library + '</div>' +
    '<div class="actions"><label>指定核心 <select id="coreSelect">' +
    '<option value="">无核心</option>' + coreOptions + '</select></label>' +
    '<label>模式 <select id="modeSelect"><option value="local">同机双人</option>' +
    '<option value="cpu"' + (draft.mode === "cpu" ? " selected" : "") +
    '>人机对战</option></select></label></div>' +
    '<p class="muted">' + coreInfo + '</p>' +
    '<div class="actions"><button id="saveConfig" class="primary">保存双方阵容</button></div>'
  );

  const body = $("modalBody");
  body.querySelectorAll("[data-side]").forEach(b => b.onclick = () => {
    editSide = Number(b.dataset.side);
    editSlot = 0;
    renderSetup();
  });
  body.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => {
    editSlot = Number(b.dataset.slot);
    renderSetup();
  });
  body.querySelectorAll("[data-type]").forEach(b => b.onclick = () => {
    editFilter = b.dataset.type;
    renderSetup();
  });
  body.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => {
    const id = Number(b.dataset.pick);
    const oldIndex = team.indexOf(id);
    if (oldIndex >= 0) team[oldIndex] = team[editSlot];
    team[editSlot] = id;
    if (!team.includes(draft.cores[editSide])) draft.cores[editSide] = null;
    renderSetup();
  });

  $("coreSelect").onchange = e => {
    draft.cores[editSide] = e.target.value === "" ? null : Number(e.target.value);
    renderSetup();
  };
  $("modeSelect").onchange = e => { draft.mode = e.target.value; };
  $("saveConfig").onclick = () => {
    config = draft;
    try { localStorage.setItem("opm-html-v1", JSON.stringify(config)); } catch {}
    $("modal").close();
    render();
  };
}

$("setup").onclick = () => openSetup();

/* ────────── 五、图鉴与规则 ────────── */

function showHero(id) {
  const h = heroes[id];
  const c = cores[id];
  const effect = h.effect === "坚韧"
    ? "为己方全队增加 120 点护盾，上限 400。"
    : "附加" + h.effect + "，持续至目标完成两次行动。";

  showDialog(h.name,
    '<div class="details"><p>' + h.type + '系 · 生命 ' + h.hp +
    ' · 攻击 ' + h.atk + ' · 速度 ' + h.spd + '</p>' +
    '<h3>绝技 · ' + h.skill + '</h3><p>消耗 2 火，范围为' + h.range +
    '，伤害倍率为攻击力的 ' + multipliers[h.range] + ' 倍。' + effect + '</p>' +
    '<h3>被动 · ' + h.passive + '</h3><p>' + passives[h.passive] + '</p>' +
    (c ? '<h3>核心 · ' + c.name + '</h3><p>需要' + c.need.join("、") +
      '系同时上阵。' + c.text + '</p>' : '') +
    '</div><div class="actions"><button id="backGuide">查看全部角色</button></div>'
  );
  $("backGuide").onclick = openGuide;
}

function openGuide() {
  showDialog("角色图鉴 · 24 人", '<div class="library">' + heroes.map(h =>
    '<button data-info="' + h.id + '">' + h.name + '<small>' +
    h.type + ' · SPD ' + h.spd + '</small></button>'
  ).join("") + '</div>');
  $("modalBody").querySelectorAll("[data-info]").forEach(b => {
    b.onclick = () => showHero(Number(b.dataset.info));
  });
}

$("guide").onclick = openGuide;
$("rules").onclick = () => {
  const items = [
    "双方各上阵六人，前排三个位置，后排三个位置。",
    "每回合按速度从高到低行动。同速时我方优先，同队按站位排序。",
    "每队初始 3 火，之后每回合回复 3 火，上限 10 火。普攻免费，绝技消耗 2 火。",
    "普攻优先攻击前排。切后排绝技优先攻击后排。整列绝技命中同一列的前后两人，全体绝技命中所有存活敌人。",
    "在阵容配置中指定核心。满足系别条件后，童帝、深海王或僵尸男的核心生效。",
    "崩坏使直接伤害提高 30%。受伤使目标每次受击时额外承受攻击者攻击力 25% 的伤害。",
    "灼烧在目标行动前造成其最大生命 6% 的伤害。酸蚀在任意角色行动后造成其最大生命 1.2% 的伤害。",
    "同名减益会刷新持续时间。护盾优先抵扣伤害，反伤和吸血按实际生命损失计算。",
    "人机模式中，我方每行动六次可召唤一次埼玉，直接击退一个敌人。援助不占用当前角色的行动。"
  ];

  const list = document.createElement("ol");
  list.className = "details";

  for (const text of items) {
    const item = document.createElement("li");
    item.textContent = text;
    list.appendChild(item);
  }

  showDialog("战斗规则", list.outerHTML);
};

render();
</script>
</body>
</html>
