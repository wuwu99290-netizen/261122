<!doctype html>
<html lang="zh-CN" data-source-bundle>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15161a">
<title>一拳超人 · Z市对战场</title>
<style>
:root {
  color-scheme:dark;
  --bg:#0e0f13;
  --panel:#17191f;
  --line:#30323b;
  --pale:#a7a9b4;
  --orange:#ff832a;
  --blue:#54bdff;
  --red:#ff6166;
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
  color:#f5f5f8;
  background:var(--bg)
}
* {
  box-sizing:border-box
}
body {
  margin:0
}
button,select,input {
  font:inherit
}
button {
  color:inherit;
  cursor:pointer
}
button:disabled {
  cursor:default;
  opacity:.42
}
button:focus-visible,select:focus-visible,input:focus-visible {
  outline:3px solid #ffb365;
  outline-offset:3px
}
button {
  background:none;
  border:0
}
button:hover:enabled {
  filter:brightness(1.17)
}
[hidden] {
  display:none!important
}
i[data-icon] {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:none
}
svg {
  width:1.2em;
  height:1.2em;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  fill:none
}
header {
  height:72px;
  border-bottom:1px solid #2a2c33;
  background:#131418
}
.top,main {
  max-width:1536px;
  width:92%;
  margin:auto
}
.top {
  height:100%;
  display:flex;
  align-items:center
}
.brand {
  display:flex;
  align-items:center;
  gap:11px;
  font-style:italic;
  font-weight:1000;
  font-size:25px;
  letter-spacing:-1.8px;
  line-height:1
}
.brand i {
  width:40px;
  height:40px;
  color:#171514;
  background:var(--orange);
  transform:skew(-8deg);
  border-radius:5px
}
.brand svg {
  width:29px;
  height:29px;
  stroke-width:2.3
}
.brand small {
  font-size:11px;
  color:#e4e4e6;
  letter-spacing:5px;
  display:block;
  margin:5px 0 0 3px
}
.top nav {
  align-self:stretch;
  display:flex;
  margin-left:64px;
  gap:25px
}
.top nav button,.rule {
  display:flex;
  align-items:center;
  gap:9px;
  color:#acadb6;
  font-size:14px;
  font-weight:650
}
.top nav button {
  border-bottom:3px solid transparent;
  padding:3px 6px 0
}
.top nav .on {
  border-color:var(--orange);
  color:var(--orange)
}
.rule {
  margin-left:auto
}
.heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:32px 0 24px;
  gap:15px
}
.kicker,.arenaTitle span,.panelTitle small,.teamLabel small,.versus span {
  font:700 11px/1.2 "Arial Narrow",Arial,sans-serif;
  letter-spacing:2px
}
.kicker {
  display:flex;
  align-items:center;
  gap:9px;
  color:var(--orange);
  font-size:11px
}
.kicker b {
  width:22px;
  height:3px;
  transform:skew(-25deg);
  background:var(--orange)
}
h1 {
  font-size:clamp(31px,3vw,44px);
  letter-spacing:-2px;
  margin:4px 0 5px;
  font-weight:900
}
p {
  margin:0;
  color:var(--pale);
  font-size:14px;
  line-height:1.65
}
.buttons,.toolbar {
  display:flex;
  align-items:center;
  gap:10px
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 19px;
  border:1px solid #42444f;
  border-radius:5px;
  background:#202127;
  color:#edeef3;
  font-weight:700;
  font-size:14px
}
.primary {
  background:var(--orange);
  border-color:var(--orange);
  color:#1b1510
}
.arena,.panel {
  border:1px solid var(--line);
  border-radius:9px;
  overflow:hidden;
  background:var(--panel)
}
.arenaHead,.arenaFoot,.panelTitle {
  display:flex;
  align-items:center
}
.arenaHead {
  padding:0 21px;
  justify-content:space-between;
  height:49px;
  border-bottom:1px solid #33343b;
  background:#1b1c23
}
.arenaTitle,.panelTitle {
  display:flex;
  gap:10px;
  align-items:center;
  font-weight:800
}
.arenaTitle i,.panelTitle>i {
  color:var(--orange);
  font-size:18px
}
.arenaTitle span,.panelTitle small {
  color:#838591;
  font-size:10px;
  letter-spacing:1.8px
}
.state {
  font-size:12px;
  border:1px solid #655036;
  border-radius:4px;
  color:#ffc67c;
  background:#32291f;
  padding:3px 9px
}
.state:before {
  content:"";
  display:inline-block;
  width:6px;
  height:6px;
  background:#ffab54;
  border-radius:100%;
  margin-right:6px
}
.scene {
  position:relative;
  isolation:isolate;
  display:grid;
  grid-template-columns:1fr 11% 1fr;
  padding:24px clamp(20px,3vw,50px) 22px;
  background:linear-gradient(90deg,#1020358c,#18191b23 52%,#38202583),linear-gradient(0deg,#17171fd9,transparent 65%),var(--field-art, none) center 50%/cover
}
.team {
  min-width:0;
  --accent:var(--blue)
}
.red {
  --accent:var(--red)
}
.teamLabel {
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:14px;
  color:white;
  text-shadow:0 1px 6px #000
}
.teamLabel>i {
  background:#152d40c4;
  color:var(--accent);
  width:34px;
  height:34px;
  border:1px solid var(--accent);
  border-radius:4px;
  font-size:19px
}
.red .teamLabel>i {
  background:#3e2025cc
}
.teamLabel b {
  display:block;
  font-size:18px;
  font-style:italic;
  line-height:1.25
}
.teamLabel small {
  color:var(--accent);
  font-size:9px;
  letter-spacing:1.7px
}
.energy {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:4px;
  color:#ffbf4f;
  font:bold 14px Arial;
  border:1px solid #ffffff38;
  padding:4px 7px;
  border-radius:4px;
  background:#17181cc9
}
.energy i {
  font-size:12px
}
.energy em {
  color:#c2bcc0;
  font-size:11px;
  font-style:normal
}
.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:11px
}
.unit {
  position:relative;
  display:block;
  text-align:left;
  isolation:isolate;
  border:1px solid color-mix(in srgb,var(--accent) 82%,#666);
  border-radius:5px;
  overflow:hidden;
  height:clamp(105px,9vw,148px);
  background:#292832;
  padding:0;
  box-shadow:0 3px 8px #0006
}
.unit:after {
  position:absolute;
  content:"";
  inset:0;
  z-index:-1;
  background:linear-gradient(0deg,#080b13f5 0%,#0a0c15b0 20%,transparent 65%)
}
.unit img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 35%;
  z-index:-2
}
.position {
  position:absolute;
  top:0;
  left:0;
  padding:3px 6px;
  background:#132639de;
  border-radius:0 0 4px 0;
  font-size:10px;
  font-weight:700;
  color:#b8e1ff
}
.red .position {
  background:#3b1c24dd;
  color:#ffc9c9
}
.coreTag {
  position:absolute;
  right:4px;
  top:4px;
  font-size:12px;
  background:#3c2918e0;
  border-radius:3px;
  color:#ffd259;
  padding:1px 4px
}
.cardBottom {
  position:absolute;
  left:8px;
  right:8px;
  bottom:7px
}
.nameLine {
  font-weight:850;
  font-size:clamp(13px,1.15vw,17px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-shadow:0 1px 3px #000;
  gap:2px
}
.nameLine i {
  font-size:12px;
  color:#ddd
}
.hp {
  height:4px;
  background:#30363b;
  margin-top:5px;
  border-radius:2px;
  overflow:hidden
}
.hp b {
  background:#71df8a;
  height:100%;
  display:block
}
.versus {
  align-self:center;
  display:flex;
  align-items:center;
  flex-direction:column;
  gap:5px
}
.versus strong {
  font:italic 1000 clamp(38px,5vw,80px)/1 Arial;
  color:#ff9a36;
  letter-spacing:-6px;
  transform:skew(-8deg) rotate(-6deg);
  text-shadow:2px 3px 0 #70331d,4px 5px 0 #31231f;
  filter:drop-shadow(0 2px 10px #ff9c4b75)
}
.versus span {
  background:#17171ddc;
  padding:4px 9px;
  color:white;
  font-size:10px;
  letter-spacing:1.4px
}
.arenaFoot {
  height:33px;
  padding:0 17px;
  justify-content:space-between;
  color:#a7a7b2;
  background:#1a1b21;
  font-size:12px
}
.arenaFoot span {
  display:flex;
  align-items:center;
  gap:6px
}
.panel {
  margin-top:16px;
  padding:16px 20px
}
.panelTitle h2 {
  font-size:17px;
  margin:0
}
.note,.right {
  margin-left:auto;
  font-size:12px;
  color:#a6a8b4;
  font-weight:400
}
.panelTitle {
  margin-bottom:13px
}
#order {
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:thin
}
.turn {
  border:1px solid #393b45;
  border-radius:4px;
  background:#202229;
  position:relative;
  flex:1;
  min-width:58px;
  text-align:left;
  padding:5px 5px 6px;
  display:flex;
  align-items:center;
  gap:6px
}
.turn img {
  border-radius:3px;
  width:clamp(25px,2.6vw,40px);
  height:clamp(27px,2.8vw,42px);
  object-fit:cover;
  border-bottom:3px solid var(--accent)
}
.turn b {
  font:italic bold 15px Arial;
  color:#dbdce4
}
.turn small {
  display:block;
  font:10px Arial;
  color:#aeb0bc;
  margin-top:4px
}
.turn:first-child {
  border-color:#9b6433;
  background:#34291f
}
.dead {
  filter:grayscale(1);
  opacity:.4
}
.acting {
  outline:2px solid #ffad46;
  outline-offset:1px
}
.legal {
  box-shadow:0 0 0 2px #ffcd74
}
.selectedTarget {
  outline:3px solid #fff
}
.statuses {
  font-size:10px;
  color:#ffd489;
  text-shadow:0 1px 2px black
}
.commandBody {
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap
}
.commandBody img {
  width:44px;
  height:44px;
  border-radius:5px
}
.commandBody .toolbar {
  margin-left:auto;
  flex-wrap:wrap
}
.commandBody strong {
  font-size:16px
}
.commandBody p {
  font-size:13px
}
.logline {
  padding:7px 0;
  color:#d2d2da;
  font-size:14px;
  border-top:1px solid #2b2c33
}
.logline time {
  color:#989ba7;
  font:12px monospace;
  margin-right:12px
}
main {
  padding-bottom:32px
}
.panel:last-child {
  margin-bottom:10px
}
dialog {
  background:#1b1d24;
  color:white;
  border:1px solid #444753;
  border-radius:10px;
  padding:24px;
  width:min(880px,94vw);
  max-height:88vh;
  box-shadow:0 20px 100px #0009
}
dialog::backdrop {
  background:#06070ac7;
  backdrop-filter:blur(4px)
}
.modalhead {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px
}
.modalhead h2 {
  margin:0;
  font-size:22px
}
.close {
  font-size:24px;
  color:#b5b5c1
}
.tabs,.filterbar {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0
}
.tabs button,.filterbar button {
  border-radius:4px;
  padding:7px 13px;
  color:#b7b8c2;
  border:1px solid #383a44;
  background:#24262e;
  font-size:14px
}
.tabs .chosen,.filterbar .chosen,.btn.chosen {
  color:#ffae65;
  background:#422e20;
  border-color:#cd7f3e
}
.slots {
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
  margin:12px 0
}
.slot,.pick {
  border:1px solid #383b46;
  background:#282a32;
  overflow:hidden;
  border-radius:5px;
  padding:0 0 6px;
  text-align:center;
  font-size:13px
}
.slot img,.pick img {
  width:100%;
  display:block;
  aspect-ratio:1.55;
  object-fit:cover
}
.slot small,.pick small {
  color:#abb0bd;
  display:block
}
.slot.selected {
  border:2px solid #ff963e
}
.pick.active {
  border-color:#537d9d
}
.pickGrid,#gallery {
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:8px
}
.pickGrid {
  max-height:31vh;
  overflow:auto
}
.pick {
  font-size:12px
}
.pick img {
  aspect-ratio:1.5
}
.setupFoot {
  display:flex;
  gap:14px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:16px
}
.setupFoot label {
  font-size:13px;
  color:#d4d3db
}
.setupFoot select {
  color:white;
  background:#292b33;
  border:1px solid #454751;
  padding:6px;
  border-radius:4px
}
.setupFoot .primary {
  margin-left:auto
}
.help {
  font-size:13px;
  margin:8px 0
}
.coreInfo {
  font-size:13px;
  margin-top:8px;
  color:#ffc178
}
#gallery {
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:15px
}
#gallery .pick {
  font-size:16px
}
#gallery img {
  aspect-ratio:1.15
}
.info {
  display:flex;
  gap:20px
}
.info img {
  width:min(38%,215px);
  object-fit:cover;
  border-radius:6px
}
.info h3 {
  color:#ffad61;
  margin:10px 0 4px
}
.rulelist {
  line-height:1.75;
  color:#d5d5df
}
.rulelist b {
  color:#ffad67
}
#filters {
  margin-bottom:20px
}
@media(min-width:1600px) {
  .scene {
    padding-inline:65px
  }
  .unit {
    height:160px
  }
}
@media(max-width:1000px) {
  .scene {
    grid-template-columns:1fr 8% 1fr;
    padding:18px
  }
  .grid {
    gap:7px
  }
  .top nav {
    margin-left:32px
  }
  .turn {
    min-width:65px
  }
  .versus strong {
    font-size:42px
  }
  .versus span {
    font-size:8px;
    padding:4px
  }
  .buttons .btn {
    padding:10px 12px
  }
  .panelTitle small {
    font-size:9px
  }
  .pickGrid {
    grid-template-columns:repeat(6,1fr)
  }
}
@media(max-width:700px) {
  .top,main {
    width:94%
  }
  header {
    height:59px
  }
  .brand {
    font-size:19px;
    gap:6px
  }
  .brand small {
    font-size:9px
  }
  .brand i {
    width:29px;
    height:32px
  }
  .brand svg {
    width:23px
  }
  .top nav {
    margin-left:auto;
    gap:4px
  }
  .top nav button {
    font-size:12px;
    gap:4px
  }
  .rule {
    margin-left:10px
  }
  .rule span {
    display:none
  }
  .heading {
    align-items:flex-start;
    flex-direction:column;
    padding:21px 0 16px;
    gap:12px
  }
  .heading p {
    font-size:13px
  }
  .buttons {
    width:100%
  }
  .buttons .btn {
    flex:1
  }
  .arenaHead {
    height:42px;
    padding:0 12px
  }
  .arenaTitle span {
    font-size:9px
  }
  .scene {
    grid-template-columns:1fr 1fr;
    gap:14px;
    padding:12px 8px 14px
  }
  .versus {
    position:absolute;
    top:48%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:2;
    pointer-events:none
  }
  .versus strong {
    font-size:23px;
    letter-spacing:-2px
  }
  .versus span {
    display:none
  }
  .grid {
    gap:5px;
    grid-template-columns:repeat(3,minmax(0,1fr))
  }
  .teamLabel {
    gap:4px;
    margin-bottom:9px
  }
  .teamLabel>i {
    width:24px;
    height:26px;
    font-size:13px
  }
  .teamLabel b {
    font-size:14px
  }
  .teamLabel small {
    font-size:8px;
    letter-spacing:.5px
  }
  .energy {
    font-size:11px;
    gap:1px;
    padding:3px
  }
  .energy em {
    font-size:9px
  }
  .unit {
    height:clamp(76px,17vw,104px)
  }
  .cardBottom {
    left:3px;
    right:3px;
    bottom:4px
  }
  .nameLine {
    font-size:11px;
    line-height:1.2
  }
  .nameLine i {
    display:none
  }
  .position {
    font-size:8px;
    padding:2px
  }
  .coreTag {
    font-size:9px;
    right:1px;
    top:1px
  }
  .panel {
    padding:12px
  }
  .arenaFoot {
    font-size:10px
  }
  .panelTitle {
    gap:7px
  }
  .pickGrid {
    grid-template-columns:repeat(4,1fr)
  }
  .slots {
    gap:3px
  }
  .slot {
    font-size:10px
  }
  .slot small {
    font-size:9px
  }
  .setupFoot {
    gap:8px
  }
  .info {
    gap:10px;
    align-items:flex-start
  }
  .info img {
    width:30%
  }
  .info p {
    font-size:13px
  }
  .tabs button,.filterbar button {
    padding:6px 9px
  }
  .commandBody .toolbar {
    margin-left:0
  }
  .commandBody .btn {
    padding:8px
  }
  .rulelist {
    padding-left:18px
  }
  dialog {
    padding:16px
  }
}
/* Battle theatre and its command dock */
:root {
  --orange:#ffac39;
  --bg:#101114;
  --panel:#1a1c21;
}
body {
  background:radial-gradient(ellipse at 78% 0%,#27262a50,transparent 48%),var(--bg);
}
header {
  height:62px;
}
.top,main {
  width:min(94%,1440px);
}
.sourceButton {
  font-size:14px;
  margin-left:18px;
  border:1px solid #454750;
  border-radius:4px;
  padding:5px 9px;
}
.heading {
  padding:18px 0 14px;
}
h1 {
  font-size:clamp(30px,3.2vw,46px);
  line-height:1.2;
}
.arenaHead {
  height:40px;
}
.arenaTools {
  display:flex;
  align-items:center;
  gap:8px;
}
.arenaTools button {
  border:1px solid #41434b;
  padding:3px 9px;
  border-radius:4px;
  font-size:12px;
}
.arenaTools [aria-pressed=true] {
  color:#ffd18a;
  border-color:#9e743a;
}
.warzone {
  height:clamp(420px,49vh,590px);
  position:relative;
  isolation:isolate;
  overflow:hidden;
  background:linear-gradient(0deg,#15182388,transparent 60%),var(--field-art, none) center 55%/cover;
}
.warzone:before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,#13314a45,transparent 46%,#62281e33);
  pointer-events:none;
}
.teamheads {
  display:flex;
  justify-content:space-between;
  padding:12px 16px 0;
  position:relative;
  z-index:2;
  pointer-events:none;
}
.squad {
  display:flex;
  align-items:center;
  gap:9px;
  min-width:186px;
  padding:6px 11px;
  border-left:4px solid #5bc9ff;
  background:linear-gradient(90deg,#131f2cf5,#131f2ccd);
  box-shadow:0 3px 8px #1114;
}
.squad.enemy {
  border-left:0;
  border-right:4px solid #ff7272;
  background:linear-gradient(270deg,#2e1c23f5,#2e1c23cc);
  flex-direction:row-reverse;
  text-align:right;
}
.squad .teamIcon {
  font-size:24px;
  color:#78cfff;
}
.squad.enemy .teamIcon {
  color:#ff8787;
}
.squad b {
  font-size:16px;
}
.squad small {
  display:block;

}

<script>
// Six slots per side. Units keep the same key throughout a match, including revival.
class Battle {
  constructor(teams,cores,mode,partners=[[],[]],random=Math.random) {
    this.mode=mode; this.random=random; this.round=0; this.actions=0;
    this.energy=[3,3]; this.sealed=[0,0]; this.sealRound=[0,0];
    this.charge=0; this.finished=false; this.actor=null; this.queue=[];
    this.logs=[]; this.feedback=[]; this.deaths=[]; this.lifeCoreUses=[0,0];
    this.activeCore=cores.map((id,s)=>coreReady(teams[s],id)?id:null);
    this.units=teams.flatMap((team,side)=>team.map((id,slot)=>{
      const h=cardStats(id,partners[side]);
      return {...h,side,slot,key:side*6+slot,max:h.hp,baseSpd:h.spd,shield:0,
        status:{},effects:{},count:{},revives:0,pending:false,usedLife:false,damageDealt:0};
    }));
    this.silverTeam=teams.map(t=>t.includes(2));
    this.next();
  }
  log(message,side=null){this.logs.push({round:this.round,message,side});}
  alive(side){return this.units.filter(u=>u.side===side && u.hp>0);}
  member(side,id){return this.alive(side).find(u=>u.id===id);}
  lowest(pool){return pool.slice().sort((a,b)=>a.hp/a.max-b.hp/b.max||a.slot-b.slot)[0];}
  adjacent(a,b){return a.side===b.side && Math.abs(a.slot%3-b.slot%3)+Math.abs(Math.floor(a.slot/3)-Math.floor(b.slot/3))===1;}
  sameRow(a,b){return Math.floor(a.slot/3)===Math.floor(b.slot/3);}
  order(a,b){return b.spd-a.spd||a.side-b.side||a.slot-b.slot;}
  usable(s){return Math.max(0,this.energy[s]-this.sealed[s]);}
  addEnergy(s,n){this.energy[s]=Math.min(10,this.energy[s]+n);}
  power(u){return u.atk*(u.status['强攻']?1.2:1);}
  use(u,name,limit){
    if((u.count[name]||0)>=limit)return false;
    u.count[name]=(u.count[name]||0)+1;
    return true;
  }
  apply(u,name,turns,power=0) {
    if(!u.hp)return;
    u.status[name]=turns;
    u.effects[name]={power};
    if(name==='灼烧'&&this.member(1-u.side,0)&&this.activeCore[1-u.side]===0&&!this.coreUses[1-u.side].rage){
      this.coreUses[1-u.side].rage=true;this.addEnergy(1-u.side,1);
    }
    if(name==='加速')u.spd=Math.round(u.baseSpd*1.2);
    if(name==='暴走'&&this.activeCore[u.side]===0&&!this.coreUses[u.side].rage){
      this.coreUses[u.side].rage=true;this.addEnergy(u.side,1);
    }
    if(name==='受伤'||name==='内伤')this.zombieEnergy(1-u.side,'伤');
  }
  remove(u,name){
    delete u.status[name];delete u.effects[name];
    if(name==='灼烧'&&this.member(1-u.side,0)&&this.activeCore[1-u.side]===0&&!this.coreUses[1-u.side].rage){
      this.coreUses[1-u.side].rage=true;this.addEnergy(1-u.side,1);
    }
    if(name==='加速')u.spd=u.baseSpd;
  }
  zombieEnergy(side,tag){
    if(this.activeCore[side]===12&&!this.coreUses[side][tag]){
      this.coreUses[side][tag]=true;this.addEnergy(side,2);
      this.log(SIDE[side]+'再生之力 · '+tag+'，能量 +2',side);
    }
  }
  shield(u,n){
    if(!u.hp)return;
    u.shield=Math.max(u.shield,Math.round(n));
    this.zombieEnergy(u.side,'盾');
  }
  heal(u,n,share=true){
    if(!u?.hp)return 0;
    const amount=Math.min(u.max-u.hp,Math.max(0,Math.round(n)));
    if(!amount)return 0;
    u.hp+=amount;
    this.feedback.push({key:u.key,lost:0,absorbed:0,heal:amount,reason:'治疗'});
    if(this.member(u.side,19))this.apply(u,'强攻',1);
    const boros=this.member(u.side,10);
    if(share&&boros&&boros!==u&&boros.hp<boros.max&&this.use(boros,'铠甲',6))this.heal(boros,amount*.5,false);
    return amount;
  }
  hurt(u,amount,reason='攻击'){
    if(!u.hp)return 0;
    const n=Math.max(0,Math.round(amount)), absorbed=Math.min(u.shield,n);
    u.shield-=absorbed;
    const lost=Math.min(u.hp,n-absorbed);
    u.hp-=lost;
    if(lost||absorbed)this.feedback.push({key:u.key,lost,absorbed,reason});
    if(!u.hp){
      if(!u.usedLife&&(u.id===23||u.id===6)){
        u.usedLife=true;u.hp=Math.max(1,Math.round(u.max*(u.id===6?.3:.05)));
        this.log(u.name+'触发'+u.passive+'，回复至 '+u.hp+' 生命',u.side);
      }else{
        u.status={};u.effects={};u.spd=u.baseSpd;
        if(u.id===12){u.pending=u.revives<4;this.deaths.push(u);}
        this.log(u.name+(u.pending?'倒地等待再生':'退场'),u.side);
      }
    }
    return lost;
  }
  resolveDeaths(){
    while(this.deaths.length){
      const zombie=this.deaths.shift();
      for(const v of this.alive(1-zombie.side))this.hurt(v,zombie.atk*.6,'再生冲击');
    }
  }
  finish(winner,message){
    this.finished=true;this.actor=null;this.winner=winner;
    this.log(message);
  }
  check(){
    const a=this.alive(0).length,b=this.alive(1).length;
    if(a&&b)return false;
    const winner=a?0:b?1:null;
    this.finish(winner,winner===null?'双方同时退场，平局':SIDE[winner]+'取得胜利');
    return true;
  }
  startRound(){
    ++this.round;
    this.coreUses=[{},{}];
    this.units.forEach(u=>u.count={});
    for(const s of [0,1]){
      if(this.round>1)this.addEnergy(s,3);
      if(this.activeCore[s]===0)this.addEnergy(s,1);
      if(this.round>this.sealRound[s])this.sealed[s]=0;
      if(this.alive(s).some(v=>v.shield))this.zombieEnergy(s,'盾');
      if(this.alive(1-s).some(v=>v.status['受伤']||v.status['内伤']))this.zombieEnergy(s,'伤');
    }
    this.queue=this.units.filter(u=>u.hp||u.pending).sort(this.order);
    this.log('第 '+this.round+' 回合开始');
  }
  dot(u,label){
    const lost=this.hurt(u,u.effects[label].power,label);
    this.log(u.name+' · '+label+' −'+lost,u.side);
    if(lost&&this.member(1-u.side,18)){
      for(const v of this.alive(u.side))this.hurt(v,lost*.5,'地球使徒');
    }
    this.resolveDeaths();
  }
  expire(u){
    for(const [name,old] of Object.entries(this.startEffects)){
      if(u.effects[name]===old&&Number.isFinite(u.status[name])&&--u.status[name]<=0)this.remove(u,name);
    }
  }
  next(){
    while(!this.finished){
      if(!this.queue.length){
        if(this.round===50){this.finish(null,'达到 50 回合上限，平局');return;}
        this.startRound();
      }
      this.queue.sort(this.order);
      const u=this.queue.shift();
      if(u.pending&&this.alive(u.side).length){
        u.pending=false;u.revives++;u.hp=Math.max(1,Math.round(u.max*.1));
        this.log(u.name+'第 '+u.revives+' 次再生',u.side);
      }
      if(!u.hp)continue;
      this.actor=u;this.startEffects={...u.effects};
      if(u.status['灼烧']){
        this.dot(u,'灼烧');
        if(this.check())return;
        if(!u.hp)continue;
      }
      if(u.status['眩晕']){
        this.log(u.name+'眩晕，跳过行动',u.side);this.expire(u);continue;
      }
      return;
    }
  }
  targets(ult=false){
    const u=this.actor;if(!u)return [];
    const skill=ult?u.ultimate:u.basic;
    if(skill.range===ally)return this.alive(u.side);
    const enemies=this.alive(1-u.side),front=enemies.filter(v=>v.slot<3),back=enemies.filter(v=>v.slot>=3);
    if(skill.range===rear)return back.length?back:front;
    if(skill.range===single)return front.length?front:back;
    return enemies;
  }
  affected(ult,key){
    const options=this.targets(ult),t=options.find(v=>v.key===key);
    if(!t)return [];
    const range=ult?this.actor.range:this.actor.basic.range;
    if(range===all)return options;
    if(range===column)return options.filter(v=>v.slot%3===t.slot%3);
    if(range===row)return options.filter(v=>this.sameRow(v,t));
    if(range==='十字')return options.filter(v=>v===t||this.adjacent(v,t));
    return [t];
  }
  sample(list,count) {
    const result=[],pool=list.slice();
    while(pool.length&&result.length<count)result.push(pool.splice(Math.floor(this.random()*pool.length),1)[0]);
    return result;
  }
  strike(u,v,skill,segments,rate,attack){
    // Split total coefficients across hits. Round the accumulated total once per
    // segment so a five-hit 100% move cannot silently turn into a 500% move.
    const blockRate=.1+(this.silverTeam[v.side]&&this.round<=2?.3:0);
    const critRate=.1+(u.id===1&&skill===u.ultimate?.2:0);
    const critBonus=u.id===1?.3*Math.min(3,this.alive(v.side).filter(e=>e.status['受伤']).length):0;
    const rage=u.status['暴走']||(u.id===0&&this.alive(v.side).some(e=>e.status['灼烧']));
    const reduction=v.id===16?(1-v.hp/v.max)*.5:0;
    const modifier=(rage?1.3:1)*(1-(u.effects['虚弱']?.power||0))*(v.status['崩坏']?1.3:1)*
      (v.status['减伤']?.8:1)*(1-reduction);
    const base=attack*rate/100*(skill.perHit?1:1/segments)*modifier;
    const record={lost:0,lastLost:0,crits:0,lastCrit:false,blocked:false};
    let cumulative=0;
    for(let i=0;i<segments&&v.hp;i++){
      const crit=!skill.fixed&&this.random()<critRate, block=!skill.fixed&&this.random()<blockRate;
      const amount=skill.fixed??(base*(crit?1.5+critBonus:1)*(block?.7:1));
      const before=Math.round(cumulative);
      cumulative+=amount;
      record.lastLost=this.hurt(v,Math.round(cumulative)-before,'直接');
      record.lost+=record.lastLost;
      record.crits+=Number(crit);record.lastCrit=crit;record.blocked||=block;
    }
    u.damageDealt+=record.lost;
    if(record.blocked){
      if(this.silverTeam[v.side]&&this.use(v,'格挡盾',3))this.shield(v,v.max*.07);
      if(this.activeCore[v.side]===8&&(this.coreUses[v.side].block||0)<4){
        this.coreUses[v.side].block=(this.coreUses[v.side].block||0)+1;
        this.addEnergy(v.side,1);
      }
    }
    return record;
  }
  damageExtras(u,v,attack,ult,energy,record){
    if(v.status['受伤'])this.hurt(v,v.effects['受伤'].power,'受伤');
    if(v.status['内伤']){const n=v.effects['内伤'].power;this.remove(v,'内伤');this.hurt(v,n,'内伤');}
    if(u.id===5)this.hurt(v,attack*Math.min(1.2,.2+.2*energy),'地上最强');
    if(u.id===14||(u.id===9&&!ult))this.hurt(v,u.max*.08,'体魄');
    if(u.id===18&&!ult)this.hurt(v,u.max*.05,'巨大化');
    if(u.id===22&&v.status['灼烧'])this.hurt(v,attack,'谋而后动');
    if(u.id===8&&ult)this.hurt(v,(u.max-u.hp)*.5,'深海连打');
    if(u.id===11&&ult)this.heal(u,record.lastLost);
  }
  onTarget(u,v,ult,t,r,attack){
    const inflict=(name,rate,turns=2)=>this.apply(v,name,turns,Math.round(attack*rate));
    switch(u.id){
      case 0: if(ult&&v===t)inflict('灼烧',.5);break;
      case 1:
        if(!ult&&r.crits)this.apply(v,'虚弱',1,.1);
        if(ult&&(v===t||this.adjacent(v,t))&&this.random()<.5)inflict('受伤',.6);
        break;
      case 2: if(ult)inflict('内伤',1.4,Infinity);break;
      case 3: if(ult&&this.random()<.5)this.apply(v,'崩坏',2);break;
      case 4:
        if(ult&&v===t&&this.random()<.5)this.apply(v,'眩晕',1);
        if(ult&&r.crits)this.apply(v,'崩坏',2);
        break;
      case 5: case 7: if(!ult)this.apply(v,'崩坏',2);break;
      case 6: if(!ult)inflict('内伤',1,Infinity);break;
      case 8: if(!ult)inflict('酸蚀',.08);break;
      case 9: if(ult&&r.lastCrit)inflict('受伤',.5);break;
      case 12: if(!ult)inflict('受伤',1);break;
      case 15: if(!v.hero)inflict('受伤',.5);break;
      case 16: if(ult&&this.random()<.5)inflict('受伤',.5);break;
      case 17: if(ult)this.apply(v,'虚弱',2,.4);break;
      case 21: if(ult&&v===t)this.apply(v,'崩坏',2);break;
      case 22:
        if(!ult)inflict('灼烧',.4);
        else if(v.status['灼烧'])this.apply(v,'眩晕',1);
        break;
    }
  }
  afterSkill(u,t,ult,hit,records,attack){
    const own=this.alive(u.side),enemy=this.alive(1-u.side);
    switch(u.id){
      case 2: case 10: if(!ult)this.apply(u,'暴走',1);break;
      case 4: own.filter(v=>v!==u&&this.sameRow(u,v)).forEach(v=>this.apply(v,'暴走',1));break;
      case 5:
        if(ult){
          this.sealed[1-u.side]=2;this.sealRound[1-u.side]=this.round;
          own.forEach(v=>this.heal(v,attack*.5));
          this.log('王之恫吓 · 对方本回合封锁 2 火',u.side);
        }else this.heal(u,attack*.8);
        break;
      case 6: if(ult)this.sample(hit.filter(v=>v.hp),3).forEach(v=>this.apply(v,'内伤',Infinity,Math.round(attack*1.3)));break;
      case 7:
        if(ult&&(records[0].crits||this.random()<.5))own.filter(v=>v===u||this.adjacent(u,v)).forEach(v=>this.apply(v,'加速',1));
        enemy.filter(v=>v.status['崩坏']).forEach(v=>this.hurt(v,attack*.75,'极限速度'));break;
      case 9: if(ult)this.heal(u,u.max*.2);break;
      case 11: this.heal(this.lowest(own),attack);break;
      case 12: if(ult)own.forEach(v=>this.heal(v,attack));break;
      case 13:
        if(ult&&u.status['暴走'])this.heal(u,u.max*.2);
        if(own.length)this.shield(this.lowest(own),u.max*.2);
        break;
      case 14:
        if(ult)own.filter(v=>this.sameRow(u,v)).forEach(v=>this.shield(v,u.max*.2));
        else this.apply(u,'减伤',1);
        break;
      case 16:
        if(ult)this.shield(u,u.max*.1);
        else if(this.use(u,'全垒打',3))this.heal(u,u.max*.1);
        break;
      case 17:
        enemy.filter(v=>this.adjacent(v,t)).forEach(v=>this.hurt(v,attack*.4*(1+Math.min(2,records[0].crits)),'天使溅射'));break;
      case 20:
        if(ult)this.sample(hit.filter(v=>v.hp),2).forEach(v=>this.apply(v,'崩坏',2));
        const count=enemy.filter(v=>v.hp&&v.status['崩坏']).length;
        hit.forEach(v=>this.hurt(v,attack*.1*count,'先发制人'));break;
      case 21:
        let kills=hit.filter(v=>!v.hp).length;
        for(let i=0;i<2&&kills>0;i++){
          const next=this.lowest(this.alive(1-u.side));if(!next)break;
          this.hurt(next,attack,'收割');if(next.hp)kills--;
        }
        break;
    }
  }
  retaliate(u,t,incoming){
    if(t.id===9 && incoming){
      for(const other of this.alive(1-t.side))this.hurt(other,incoming*.2,'反伤');
    }
    if(t.id===8&&t.hp>0&&t.hp<t.max*.5&&this.use(t,'深海',3))this.shield(t,t.max*.1);
    if(t.id===16&&t.hp>0&&t.hp<t.max*.8&&u.hp&&this.use(t,'反击',3))this.follow(t,u,'反击');
  }
  follow(u,v,reason){
    if(!u.hp||!v.hp)return;
    const power=this.power(u),r=this.strike(u,v,u.basic,u.basic.hits,u.basic.percent*.8,power);
    this.damageExtras(u,v,power,false,this.usable(u.side),r);
    this.onTarget(u,v,false,v,r,power);
    if(u.id===16&&this.use(u,'全垒打',3))this.heal(u,u.max*.1);
    if(v.id===9)for(const target of this.alive(u.side))this.hurt(target,r.lost*.2,'反伤');
    this.log(u.name+reason+' → '+v.name,u.side);
    this.resolveDeaths();
  }
  afterAction(u,hit,offensive){
    if(offensive&&u.type==='武器'){
      const atomic=this.member(u.side,3),victim=hit.filter(v=>v.hp).sort((a,b)=>a.hp-b.hp)[0];
      if(atomic&&atomic!==u&&victim&&this.use(atomic,'追击',3))this.follow(atomic,victim,'追击');
    }
    const garou=this.member(1-u.side,6);
    if(u.hp&&garou&&(u.hero||this.random()<.4)&&this.use(garou,'追击',3))this.follow(garou,u,'追击');
    for(const v of this.units)if(v.hp&&v.status['酸蚀'])this.dot(v,'酸蚀');
    this.expire(u);
    if(u.side===0&&this.mode==='cpu')this.charge=Math.min(6,this.charge+1);
  }
  act(ult,key,assist=false){
    if(this.finished||!this.actor)return false;
    const u=this.actor,skill=ult?u.ultimate:u.basic,fire=this.usable(u.side);
    const options=assist?this.alive(1):this.targets(ult),t=options.find(v=>v.key===key);
    if(!t||(!assist&&fire<costOf(u,ult)))return false;
    if(assist){
      if(this.mode!=='cpu'||u.side!==0||this.charge<6)return false;
      this.feedback=[{key:t.key,lost:t.hp,absorbed:t.shield,reason:'援助'}];
      this.lastHits=1;this.charge=0;t.hp=0;t.shield=0;t.pending=false;t.status={};t.effects={};
      this.log('埼玉援助 · 一拳击退'+t.name,0);this.check();return true;
    }
    this.actions++;this.feedback=[];this.energy[u.side]-=costOf(u,ult);
    const hit=this.affected(ult,key),attack=this.power(u);
    const segments=Array.isArray(skill.hits)?2+Math.floor(this.random()*4):skill.hits;
    this.lastHits=segments;
    let detail='';
    if(skill.range===ally){
      if(skill.healing){const amount=this.heal(t,attack*skill.percent/100);detail=' · 治疗 +'+amount;}
      else this.apply(t,'暴走',1);
      this.apply(t,'加速',1);
    }else{
      let rate=skill.percent;
      if(u.id===10&&ult)rate+=105*Math.min(3,this.alive(u.side).filter(v=>v.type==='超能').length);
      // Resolve direct damage simultaneously before new debuffs influence the same cast.
      const records=hit.map(v=>this.strike(u,v,skill,segments,rate,attack));
      hit.forEach((v,i)=>{
        const r=records[i];
        this.damageExtras(u,v,attack,ult,fire,r);
        this.onTarget(u,v,ult,t,r,attack);
      });
      const crits=records.reduce((n,r)=>n+r.crits,0);
      if(crits&&this.activeCore[u.side]===4&&this.lifeCoreUses[u.side]<4){
        this.lifeCoreUses[u.side]++;this.addEnergy(u.side,2);this.log('天才之力 · 暴击回能 +2',u.side);
      }
      this.afterSkill(u,t,ult,hit,records,attack);
      hit.forEach((v,i)=>this.retaliate(u,v,records[i].lost));
      detail=' · '+segments+' 段，直接伤害 '+records.reduce((n,r)=>n+r.lost,0)+(crits?'，暴击 '+crits+' 段':'');
    }
    this.log(u.name+' · '+skill.name+' → '+hit.map(v=>v.name).join('、')+detail,u.side);
    this.resolveDeaths();this.afterAction(u,hit,skill.range!==ally);
    if(!this.check())this.next();
    return true;
  }
}

</script>
<script>
// Draw in field coordinates, so a column beam, a heal and a back-row strike
// always meet the same fighters as the targeting preview.
const FX_COLORS = {
  punch:'#ffb35c',incinerate:'#ff781f',esper:'#65f2b3',meteor:'#64ffbc',
  tide:'#48caff',slash:'#ffcf80',atomic:'#ffe7b0',machine:'#69cfff',
  dread:'#ffbd58',claw:'#e87463',dash:'#bf9eff',acid:'#a7ef59',
  crater:'#ffb45a',plasma:'#eb85f4',blood:'#f36587',shot:'#ffd85d',
  cyclone:'#49dfaf',execution:'#ff8cba',bat:'#77bcfa',angel:'#f5caf0',
  orb:'#c58cff',heal:'#65f4ba',volley:'#ffe57c',pierce:'#6ae8e5',
  spark:'#ffed66',rally:'#9bdbff',assist:'#ff582c'
};
let frameId=null;
function stopMotion(){
  if(frameId!==null){cancelAnimationFrame(frameId);frameId=null;}
}
function castEffect(layer,actor,victims,fx,hits,duration,feedback){
  stopMotion();
  const canvas=document.createElement('canvas');
  if(!canvas.getContext)return;
  canvas.className='moveCanvas';layer.appendChild(canvas);
  const g=canvas.getContext('2d');if(!g)return;
  const bounds=layer.getBoundingClientRect(),field=$('fighters').getBoundingClientRect();
  if(!bounds.width||!bounds.height)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(bounds.width*dpr);canvas.height=Math.round(bounds.height*dpr);
  g.scale(dpr,dpr);
  const w=bounds.width,h=bounds.height,r=Math.max(12,Math.min(33,w*.034,field.height*.09));
  function point(u){
    const p=position(u);
    return {x:field.left-bounds.left+field.width*p.x/100,
      y:field.top-bounds.top+field.height*(p.y-15-p.lane*1.25)/100};
  }
  const sprite=document.querySelector('[data-unit="'+actor.key+'"] img');
  const from=point(actor),marks=victims.map(point),color=FX_COLORS[fx];
  const extras=new Map();
  for(const event of feedback){
    if(event.reason==='治疗'||event.reason==='反伤'||event.reason==='灼烧'||event.reason==='酸蚀'){
      extras.set(event.key+'-'+event.reason,{at:point(game.units[event.key]),reason:event.reason});
    }
  }
  const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
  const clamp=t=>Math.max(0,Math.min(1,t));
  function stroke(x1,y1,x2,y2,width,ink){
    g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineWidth=width;g.strokeStyle=ink;g.stroke();
  }
  function ring(x,y,size,ink,width,squash=1){
    g.beginPath();g.ellipse(x,y,Math.max(.1,size),Math.max(.1,size*squash),0,0,Math.PI*2);
    g.lineWidth=width;g.strokeStyle=ink;g.stroke();
  }
  function disc(x,y,size,ink){
    g.fillStyle=ink;g.beginPath();g.arc(x,y,Math.max(.1,size),0,Math.PI*2);g.fill();
  }
  function star(x,y,size,angle,ink){
    g.beginPath();
    for(let i=0;i<16;i++){
      const a=angle+i*Math.PI/8, rad=size*(i%2?.23:1);
      if(!i)g.moveTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
      else g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);
    }
    g.closePath();g.fillStyle=ink;g.fill();
  }
  function bolt(a,b,phase){
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    let x=a.x,y=a.y;
    for(let i=1;i<=8;i++){
      const wobble=i===8?0:Math.sin(i*8+phase)*r*.38;
      const nx=a.x+dx*i/8-dy/len*wobble,ny=a.y+dy*i/8+dx/len*wobble;
      stroke(x,y,nx,ny,3,color);x=nx;y=ny;
    }
  }
  function drawMark(p,i,t){
    const start=.13+Math.min(.09,i*.018), travel=clamp((t-start)/.29);
    if(!travel)return;
    const contact=clamp((t-start-.2)/.54);
    const wave=Math.sin(contact*Math.PI);
    const phase=contact*Math.max(1,hits)*Math.PI*2;
    const x=from.x+(p.x-from.x)*travel, y=from.y+(p.y-from.y)*travel;
    const sign=actor.side?-1:1;
    g.save();g.globalAlpha=clamp((1-t)/.17);
    g.lineCap='round';g.lineJoin='round';
    switch(fx){
      case 'incinerate': case 'pierce': case 'assist':
        if(t<.77){
          const thickness=r*(fx==='pierce'?.19:fx==='assist'?.58:.35)*(1+.18*Math.sin(phase));
          stroke(from.x,from.y,x,y,thickness*2.1,color+'65');
          stroke(from.x,from.y,x,y,thickness,color);stroke(from.x,from.y,x,y,thickness*.35,'#fff6c5');
        }
        if(contact){ring(p.x,p.y,r*contact*2.1,color,2);star(p.x,p.y,r*wave,phase*.14,'#ffe79b');}
        break;
      case 'atomic': case 'slash': case 'claw': case 'dash': case 'execution': case 'bat':
        if(fx==='dash'&&t<.56){
          if(sprite?.complete&&sprite.naturalWidth){
            const sh=r*2.8,sw=sh*sprite.naturalWidth/sprite.naturalHeight;
            for(let j=1;j<=3;j++){
              const pos=Math.max(0,travel-.13*j);
              g.save();g.globalAlpha=.40/j;g.translate(from.x+(p.x-from.x)*pos,from.y+(p.y-from.y)*pos);
              g.scale(sign,1);g.drawImage(sprite,-sw/2,-sh*.52,sw,sh);g.restore();
            }
          }
          for(let k=0;k<3;k++)stroke(x-sign*r*(2+k*.48),y+k*4,x,y+k*4,3-k*.7,color);
        }
        for(let k=0;k<hits+(fx==='claw'?2:0);k++){
          const v=clamp((t-.19-k*.095)/.24);
          if(v<=0||v>=1)continue;
          const ang=(k%2?-.78:.7)+(i%3)*.09;
          const len=r*(fx==='atomic'?1.7:1.29),dx=Math.cos(ang)*len,dy=Math.sin(ang)*len;
          const ex=p.x-dx+2*dx*Math.min(1,v*2),ey=p.y-dy+2*dy*Math.min(1,v*2);
          stroke(p.x-dx,p.y-dy,ex,ey,(1-v)*8+1,color);stroke(p.x-dx,p.y-dy,ex,ey,1.5,'#fffef1');
        }
        break;
      case 'meteor':
        for(let k=0;k<3;k++){
          const v=clamp((t-start-k*.12)/.31);if(!v)continue;
          const mx=p.x+sign*(1-v)*r*(2+k*.4),my=p.y-(1-v)*r*3.8;
          if(v<1){
            stroke(mx+sign*r*.8,my-r*1.6,mx,my,r*.32,color);
            star(mx,my,r*.45,k+v*2,'#646a70');disc(mx-2,my+2,r*.1,'#c1ffdc');
          }else ring(p.x,p.y,r*(.38+.65*contact),color,1.7,.52);
        }
        break;
      case 'cyclone': case 'esper': case 'tide':
        for(let k=0;k<3;k++){
          const v=(travel+k/3)%1, ax=travel<1?from.x+(p.x-from.x)*v:p.x,ay=travel<1?from.y+(p.y-from.y)*v:p.y;
          g.save();g.translate(ax,ay+(k-1)*r*.26);g.rotate(-sign*.22);
          g.beginPath();g.ellipse(0,0,r*(.32+wave*.83),r*(.12+wave*.35),0,k*2+t*11,k*2+t*11+4.6);
          g.strokeStyle=k%2?color:'#d9fff9';g.lineWidth=2.4;g.stroke();g.restore();
        }
        break;
      case 'heal': case 'rally':
        for(let k=0;k<4;k++){
          const v=(t+k/4)%1,px=p.x+(k-1.5)*r*.48,py=p.y+r*(.7-1.8*v);
          if(fx==='heal'){stroke(px-4,py,px+4,py,2.7,color);stroke(px,py-4,px,py+4,2.7,color);}
          else {stroke(px-5,py+5,px,py,2.1,color);stroke(px,py,px+5,py+5,2.1,color);}
        }
        ring(p.x,p.y+r*.6,r*(.6+wave),color,2,.33);break;
      case 'dread':
        for(let k=0;k<3;k++){
          const v=clamp((t-k*.12)/.63);if(v<=0||v>=1)continue;
          g.globalAlpha=(1-v)*.8;ring(from.x,from.y,Math.max(r,Math.hypot(p.x-from.x,p.y-from.y))*v,color,2.3,.84);
        }
        break;
      case 'spark':
        if(t<.65)bolt(from,{x,y},t*15);
        star(x,y,r*(.35+wave),t*3,color);break;
      case 'acid': case 'blood': case 'orb': case 'plasma': case 'shot': case 'volley':
        for(let k=0;k<Math.min(5,hits+1);k++){
          const v=clamp((t-start-k*.055)/.32);if(!v||v===1)continue;
          const arc=(fx==='blood'||fx==='acid'||fx==='orb')?Math.sin(v*Math.PI)*r*(1+k*.4):0;
          const px=from.x+(p.x-from.x)*v,py=from.y+(p.y-from.y)*v-arc;
          stroke(px-sign*r*.55,py+2,px,py,r*.12,color);
          disc(px,py,r*(fx==='orb'||fx==='plasma'?.28:.14),color);disc(px,py,r*.07,'#fff7e6');
        }
        if(contact)ring(p.x,p.y,r*contact,color,2.5);break;
      default:
        if(contact){
          const px=p.x+Math.sin(phase)*r*.23,py=p.y+Math.cos(phase)*r*.16;
          star(px,py,r*(.48+wave*.83),phase*.17,color);star(px,py,r*(.23+wave*.55),phase*.17,'#fff5cb');
          if(fx==='crater')ring(px,py+r*.65,r*(.6+contact*1.6),'#e2a86a',3,.32);
          if(fx==='angel'){ring(px,py-r,r*.62,'#ffefb3',2,.27);}
        }
    }
    g.restore();
  }
  let since;
  function render(now){
    since??=now;
    const t=clamp((now-since)/duration);
    g.clearRect(0,0,w,h);
    if(!reduced){
      if(t<.26){g.globalAlpha=1-t/.26;ring(from.x,from.y,r*(.15+3*t),color,2.5);g.globalAlpha=1;}
      marks.forEach((mark,i)=>drawMark(mark,i,t));
      if(t>.57)for(const {at,reason} of extras.values()){
        const n=clamp((t-.57)/.42),ink=({治疗:'#6effbb',反伤:'#f297ff',灼烧:'#ff942a',酸蚀:'#a3f668'})[reason];
        g.globalAlpha=1-n;ring(at.x,at.y,r*(.3+n),ink,2);g.globalAlpha=1;
      }
    }else if(t<.67)marks.forEach(p=>ring(p.x,p.y,r*.7,color,2));
    if(t<1)frameId=requestAnimationFrame(render);else frameId=null;
  }
  frameId=requestAnimationFrame(render);
}

</script>
<script>
const $=id=>document.getElementById(id);
const paths={
 fist:'M4 11V7q1-2 3 0V4q2-2 3 0v2-3q2-2 3 0v3-2q2-2 3 0v5-3q2-2 3 0v7l-3 4v4H8v-4l-5-5q-1-3 1-3l4 3',
 swords:'M3 3l4 1 12 13-2 2L4 7z M15 15l5 5 M15 19l4-4 M21 3l-4 1-4 5 M9 13l-5 5 2 2 5-5 M4 15l5 5',
 cards:'M7 4h13v15H7z M4 7H2v15h14v-1 M11 9h5 M11 13h4',
 book:'M3 4q5-1 9 2 4-3 9-2v15q-5-1-9 2-4-3-9-2z M12 6v15',
 radar:'M3 9V4h5 M16 4h5v5 M21 15v5h-5 M8 20H3v-5 M7 12l3-3 3 5 3-4 2 2',
 bolt:'M14 2 5 14h6l-1 8 9-13h-6z', shield:'M12 2l8 4v6q-1 6-8 10-7-4-8-10V6z M8 10l4 4 4-4',
 skull:'M5 14q-5-12 7-12 12 0 8 12l-3 2v4H7v-4z M8 9l2 2 M16 9l-2 2 M10 17v3 M14 17v3',
 settings:'M3 6h8m4 0h6 M3 12h2m4 0h12 M3 18h10m4 0h4 M11 3v6 M6 9v6 M14 15v6',
 play:'M7 4l13 8-13 8z',speed:'M2 6h12 M4 11h7 M1 16h6 M16 5l5 6-9 8 M12 11h9',
 log:'M4 5h16 M4 11h16 M4 17h10',pin:'M12 22q-9-9-8-14a8 8 0 0 1 16 0q1 5-8 14z M10 8a2 2 0 1 0 4 0 2 2 0 1 0-4 0',
 tech:'M6 6h12v12H6z M9 2v4 M15 2v4 M9 18v4 M15 18v4 M2 9h4 M18 9h4 M2 15h4 M18 15h4',
 crown:'M3 6l5 4 4-7 4 7 5-4-3 12H6z', command:'M3 5h18v14H3z M7 9l3 3-3 3 M13 15h4',user:'M12 3a4 4 0 1 0 0.1 0 M4 21q0-12 8-12t8 12'
};
const icon=n=>'<i data-icon="'+n+'" aria-hidden="true"></i>';
function paintIcons(){document.querySelectorAll('i[data-icon]:empty').forEach(el=>{
 el.innerHTML='<svg viewBox="0 0 24 24"><path d="'+paths[el.dataset.icon]+'"/></svg>';
});}
const typeIcon={科技:'tech',格斗:'fist',超能:'bolt',武器:'swords'};
let embedded = null;
let originalHTML = null;
function asset(kind, id) {
  const path = 'assets/' + kind + '-' + String(id).padStart(2,'0') + '.webp';
  return embedded ? embedded[path] : path;
}
const photo = id => asset('hero',id);
const img=id=>'<img src="'+photo(id)+'" alt="">';
const button=(id,label,symbol,primary=false)=>'<button class="btn '+(primary?'primary':'')+'" id="'+id+'">'+(symbol?icon(symbol):'')+label+'</button>';
let teams=DEFAULT_TEAMS.map(x=>x.slice()),cores=[4,8],mode='local',partners=[[],[]];
try{
 const pref=JSON.parse(localStorage.getItem('opm-arena-v1'));
 if(pref?.teams?.length===2&&pref.teams.every(t=>t.length===6&&new Set(t).size===6&&t.every(id=>Number.isInteger(id)&&HEROES[id]))){
 partners=[0,1].map(side=>EXTRA_PARTNERS.filter(name=>Array.isArray(pref.partners?.[side])&&pref.partners[side].includes(name)));
 teams=pref.teams;cores=teams.map((t,s)=>t.includes(pref.cores?.[s])&&CORES[pref.cores[s]]?pref.cores[s]:null);mode=pref.mode==='cpu'?'cpu':'local';
 }
}catch{}
let game=null,filter='全部',edit=null,expanded=false,choice='basic',target=null,cpuTimer=null;
const sideColor=s=>s?'#ff7374':'#5ac0ff';
function preview(){
  return teams.flatMap((team,side)=>team.map((id,slot)=>{
    const stats=cardStats(id,partners[side]);
    return {...stats,side,slot,key:side*6+slot,max:stats.hp,status:{}};
  }));
}

let automatic = false;
let speed = 1;
let sound = false;
let busy = false;
let effectTimer = null;
let impactTimer = null;
let casting = null;
let audio = null;

function tone(ultimate) {
  if (!sound) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    audio ||= new Audio();
    audio.resume().catch(() => {});
    const oscillator = audio.createOscillator();
    const gain = audio.createGain();
    const t = audio.currentTime;
    oscillator.type = ultimate ? 'sawtooth' : 'triangle';
    oscillator.frequency.setValueAtTime(ultimate ? 260 : 160,t);
    oscillator.frequency.exponentialRampToValueAtTime(45,t + .16);
    gain.gain.setValueAtTime(.07,t);
    gain.gain.exponentialRampToValueAtTime(.001,t + .18);
    oscillator.connect(gain);
    gain.connect(audio.destination);
    oscillator.start(t);
    oscillator.stop(t + .19);
  } catch { /* Audio may be unavailable on a muted or restricted device. */ }
}

function coreFor(side) {
  const id = cores[side];
  const team = teams[side];
  return coreReady(team,id) ? id : null;
}

function energy(side) {
  return game ? game.usable(side) : 3 + (coreFor(side) === 0 ? 1 : 0);
}

function computerControls() {
  return game && !game.finished && (automatic || (mode === 'cpu' && game.actor.side === 1));
}

function legal() {
  if (!game || game.finished) return [];
  return choice === 'assist' ? game.alive(1) : game.targets(choice === 'ult');
}

function affected() {
  return choice === 'assist' ? legal().filter(u => u.key === target) : game.affected(choice === 'ult',target);
}

function position(u) {
  const lane = u.slot % 3;
  const x = (u.slot < 3 ? 37 : 17) - lane * 1.8;
  return { x: u.side ? 100-x : x, y: 32 + lane*32.5, lane };
}

function drawFighter(u, playing, affectedKeys) {
  const pos = position(u);
  const css = ['fighter'];
  if (u.side) css.push('red');
  if (!u.hp) css.push('out');
  if ((busy && casting?.actor.key === u.key) || (playing && !busy && u.key === game.actor.key)) css.push('focused');
  if (affectedKeys.includes(u.key)) css.push('splash');
  if (affectedKeys.includes(u.key) && u.key === target) css.push('locked');
  const states = Object.entries(u.status).map(([name,turns]) => name + (Number.isFinite(turns) ? turns : ''));
  if (u.pending) states.push('待再生');
  if (u.shield) states.push('盾 ' + u.shield);
  const health = Math.round(u.hp / u.max * 100);
  const slot = (u.slot < 3 ? '前排' : '后排') + (pos.lane + 1);
  const title = SIDE[u.side] + ' · ' + u.name + ' · ' + slot + ' · 生命 ' + u.hp + '/' + u.max + (states.length?' · '+states.join('、'):'');
  return '<button data-unit="' + u.key + '" class="' + css.join(' ') + '" title="' + title +
    '" aria-label="' + title + '" style="left:' + pos.x + '%;top:' + pos.y +
    '%;z-index:' + (pos.lane+1) + ';--unit-h:' + (30+pos.lane*2.5) + '%">' +
    '<img draggable="false" src="' + asset('fighter',u.id) + '" alt="">' +
    '<span class="effect">' + states.join(' ') + '</span><span class="plate"><b>' + u.name +
    '</b><span class="hp" style="display:block"><b style="width:' + health + '%"></b></span></span></button>';
}

function renderTeam(side,units) {
  const id = coreFor(side);
  const core = id === null ? '未激活核心' : CORES[id].name;
  const label = units.filter(u => u.side === side && u.hp).length + '/6';
  $('team' + side).innerHTML = '<div class="squad ' + (side ? 'enemy' : '') +
    '"><div class="teamIcon">' + icon(side ? 'skull' : 'shield') + '</div><div><b>' +
    SIDE[side] + '小队</b><small>' + label + ' 在场 · ' + core +
    '</small></div><span class="fire" title="全队共享能量">ϟ ' + energy(side) + (game?.sealed[side]?' <small>封 '+game.sealed[side]+'</small>':'') + '</span></div>';
}

function renderCommand(units) {
  const panel = $('command');
  if (!game) {
    panel.innerHTML = '<div class="commandGrid"><div class="commandHero">' + img(teams[0][0]) +
      '<div><b>战前布阵</b><small>点击战场角色调整站位，或直接开始对战。</small></div></div>' +
      '<div class="tabs"><button data-mode="local">同机双人</button><button data-mode="cpu">人机对战</button></div></div>';
    panel.querySelectorAll('[data-mode]').forEach(b => {
      b.classList.toggle('chosen',mode === b.dataset.mode);
      b.onclick = () => { mode = b.dataset.mode; persist(); display(); };
    });
    return;
  }
  if(busy&&casting){
    panel.innerHTML='<div class="commandGrid"><div class="commandHero">'+img(casting.actor.id)+
      '<div><b>'+SIDE[casting.actor.side]+' · '+casting.actor.name+' · '+casting.name+'</b><small>'+
      casting.targets.map(v=>v.name).join('、')+'</small></div></div><span class="skillStat">'+casting.caption+'</span></div>';
    return;
  }
  if (game.finished) {
    const title = game.winner === null ? '双方战平' : SIDE[game.winner] + '胜利';
    panel.innerHTML = '<div class="commandGrid"><div><b>' + title + '</b><p>第 ' +
      game.round + ' 回合结束 · 已执行 ' + game.actions + ' 次行动</p></div>' +
      button('report','查看战报','log') + '</div>';
    $('report').onclick = showReport;
    return;
  }
  const u = game.actor;
  const manual = !computerControls() && !busy;
  const n = affected().length;
  const range = choice === 'ult' ? u.range : '单体';
  const note = busy ? '正在结算行动…' : computerControls() ? '自动行动中' :
    '锁定 ' + (units[target]?.name || '') + ' · ' + range + '命中 ' + n + ' 人';
  const options = [
    ['basic',u.basic.name,'普攻 · '+(u.basic.fixed?'固定 '+u.basic.fixed:u.basic.percent+'%')+' · 0 火',false],
    ['ult',u.skill,u.range + ' · ' + costOf(u,true) + ' 火',energy(u.side)<costOf(u,true)]
  ];
  if (mode === 'cpu' && u.side === 0) options.push(['assist','埼玉一拳','援助 ' + game.charge + '/6',game.charge<6]);
  panel.innerHTML = '<div class="commandGrid"><div class="commandHero">' + img(u.id) +
    '<div><b>' + SIDE[u.side] + ' · ' + u.name + '</b><small>' + note +
    '</small></div></div><div class="toolbar">' + options.map(([kind,name,hint,disabled]) =>
      '<button class="skill ' + (choice === kind ? 'chosen' : '') + '" data-choice="' + kind +
      '" ' + (!manual || disabled ? 'disabled' : '') + '><strong>' + name + '</strong><small>' +
      hint + '</small></button>').join('') + '<button class="btn primary" id="attack" ' +
      (manual ? '' : 'disabled') + '>出手</button></div></div>';
  panel.querySelectorAll('[data-choice]').forEach(b => {
    b.onclick = () => { choice=b.dataset.choice; display(); };
  });
  $('attack').onclick = () => { if (!computerControls()) playMove(choice,target); };
}

function showReport() {
  const rows = [0,1].map(side => '<div><h3>' + SIDE[side] + ' · 累计直接伤害</h3>' +
    game.units.filter(u => u.side === side).sort((a,b) => b.damageDealt-a.damageDealt).map(u =>
    '<div class="resultRow">' + img(u.id) + '<span>' + u.name + '</span><b>' +
    u.damageDealt.toLocaleString() + '</b></div>').join('') + '</div>').join('');
  modal('对战结算','<p>' + game.round + ' 回合 · ' + game.actions +
    ' 次行动。数值按实际扣除的生命统计。</p><div class="resultList">' + rows + '</div>');
}

function display() {
  const units = game ? game.units : preview();
  const playing = game && !game.finished;
  if (playing && !legal().some(u => u.key === target)) target = legal()[0]?.key;
  const hitKeys = playing && !computerControls() && !busy ? affected().map(u => u.key) : [];
  $('topActions').innerHTML = button('setup','阵容配置','settings') +
    button('start',playing ? '重新开战' : game ? '再来一场' : '开始战斗','play',true);
  $('setup').onclick = () => playing ? confirmAction('结束本局并调整阵容？','双方阵容设置会保留。',() => {
    reset();openSetup();
  }) : openSetup();
  $('start').onclick = () => playing ? confirmAction('重新开始本局？','双方生命和能量将按当前阵容重新计算。',start) : start();
  $('clash').hidden = !!game;
  $('state').textContent = playing ? '第 ' + game.round + ' 回合 · ' + SIDE[game.actor.side] + '行动' : game ? '战斗结束' : '备战中';
  $('modeLabel').textContent = (mode === 'cpu' ? '人机对战' : '同机双人') + ' · 6V6';
  $('auto').textContent = automatic ? '自动 开' : '自动 关';
  $('auto').setAttribute('aria-pressed',String(automatic));
  $('sound').textContent = sound ? '音效 开' : '音效 关';
  $('sound').setAttribute('aria-pressed',String(sound));
  $('speed').textContent = speed + '× 速度';
  renderTeam(0,units);renderTeam(1,units);
  const shown=busy&&casting&&!casting.impacted?casting.before:units;
  $('fighters').innerHTML = shown.map(u => drawFighter(u,playing,hitKeys)).join('');
  const order = playing ? [game.actor,...game.queue.filter(u => u.hp||u.pending).slice().sort(game.order)] :
    units.filter(u => u.hp).sort((a,b) => b.spd-a.spd || a.side-b.side || a.slot-b.slot);
  $('order').innerHTML = order.map((u,i) => '<button class="turn" data-side-info="'+u.side+'" data-info="' + u.id +
    '" title="' + SIDE[u.side] + ' · ' + u.name + ' · 速度 ' + u.spd + '" style="--accent:' +
    sideColor(u.side) + '">' + img(u.id) + '<span><b>' + String(i+1).padStart(2,'0') +
    '</b><small>' + u.spd + '</small></span></button>').join('');
  renderCommand(units);
  const logs = game ? game.logs : [{round:0,message:'双方已就位。已按速度排定首回合行动顺序。'}];
  $('logs').innerHTML = logs.slice(expanded ? -200 : -2).reverse().map(l =>
    '<div class="logline"><time>' + (l.round ? 'R' + String(l.round).padStart(2,'0') : '准备') +
    '</time>' + l.message + '</div>').join('');
  $('logToggle').textContent = expanded ? '收起记录' : '展开记录';
  $('logToggle').hidden = logs.length <= 2;
  document.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => {
    const u = units[Number(b.dataset.unit)];
    if (!game) return openSetup(u.side,u.slot);
    if (busy) return;
    if (playing && !computerControls() && legal().some(v => v.key === u.key)) {
      target = u.key;display();
    } else info(u.id,u.side);
  });
  bindInfo();paintIcons();
}

function clearWork() {
  clearTimeout(cpuTimer);
  clearTimeout(effectTimer);
  clearTimeout(impactTimer);
  casting=null;
  stopMotion();
  busy = false;
  $('burst').replaceChildren();
}

function reset() {
  clearWork();game=null;choice='basic';target=null;display();
}

function start() {
  clearWork();
  game = new Battle(teams,cores,mode,partners);
  expanded = false;
  choice = 'basic';
  target = null;
  display();
  scheduleComputer();
}

function scheduleComputer() {
  clearTimeout(cpuTimer);
  if (!computerControls() || busy || $('dialog').open || $('battlePage').hidden || document.hidden) return;
  const match = game, actor = game.actor;
  cpuTimer = setTimeout(() => {
    if (game !== match || actor !== game.actor || !computerControls() || busy) return;
    const assist = mode === 'cpu' && actor.side === 0 && game.charge === 6;
    const ult = game.usable(actor.side) >= costOf(actor,true) &&
      !(actor.id===19 && game.alive(actor.side).every(v=>v.hp===v.max));
    const options = assist ? game.alive(1) : game.targets(ult);
    // Prefer a kill or a column with two living victims, breaking ties by HP.
    function score(v) {
      if (assist) return v.hp;
      if (ult&&actor.range===ally) {
        if(actor.ultimate.healing)return 1-v.hp/v.max;
        return (game.queue.includes(v)?10000:0)+(v.status['暴走']?0:4000)+v.atk;
      }
      const victims = game.affected(ult,v.key);
      return victims.length * 3000 - Math.min(...victims.map(t => t.hp));
    }
    const best = options.slice().sort((a,b) => score(b)-score(a))[0];
    playMove(assist ? 'assist' : ult ? 'ult' : 'basic',best.key);
  }, 630/speed);
}

function playMove(kind,key) {
  if (!game || game.finished || busy || $('dialog').open) return;
  const match = game, actor = game.actor;
  const victims = kind === 'assist' ? [match.units[key]] : match.affected(kind === 'ult',key);
  const before = match.units.map(v=>({...v,status:{...v.status}}));
  if (!match.act(kind === 'ult',key,kind === 'assist')) return;
  const move = kind==='assist'?null:kind==='ult'?actor.ultimate:actor.basic;
  casting={actor,name:move?.name||'普通的一拳',before,targets:victims,impacted:false,
    caption: move?skillLine(move):'埼玉援助'};
  busy = true;
  tone(kind !== 'basic');
  choice = 'basic';target = null;
  display();
  const layer = $('burst');
  const field = $('fighters').getBoundingClientRect();
  const bounds = layer.getBoundingClientRect();
  const fx = move?.fx || 'assist';
  const duration = (kind==='basic'?680:1050)/speed;
  const cut = document.createElement('div');
  cut.className = 'cut';
  cut.style.borderColor = FX_COLORS[fx];
  cut.textContent = kind === 'assist' ? '埼玉 · 普通的一拳！' : actor.name+' · '+move.name;
  if(kind!=='basic'){
    cut.classList.add('ultimateCut');
    const portrait=document.createElement('img');portrait.src=photo(actor.id);portrait.alt='';
    if(kind!=='assist')cut.appendChild(portrait);
  }
  layer.replaceChildren(cut);
  castEffect(layer,actor,victims,fx,match.lastHits,duration,match.feedback);
  const caster = document.querySelector('[data-unit="' + actor.key + '"]');
  const closeAttack=['punch','atomic','slash','tide','dash','claw','execution','bat','angel','crater'].includes(fx);
  if(closeAttack&&victims.length&&actor.side!==victims[0].side){
    const p=position(actor), q=position(victims.find(v=>v.key===key)||victims[0]);
    caster.style.setProperty('--travel-x',((q.x-p.x)*field.width*.0075)+'px');
    caster.style.setProperty('--travel-y',((q.y-p.y)*field.height*.0085)+'px');
    caster.style.setProperty('--motion-time',duration*.73+'ms');
    caster.classList.add('closeAttack');
  }else caster.classList.add('lunge');
  impactTimer=setTimeout(()=>{
    if(game!==match||!casting)return;
    casting.impacted=true;
    for(const u of match.units){
      const node=document.querySelector('[data-unit="'+u.key+'"]');
      const bar=node?.querySelector('.hp b');
      if(bar)bar.style.width=(100*u.hp/u.max)+'%';
      if(!u.hp)node?.classList.add('out');
    }
    victims.forEach(u => {
    if(u.side!==actor.side)document.querySelector('[data-unit="'+u.key+'"]').classList.add('hit');
    });
  },duration*.36);
  const byUnit = new Map();
  for (const event of match.feedback) {
    const summary = byUnit.get(event.key) || {lost:0,absorbed:0,heal:0};
    summary.lost += event.lost;summary.absorbed += event.absorbed;summary.heal += event.heal||0;
    byUnit.set(event.key,summary);
  }
  if(move?.range===ally&&!byUnit.has(key))byUnit.set(key,{lost:0,absorbed:0,heal:0});
  byUnit.forEach((amount,k) => {
    const pos = position(match.units[k]);
    const label = document.createElement('strong');
    label.className = 'flyNum';
    label.style.left = pos.x + '%';
    label.style.top = (field.top-bounds.top + field.height*(pos.y-18)/100) + 'px';
    label.style.animationDuration = duration*.75+'ms';
    label.style.animationDelay = duration*.19+'ms';
    if(!amount.lost)label.style.color = amount.heal?'#87ffc5':'#a8eaff';
    label.textContent = [amount.lost?'−'+amount.lost:'',amount.heal?'+'+amount.heal:'',
      amount.absorbed?'盾 −'+amount.absorbed:''].filter(Boolean).join(' / ')||'加速 ↑';
    layer.appendChild(label);
  });
  effectTimer = setTimeout(() => {
    if (game !== match) return;
    stopMotion();casting=null;busy = false;layer.replaceChildren();display();scheduleComputer();
  },duration);
}

function persist() {
  try { localStorage.setItem('opm-arena-v1',JSON.stringify({teams,cores,mode,partners})); } catch {}
}

function modal(title,body){clearTimeout(cpuTimer);$('dialogBody').innerHTML='<div class="modalhead"><h2>'+title+'</h2><button class="close" aria-label="关闭">×</button></div>'+body;if(!$('dialog').open)$('dialog').showModal();document.querySelector('.close').onclick=()=>$('dialog').close();paintIcons();}
function confirmAction(title,text,fn){modal(title,'<p>'+text+'</p><div class="setupFoot">'+button('confirm','确定',null,true)+'</div>');$('confirm').onclick=()=>{$('dialog').close();fn();};}
function openSetup(side=0,slot=0){edit={teams:teams.map(t=>t.slice()),cores:cores.slice(),partners:partners.map(a=>a.slice()),mode,side,slot,filter:'全部'};setupView();}
function filters(active){return '<div class="filterbar">'+['全部','武器','格斗','科技','超能'].map(f=>'<button data-filter="'+f+'" class="'+(active===f?'chosen':'')+'">'+f+'</button>').join('')+'</div>';}
function picks(f,team=[]){return HEROES.filter(h=>f==='全部'||h.type===f).map(h=>'<button class="pick '+(team.includes(h.id)?'active':'')+'" data-pick="'+h.id+'">'+img(h.id)+h.name+'<small>'+h.type+' · '+(team.includes(h.id)?'已上阵':'SPD '+h.spd)+'</small></button>').join('');}
const formations = [
  {name:'崩坏爆发', team:[2,14,3,4,7,1], core:4},
  {name:'灼烧酸蚀', team:[9,8,16,0,18,10], core:8},
  {name:'坚韧反伤', team:[14,9,12,13,19,3], core:12}
];
function setupView(){
 const e=edit,t=e.teams[e.side],available=t.filter(id=>CORES[id]),core=CORES[e.cores[e.side]];
 modal('阵容配置','<div class="tabs">'+SIDE.map((s,i)=>'<button class="'+(e.side===i?'chosen':'')+'" data-side="'+i+'">'+s+'阵容</button>').join('')+'</div><p class="help">先选站位，再点选角色。同队已上阵的角色会交换位置。</p><div class="slots">'+t.map((id,i)=>'<button class="slot '+(e.slot===i?'selected':'')+'" data-slot="'+i+'">'+img(id)+'<small>'+(i<3?'前排':'后排')+' '+(i%3+1)+'</small>'+HEROES[id].name+'</button>').join('')+'</div>'+collectionView(e)+'<div class="presets"><span>套用阵容</span>'+formations.map((f,i)=>'<button data-preset="'+i+'">'+f.name+'</button>').join('')+'</div>'+filters(e.filter)+'<div class="pickGrid">'+picks(e.filter,t)+'</div><div class="setupFoot"><label>指定核心 <select id="core"><option value="">无核心</option>'+available.map(id=>'<option value="'+id+'" '+(e.cores[e.side]===id?'selected':'')+'>'+HEROES[id].name+'</option>').join('')+'</select></label><label>对战模式 <select id="mode"><option value="local">本地双人</option><option value="cpu" '+(e.mode==='cpu'?'selected':'')+'>人机对战</option></select></label>'+button('save','保存阵容',null,true)+'</div><div class="coreInfo">'+(core?core.name+' · '+(coreReady(t,e.cores[e.side])?'已激活':'未激活')+'｜需要'+core.need.join('、')+'。'+core.text:'上阵杰诺斯、童帝、深海王或僵尸男后可指定核心。')+'</div>');
 $('dialog').querySelectorAll('[data-partner]').forEach(input=>input.onchange=()=>{
   const name=input.dataset.partner, list=e.partners[e.side];
   e.partners[e.side]=input.checked?[...new Set([...list,name])]:list.filter(n=>n!==name);
   setupView(); $('collection').open=true;
 });
 $('dialog').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
   const formation=formations[Number(b.dataset.preset)];
   e.teams[e.side]=formation.team.slice();
   e.cores[e.side]=formation.core;
   setupView();
 });
 document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{e.side=+b.dataset.side;e.slot=0;setupView();});
 document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{e.slot=+b.dataset.slot;setupView();});
 $('dialog').querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{e.filter=b.dataset.filter;setupView();});
 $('dialog').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
 const id=+b.dataset.pick,old=t.indexOf(id);
 if(old>=0)t[old]=t[e.slot];t[e.slot]=id;
 if(!t.includes(e.cores[e.side]))e.cores[e.side]=null;
 setupView();
 });
 $('core').onchange=()=>{e.cores[e.side]=$('core').value===''?null:+$('core').value;setupView();};
 $('mode').onchange=()=>{e.mode=$('mode').value;};
 $('save').onclick=()=>{teams=e.teams;cores=e.cores;mode=e.mode;partners=e.partners;persist();$('dialog').close();reset();};
}
function bondList(id,extra){
 const rows=bondsFor(id,extra);
 if(!rows.length){
   const related=BONDS.filter(b=>b.required.includes(id));
   const list=related.map(b=>b.name+'（'+[...b.attack,...b.life].map(n=>HEROES[n].name).join('、')+'受益）');
   return '<p>该角色自身的加成待核对。'+(list.length?'作为收藏伙伴可参与 '+list.join('、')+'。':'')+'</p>';
 }
 return rows.map(b=>'<div class="bondRow"><b>'+b.name+'</b><strong>'+ (b.stat==='hp'?'生命':'攻击')+
   ' +10%</strong><small>'+b.required.map(i=>typeof i==='number'?HEROES[i].name:i).join(' · ')+'</small><em>'+
   (b.missing.length?'缺少 '+b.missing.join('、'):'已激活')+'</em></div>').join('');
}
function collectionView(e){
 const id=e.teams[e.side][e.slot],extras=e.partners[e.side],h=cardStats(id,extras);
 return '<details id="collection" class="collection"><summary>收藏羁绊 · '+HEROES[id].name+'　'+
   bondsFor(id,extras).filter(b=>!b.missing.length).length+' 项生效</summary><p>双方各自持有全部 24 名可选角色。勾选额外收藏即可模拟对应关联；伙伴在替补席也生效。</p>'+
   '<div class="partnerGrid">'+EXTRA_PARTNERS.map(n=>'<label><input type="checkbox" data-partner="'+n+'" '+
   (extras.includes(n)?'checked':'')+'> '+n+'</label>').join('')+'</div><p>当前站位面板　HP '+h.hp+'　ATK '+h.atk+'</p>'+bondList(id,extras)+'</details>';
}
function info(id,side=0){
 const h=HEROES[id],c=CORES[id],stats=cardStats(id,partners[side]);
 const links=[['官网招式名','https://yqcrsy.0708.com/'],h.wiki?['普通形态图鉴','https://opmts.wiki.gg/wiki/'+h.wiki]:null,SOURCES[id]?['中文技能资料',SOURCES[id]]:null,
   bondsFor(id).length?['角色关联资料',BOND_SOURCES[id]||bondSource]:null].filter(Boolean);
 const section=(title,m)=>'<h3>'+title+' · '+m.name+'</h3><div class="skillStat">'+skillLine(m)+'</div><p>'+m.note+'</p>';
 const note=CARD_NOTES[id]||'倍率采用普通形态资料；角色名称按简中习惯显示。';
 modal(h.name,'<div class="info">'+img(id)+'<div><p>'+h.type+'系 · 普通形态 · 基础 HP '+h.hp+' / ATK '+h.atk+' / SPD '+h.spd+'</p>'+
   section('普攻 · 0 火',h.basic)+section('绝技 · '+costOf(h,true)+' 火',h.ultimate)+'<h3>被动 · '+h.passive+'</h3><p>'+h.passiveText+'</p>'+
   (c?'<h3>初级核心 · '+c.name+'</h3><p>'+c.need.join('、')+'。'+c.text+'</p>':'')+
   '<h3>收藏羁绊 · '+SIDE[side]+'</h3><p>计入关联后 HP '+stats.hp+' / ATK '+stats.atk+'。</p>'+bondList(id,partners[side])+
   '<p class="versionNote">'+note+'</p><p class="sourceLinks">'+links.map(([name,url])=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+name+' ↗</a>').join('　')+'</p></div></div>');
}
function bindInfo(){document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>info(+b.dataset.info,Number(b.dataset.sideInfo)||0));}
function roster(){
 $('filters').innerHTML=filters(filter);$('gallery').innerHTML=picks(filter);
 $('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;roster();});
 $('gallery').querySelectorAll('button').forEach(b=>b.onclick=()=>info(+b.dataset.pick));
}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));
 $('battlePage').hidden=b.dataset.page!=='battle';$('rosterPage').hidden=b.dataset.page!=='roster';if(!$('rosterPage').hidden)roster();scheduleComputer();
});
$('rules').onclick=()=>modal('战斗规则','<ol class="rulelist"><li><b>站位</b>　普通单体优先前排，切后单体优先后排。列贯穿前后两格；排命中同排三格。十字命中目标及上下左右邻位。</li><li><b>速度</b>　按实时速度行动，同速我方优先。加速会重排尚未行动的角色，每人每回合一次主动行动。</li><li><b>能量</b>　每队初始 3 火，后续回合回复 3 火，上限 10。绝技通常消耗 2 火，无证骑士的正义怒吼免费。封锁只影响可用能量。</li><li><b>技能</b>　图鉴列出每招段数和倍率。多段一般合计结算；除恶之拳按每段 100% 单独计。崩坏影响直接伤害，受伤在每次攻击后追伤，内伤触发一次后解除。灼烧在目标行动前结算，酸蚀在每次主动行动后结算。</li><li><b>羁绊与核心</b>　收藏指定伙伴即可增加对应角色的基础属性；同类百分比相加。布阵窗口可为双方单独设置额外收藏。初级核心另外检查上阵系别。</li><li><b>对战</b>　人机模式下，我方每行动六次可在自己回合呼叫埼玉援助。达到 50 回合判平。</li></ol><p class="versionNote">取普通形态、基础绝技，中文服旧攻略和国际服图鉴有差异，采用值见角色详情。未加入装备、技能等级固定加值、抗性养成或高级核心。基础暴击率／格挡率各 10%，暴击 ×1.5，格挡 ×0.7；多段均分、随机段数权重、同名状态覆盖及连锁触发顺序为本模拟约定。动画为原创重绘。</p>');
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close();}});
$('logToggle').onclick=()=>{expanded=!expanded;display();};
$('auto').onclick = () => { automatic = !automatic;display();scheduleComputer(); };
$('speed').onclick = () => { speed = speed === 1 ? 2 : 1;display();scheduleComputer(); };
$('sound').onclick = () => { sound = !sound;tone(false);display(); };
$('dialog').addEventListener('close',scheduleComputer);
document.addEventListener('visibilitychange',scheduleComputer);

function showSource() {
  if (!originalHTML) {
    modal('HTML 源码','<p>单文件版包含图片、界面和战斗逻辑。</p><a href="dist/index.html#source">打开单文件源码</a>');
    return;
  }
  modal('完整 HTML 源码','<p>'+(embedded ? '已内嵌全部图像。保存为 index.html 即可打开。' : '图片位于 assets 文件夹。请将该文件夹与 index.html 一起上传。')+'</p>' +
    '<textarea class="sourceText" id="sourceText" readonly spellcheck="false" aria-label="完整 HTML 源码"></textarea>' +
    '<div class="toolbar">' + button('copySource','复制全部','cards',true) +
    button('saveSource','下载 index.html','book') + '</div><p id="copyStatus" role="status"></p>');
  $('sourceText').value = originalHTML;
  $('copySource').onclick = async () => {
    try {
      await navigator.clipboard.writeText(originalHTML);
      $('copyStatus').textContent = '完整源码已复制。';
    } catch {
      const input = $('sourceText');
      input.focus();input.select();input.setSelectionRange(0,input.value.length);
      const ok = document.execCommand('copy');
      $('copyStatus').textContent = ok ? '完整源码已复制。' : '已选中全部源码，可使用系统复制或下载按钮。';
    }
  };
  $('saveSource').onclick = () => {
    const url = URL.createObjectURL(new Blob([originalHTML],{type:'text/html;charset=utf-8'}));
    const a = document.createElement('a');
    a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();
    setTimeout(() => URL.revokeObjectURL(url),60000);
  };
}

$('source').onclick = showSource;
function launchArena() {
  const album = document.getElementById('embedded-media');
  const singleDocument = album || document.documentElement.hasAttribute('data-source-bundle');
  if (singleDocument) {
    originalHTML = '<!doctype html>\n' + document.documentElement.outerHTML;
  }
  if (album) {
    embedded = {};
    const chunks = JSON.parse(album.textContent);
    for (const [path, image] of Object.entries(chunks)) {
      embedded[path] = 'data:' + image.mime + ';base64,' + image.data.join('');
    }
    const background = embedded['assets/battlefield.webp'];
    document.documentElement.style.setProperty('--field-art', 'url("' + background + '")');
  }
  display();
  if (location.hash === '#source') showSource();
}
